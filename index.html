<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathology Mastery Engine | POD 242 Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --success: #10b981;
            --danger: #f43f5e;
            --flag: #f59e0b;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }

        .nav-header { padding: 1rem 2rem; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo { font-weight: 800; letter-spacing: 0.1em; font-size: 0.85rem; display: flex; align-items: center; gap: 12px; color: #fff; }
        .pulse { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .app-grid { display: grid; grid-template-columns: 340px 1fr; flex: 1; overflow: hidden; }

        .sidebar { background: rgba(15, 23, 42, 0.4); border-right: 1px solid var(--border); padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
        .chart-wrapper { height: 220px; width: 100%; position: relative; }
        
        .label-id { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; font-weight: 800; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block; }
        .matrix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
        .node { aspect-ratio: 1; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 600; cursor: pointer; color: var(--text-dim); position: relative; transition: all 0.2s; }
        .node.active { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); color: white; }
        .node.correct { border-color: var(--success); color: var(--success); }
        .node.wrong { border-color: var(--danger); color: var(--danger); }
        .node.flagged::before { content: ''; position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; background: var(--flag); border-radius: 50%; border: 2px solid var(--bg); }

        .stage { padding: 2rem 3rem; display: flex; justify-content: center; overflow-y: auto; }
        .content-wrap { max-width: 800px; width: 100%; }

        .viewport { 
            width: 100%; height: 240px; background: #020617; border-radius: 16px; margin-bottom: 2rem; 
            display: none; align-items: center; justify-content: center; border: 1px solid var(--border);
            overflow: hidden; position: relative;
        }
        .viewport img { width: 100%; height: 100%; object-fit: contain; }
        .caption { position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,0.7); padding: 5px 10px; font-size: 0.65rem; font-family: 'JetBrains Mono'; border-radius: 4px; border: 1px solid var(--border); color: var(--accent); }

        .proc-header { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-size: 0.75rem; margin-bottom: 1rem; opacity: 0.8; }
        .q-text { font-size: 1.85rem; font-weight: 800; line-height: 1.3; margin-bottom: 2.5rem; color: #fff; }

        .options { display: grid; gap: 0.85rem; }
        .opt-item { background: var(--panel); border: 1px solid var(--border); padding: 1.25rem 1.75rem; border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 1.25rem; font-size: 1.05rem; font-weight: 500; transition: 0.2s; }
        .opt-item:hover { border-color: var(--accent); transform: translateX(6px); }
        .opt-item.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .opt-item.wrong { border-color: var(--danger); background: rgba(244, 63, 94, 0.1); color: var(--danger); }
        .opt-index { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; opacity: 0.4; }

        .hint-text { margin-top: 1.5rem; padding: 1.25rem; background: rgba(56, 189, 248, 0.05); border: 1px dashed var(--accent); border-radius: 12px; display: none; color: var(--accent); font-size: 0.95rem; line-height: 1.5; }
        .rationale { margin-top: 2rem; padding: 1.75rem; background: rgba(30, 41, 59, 0.6); border-left: 4px solid var(--accent); border-radius: 10px; display: none; line-height: 1.6; color: var(--text-dim); }

        .action-row { margin-top: 3rem; display: flex; gap: 1rem; }
        .btn-ui { padding: 1rem 2rem; border-radius: 10px; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; border: none; transition: 0.2s; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-next { background: var(--success); color: #fff; flex: 1; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body>

<nav class="nav-header">
    <div class="logo"><div class="pulse"></div> PATHOLOGY MASTER CORE // POD 242</div>
    <button class="btn-ui btn-outline" style="padding: 0.5rem 1rem; font-size: 0.6rem;" onclick="wipe()">Reset Progress</button>
</nav>

<div class="app-grid">
    <aside class="sidebar">
        <div class="card">
            <span class="label-id">Domain Mastery Diagnostics</span>
            <div class="chart-wrapper"><canvas id="radarChart"></canvas></div>
        </div>
        <div class="card" style="flex: 1;">
            <span class="label-id">Procedure Matrix</span>
            <div class="matrix" id="matrix"></div>
        </div>
    </aside>

    <main class="stage">
        <div class="content-wrap">
            <div class="viewport" id="viewport">
                <img id="vImg" src="" alt="Specimen">
                <div class="caption" id="vCaption">SPECIMEN // LOADING</div>
            </div>

            <div class="proc-header" id="pID">PROCEDURE // 01</div>
            <div class="q-text" id="qBody">Select a node to begin sequence.</div>
            <div class="options" id="optList"></div>
            
            <div class="hint-text" id="hintBox"></div>
            <div class="rationale" id="ratBox"></div>

            <div class="action-row">
                <button class="btn-ui btn-outline" onclick="toggleHint()">Hint</button>
                <button class="btn-ui btn-outline" style="color: var(--flag);" id="flagBtn" onclick="toggleFlag()">Flag</button>
                <button class="btn-ui btn-next" id="nextBtn" onclick="proceed()">Next Procedure</button>
            </div>
        </div>
    </main>
</div>

<script>
    const fullPool = [
        // ORIGINAL 10 (PRACTICALS & EARLY THEORY)
        { cat: 0, q: "A 25-year-old cyclist has knee pain and morning stiffness. Imaging shows joint space narrowing and osteophytes. Diagnosis?", a: ["Rheumatoid Arthritis", "Osteoarthritis", "Gouty Arthritis", "Scurvy"], c: 1, r: "Osteoarthritis is degenerative, caused by mechanical stress and trauma to cartilage.", h: "Wear and tear etiology.", hasImg: true, label: "X-RAY // KNEE" },
        { cat: 0, q: "A 70-year-old with nocturia has a firm, nodular prostate. Histology shows increased stroma and epithelial density. Diagnosis?", a: ["Adenocarcinoma", "Benign Prostatic Hyperplasia", "Prostatitis", "Atrophy"], c: 1, r: "BPH involves a non-malignant proliferation of epithelial and stromal elements.", h: "Look for increased stromal density.", hasImg: true, label: "HISTO // PROSTATE" },
        { cat: 0, q: "A COVID-19 ARDS lung surface shows a 'cobblestone' gross appearance. This macroscopic hallmark indicates:", a: ["Acute Suppuration", "Widespread Pulmonary Fibrosis", "Bronchiectasis", "Lobar Haemorrhage"], c: 1, r: "Widespread fibrosis causes surface irregularities described as cobblestone gross appearance.", h: "Chronic scarring hallmark.", hasImg: true, label: "GROSS // LUNG" },
        { cat: 0, q: "Lymph node histology reveals malignant cells forming glandular units. What is the interpretation?", a: ["Primary Lymphoma", "Metastatic Adenocarcinoma", "Reactive Node", "Sarcoidosis"], c: 1, r: "Glandular units in a lymph node signify metastatic adenocarcinoma.", h: "Tissue foreign to a node.", hasImg: true, label: "HISTO // NODE" },
        { cat: 0, q: "Multiple 'cannonball' masses are found radiographically in the lung fields. What is the classic primary origin?", a: ["Breast", "Prostate", "Kidney (RCC)", "Colon"], c: 2, r: "Renal Cell Carcinoma classically presents with cannonball metastases in the lung.", h: "Vascular abdominal organ.", hasImg: true, label: "X-RAY // LUNGS" },
        { cat: 1, q: "Which adaptation is characterized by a reversible replacement of one adult cell type with another?", a: ["Hyperplasia", "Dysplasia", "Metaplasia", "Atrophy"], c: 2, r: "Metaplasia is a reversible response to chronic irritation.", h: "Change in cell type." },
        { cat: 2, q: "Which cardinal sign of inflammation was added by Rudolf Virchow?", a: ["Dolor", "Tumor", "Functio laesa", "Rubor"], c: 2, r: "Virchow added Loss of Function to the original four signs of Celsus.", h: "The 5th sign." },
        { cat: 3, q: "What is the structural hallmark collagen found specifically in basement membranes?", a: ["Type 1", "Type 2", "Type 3", "Type 4"], c: 3, r: "Type 4 is the basement membrane collagen.", h: "Basement = 4." },
        { cat: 1, q: "Ischemic injury to the brain classically results in which type of necrosis?", a: ["Coagulative", "Liquefactive", "Caseous", "Fat"], c: 1, r: "CNS ischemia causes liquefaction due to high lipid and enzyme content.", h: "Soft texture." },
        { cat: 3, q: "ACTH secretion in lung cancer causing Cushing's symptoms is a:", a: ["Metastasis", "Paraneoplastic Syndrome", "Cachexia", "Invasion"], c: 1, r: "Paraneoplastic effects occur distant from the tumor mass.", h: "Ectopic hormone." },

        // MERGED 70 QUESTIONS (INDEX 11-80)
        { cat: 0, q: "A 25-year-old cyclist presents with morning stiffness and knee pain. Radiography shows joint space narrowing and osteophytes. What is the aetiology?", a: ["Autoimmune destruction", "Repeated trauma to cartilage", "Urate crystal deposition", "Vitamin D deficiency"], c: 1, r: "Osteoarthritis is a degenerative joint disease caused by mechanical stress/repeated trauma." },
        { cat: 0, q: "A 70-year-old patient with nocturia and a firm, enlarged prostate shows increased gland density and stroma histologically. Diagnosis?", a: ["Prostate Adenocarcinoma", "Benign Prostatic Hyperplasia", "Prostatitis", "Atrophy"], c: 1, r: "BPH is a non-malignant proliferation of epithelial and stromal elements in the prostate." },
        { cat: 0, q: "What is the core histological difference between the abnormal prostate in BPH and a normal prostate?", a: ["Breach of basement membrane", "Loss of all glandular units", "Increased amount of stroma and epithelial cells", "Presence of anaplasia"], c: 2, r: "BPH shows increased density and number of cells, but retains an organized (though disordered) architecture." },
        { cat: 0, q: "A 30-year-old pregnant woman in her 3rd trimester presents with jaundice and acute hepatic failure. Liver biopsy shows microvesicular steatosis. Diagnosis?", a: ["Wilson's Disease", "Acute Fatty Liver of Pregnancy", "Alcoholic Hepatitis", "Hepatitis E"], c: 1, r: "AFLP is a high-yield clinical syndrome presenting in late pregnancy." },
        { cat: 0, q: "What is the biochemical failure responsible for Acute Fatty Liver of Pregnancy (AFLP)?", a: ["Copper transport defect", "Mitochondrial-beta oxidation failure", "Iron overload", "Alpha-1 antitrypsin deficiency"], c: 1, r: "AFLP is associated with a mitochondrial defect in processing fatty acids." },
        { cat: 0, q: "A 19-year-old COVID-19 patient developed ARDS. Autopsy reveals a 'cobblestone' appearance of the lung surface. This macroscopic finding indicates:", a: ["Acute Haemorrhage", "Widespread Pulmonary Fibrosis", "Bronchiectasis", "Lobar Pneumonia"], c: 1, r: "Cobblestone appearance is a gross hallmark of chronic, widespread pulmonary fibrosis." },
        { cat: 0, q: "Histological examination of a COVID-19 ARDS lung shows impaired gaseous exchange. What is the morphological cause?", a: ["Atrophy of alveoli", "Thickened, fibrotic membranes", "Loss of vascularity", "Glandular units formation"], c: 1, r: "Fibrosis impairs the alveolar-capillary membrane, causing restrictive lung disease." },
        { cat: 3, q: "If a cancer spreads via the vasculature, which of these is NOT one of the 4 most likely filter destinations?", a: ["Liver", "Lungs", "Spleen", "Brain"], c: 2, r: "Large vascular organs (Liver, Brain, Bone, Lungs) are the primary sites for hematogenous metastasis." },
        { cat: 3, q: "A biopsy of a lymph node in a cancer patient shows groups of cells trying to form glandular units. What does this indicate?", a: ["Primary lymphoma", "Metastatic Adenocarcinoma", "Normal reactive node", "Sarcoidosis"], c: 1, r: "Glandular unit formation in a lymph node is a classic sign of metastatic adenocarcinoma." },
        { cat: 3, q: "A 55-year-old patient with lung cancer has multiple round masses in the liver. This pattern of spread indicates:", a: ["Primary liver cancer", "Hematogenous metastasis", "Local invasion", "Lymphatic spread"], c: 1, r: "Multiple well-circumscribed nodules in a vascular organ like the liver usually indicate hematogenous spread." },
        { cat: 1, q: "A smoker’s bronchial lining changes from columnar to squamous epithelium. Which adaptation is this?", a: ["Hyperplasia", "Dysplasia", "Metaplasia", "Atrophy"], c: 2, r: "Metaplasia is the reversible replacement of one adult cell type with another better suited to stress." },

        { cat: 3, q: "Which term describes a total loss of cellular differentiation in a malignant tumor?", a: ["Dysplasia", "Anaplasia", "Hyperplasia", "Metaplasia"], c: 1, r: "Anaplasia is a hallmark of malignancy, indicating cells have lost all specialized features." },
        { cat: 1, q: "A patient with long-term hypertension shows thickened left ventricular walls. Which process has occurred?", a: ["Metaplasia", "Hyperplasia", "Hypertrophy", "Atrophy"], c: 2, r: "Permanent tissues like heart muscle adapt by increasing cell size (hypertrophy)." },

        { cat: 3, q: "Which feature describes cells of unequal sizes and shapes in a tumor biopsy?", a: ["Pleomorphism", "Hyperchromasia", "Anaplasia", "Hyperplasia"], c: 0, r: "Pleomorphism is a key microscopic feature of malignant and dysplastic cells." },
        { cat: 1, q: "Which type of necrosis is most likely found in an ischemic brain infarct?", a: ["Coagulative", "Liquefactive", "Caseous", "Fat"], c: 1, r: "CNS ischemia results in liquefactive necrosis due to high lipid content." },
        { cat: 1, q: "What is the result of hypoxic death in solid organs like the kidney or heart?", a: ["Liquefactive", "Coagulative", "Caseous", "Fat"], c: 1, r: "Ischemic injury in most solid organs results in coagulative necrosis." },
        { cat: 1, q: "Which process involves the deposition of calcium in dead or dying tissues despite normal serum calcium?", a: ["Metastatic calcification", "Dystrophic calcification", "Hyalinization", "Fibrosis"], c: 1, r: "Dystrophic calcification occurs in damaged tissues (like aging heart valves) with normal systemic calcium." },
        { cat: 2, q: "Which cardinal sign of inflammation was added by Rudolf Virchow to the classical list?", a: ["Dolor", "Tumor", "Functio laesa", "Calor"], c: 2, r: "Virchow added 'Loss of function' to the original four signs (Heat, Redness, Swelling, Pain)." },

        { cat: 2, q: "Which fluid is characterized by a high protein content and inflammatory cells?", a: ["Transudate", "Exudate", "Serous fluid", "Effusion"], c: 1, r: "Exudates result from increased vascular permeability during inflammation." },
        { cat: 2, q: "In leukocyte extravasation, what step immediately follows 'Rolling'?", a: ["Margination", "Adhesion", "Transmigration", "Chemotaxis"], c: 1, r: "Rolling is followed by firm adhesion via integrins." },
        { cat: 2, q: "Which chemical mediator is primarily responsible for the 'Dolor' (pain) of inflammation?", a: ["Histamine", "Heparin", "Prostaglandins", "Complement"], c: 2, r: "Prostaglandins, made via COX, are the key pain mediators targeted by NSAIDs." },
        { cat: 2, q: "What is the mechanism of action for NSAIDs in reducing inflammation and pain?", a: ["Destroying neutrophils", "Inhibiting cyclo-oxygenase (COX)", "Blocking histamine receptors", "Promoting collagen"], c: 1, r: "NSAIDs inhibit COX to prevent prostaglandin synthesis." },
        { cat: 2, q: "Which growth factor is primarily responsible for neovascularization during repair?", a: ["TGF-beta", "VEGF", "PDGF", "TNF"], c: 1, r: "Vascular Endothelial Growth Factor (VEGF) stimulates the formation of new blood vessels." },
        { cat: 2, q: "Pus (suppuration) is composed primarily of which cell type?", a: ["Lymphocytes", "Plasma cells", "Dead and dying neutrophils", "Fibroblasts"], c: 2, r: "Pus is a purulent exudate rich in neutrophils and cellular debris." },
        { cat: 2, q: "What is the immediate vascular response to injury before vasodilation?", a: ["Permeability increase", "Transient vasoconstriction", "Margination", "Stasis"], c: 1, r: "Injury initially causes a very brief vasoconstriction before prolonged vasodilation." },
        { cat: 2, q: "Which cell arrives 24-48 hours after injury to replace neutrophils in the tissue?", a: ["Eosinophils", "Macrophages", "Basophils", "Plasma cells"], c: 1, r: "Macrophages are the dominant cells in the later stages of acute and throughout chronic inflammation." },
        { cat: 2, q: "Which cell is known as the 'immunoglobulin factory' in chronic inflammation?", a: ["Macrophage", "Plasma cell", "Neutrophil", "Mast cell"], c: 1, r: "Plasma cells, with their clock-face nuclei, secrete antibodies." },
        { cat: 2, q: "What type of collagen is the structural hallmark of the basement membrane?", a: ["Type 1", "Type 2", "Type 3", "Type 4"], c: 3, r: "Type 4 collagen is found specifically in basement membranes." },

        { cat: 2, q: "Which tissue is characterized by new capillaries, fibroblasts, and inflammatory cells?", a: ["Scar tissue", "Granulation tissue", "Necrotic tissue", "Granuloma"], c: 1, r: "Granulation tissue is the hallmark of healthy healing." },

        { cat: 3, q: "Tumors spread to the liver first from the GI tract due to:", a: ["Lymphatic drainage", "Portal venous circulation", "Gravity", "Direct contact"], c: 1, r: "GI blood drains through the portal system directly into the liver filter." },
        { cat: 3, q: "What is the physiological process that maintains blood in a fluid, clot-free state inside an intact vessel?", a: ["Thrombosis", "Embolism", "Haemostasis", "Fibrinolysis"], c: 2, r: "Haemostasis is the physiological process maintaining blood in a fluid state[cite: 20]." },
        { cat: 3, q: "Which step is defined as the formation of a fibrin clot via the coagulation cascade?", a: ["Primary haemostasis", "Secondary haemostasis", "Vascular spasm", "Fibrinolysis"], c: 1, r: "Secondary haemostasis involves fibrin clot formation via the coagulation cascade[cite: 29]." },
        { cat: 3, q: "Normal endothelial cells prevent platelet interaction by secreting which of the following?", a: ["Endothelin", "Nitric oxide and Prostacyclin", "Thromboxane A2", "Von Willebrand Factor"], c: 1, r: "Endothelial cells secrete Nitric oxide and Prostacyclin[cite: 62, 63]." },
        { cat: 3, q: "What is the typical lifespan of a platelet in the circulation?", a: ["120 days", "30 days", "7 - 10 days", "24 hours"], c: 2, r: "Platelets live in the circulation for 7 - 10 days[cite: 91, 93]." },
        { cat: 3, q: "Which clinical state is defined as a diminished circulating platelet concentration?", a: ["Thrombosis", "Thrombocytopaenia", "Haemophilia", "Leukopenia"], c: 1, r: "Thrombocytopaenia means diminished circulating platelet concentration[cite: 89, 99]." },
        { cat: 3, q: "Which triad describes the predisposing factors to thrombosis?", a: ["Virchow's Triad", "Beck's Triad", "Cushing's Triad", "Whipple's Triad"], c: 0, r: "Virchow's Triad includes abnormalities of vessel wall, flow, and constituents[cite: 256]." },
        { cat: 3, q: "Which type of shock is specifically characterized by BRADYCARDIA and WARM DRY SKIN?", a: ["Hypovolemic", "Septic", "Neurogenic", "Cardiogenic"], c: 2, r: "Neurogenic shock is unique for presenting with bradycardia and warm, dry skin [cite: 232-235]." },
        { cat: 3, q: "Which marker is considered the 'gold standard' for detecting cardiac necrosis in an MI?", a: ["Creatine kinase (CK-MB)", "Lactate dehydrogenase (LDH)", "Troponin I and Troponin T", "Myoglobin"], c: 2, r: "Troponin I and T are the gold standard for cardiac necrosis." },
        { cat: 3, q: "In the acronym 'PROVe' for Tetralogy of Fallot, what does the 'O' stand for?", a: ["Obstruction of valve", "Over-riding aorta", "Open ductus", "Oedema"], c: 1, r: "The 'PROVe' acronym includes the Over-riding aorta." },
        { cat: 3, q: "Pathologically, a 'yellow rubbery centre' with a haemorrhagic border indicates an MI of what age?", a: ["Up to 18 hours", "24-48 hours", "3-4 days", "3-6 weeks"], c: 2, r: "A yellow rubbery center appears 3-4 days after the onset." }
    ];

    let cur = 0;
    let state = JSON.parse(localStorage.getItem('path_final_v1')) || { answers: {}, flagged: [] };
    let chart;

    function wipe() { if(confirm("Wipe all progress?")) { localStorage.removeItem('path_final_v1'); location.reload(); } }

    function updateChart() {
        const scores = [0,0,0,0], counts = [0,0,0,0];
        Object.keys(state.answers).forEach(k => {
            const q = fullPool[k];
            counts[q.cat]++;
            if(state.answers[k] === q.c) scores[q.cat]++;
        });
        const perf = scores.map((s, i) => counts[i] === 0 ? 0 : Math.round((s/counts[i])*100));
        const ctx = document.getElementById('radarChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Practical', 'Injury', 'Inflammation', 'Neoplasia'],
                datasets: [{ data: perf, backgroundColor: 'rgba(56, 189, 248, 0.2)', borderColor: '#38bdf8', pointBackgroundColor: '#38bdf8' }]
            },
            options: { scales: { r: { min: 0, max: 100, ticks: { display: false }, grid: { color: 'rgba(255,255,255,0.05)' }, pointLabels: { color: '#94a3b8', font: { size: 9, weight: 'bold' } } } }, plugins: { legend: { display: false } } }
        });
    }

    function render() {
        const grid = document.getElementById('matrix');
        grid.innerHTML = '';
        fullPool.forEach((d, i) => {
            const n = document.createElement('div');
            n.className = `node ${i === cur ? 'active' : ''} ${state.flagged.includes(i) ? 'flagged' : ''}`;
            if(state.answers[i] !== undefined) n.classList.add(state.answers[i] === d.c ? 'correct' : 'wrong');
            n.innerText = i + 1;
            n.onclick = () => { cur = i; render(); };
            grid.appendChild(n);
        });

        updateChart();
        const d = fullPool[cur];
        document.getElementById('pID').innerText = `PROCEDURE // ${String(cur + 1).padStart(2, '0')}`;
        document.getElementById('qBody').innerText = d.q;
        
        const vp = document.getElementById('viewport');
        const vImg = document.getElementById('vImg');
        if(d.hasImg) {
            vp.style.display = 'flex';
            vImg.src = `images/q${cur + 1}.jpg`;
            vImg.onerror = () => { vImg.style.display = 'none'; document.getElementById('vCaption').innerText = "IMG_MISSING // images/q" + (cur+1) + ".jpg"; };
            vImg.onload = () => { vImg.style.display = 'block'; document.getElementById('vCaption').innerText = `SPECIMEN // ${d.label}`; };
        } else {
            vp.style.display = 'none';
        }

        const list = document.getElementById('optList');
        list.innerHTML = '';
        document.getElementById('hintBox').style.display = 'none';
        document.getElementById('ratBox').style.display = 'none';

        d.a.forEach((txt, i) => {
            const opt = document.createElement('div');
            opt.className = `opt-item ${state.answers[cur] !== undefined ? (i === d.c ? 'correct' : (i === state.answers[cur] ? 'wrong' : '')) : ''}`;
            opt.innerHTML = `<span class="opt-index">0${i+1}</span> ${txt}`;
            if(state.answers[cur] === undefined) opt.onclick = () => { state.answers[cur] = i; localStorage.setItem('path_final_v1', JSON.stringify(state)); render(); };
            list.appendChild(opt);
        });

        if(state.answers[cur] !== undefined) {
            document.getElementById('ratBox').innerText = d.r;
            document.getElementById('ratBox').style.display = 'block';
        }
    }

    function proceed() { if(cur < fullPool.length - 1) { cur++; render(); } }
    function toggleHint() { const h = document.getElementById('hintBox'); h.innerText = "HINT: " + (fullPool[cur].h || "Focus on clinical signs."); h.style.display = h.style.display === 'block' ? 'none' : 'block'; }
    function toggleFlag() { if(state.flagged.includes(cur)) state.flagged = state.flagged.filter(id => id !== cur); else state.flagged.push(cur); localStorage.setItem('path_final_v1', JSON.stringify(state)); render(); }

    render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinical Sciences &amp; Medical Study Portal</title>
    <meta name="description" content="Comprehensive clinical sciences and pre-clinical study engine featuring interactive question banks, performance radar diagnostics, histology/radiology viewers, and exam simulations." />
    <meta property="og:title" content="Clinical Sciences &amp; Medical Study Portal" />
    <meta property="og:description" content="Comprehensive clinical sciences and pre-clinical study engine featuring interactive question banks, performance radar diagnostics, histology/radiology viewers, and exam simulations." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Permanent Dark Slate Base: Guarantees background is NEVER white under any network state -->
    <style>
      html, body {
        background-color: #020617 !important;
        color: #f1f5f9 !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      .engine-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #94a3b8;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85rem;
      }
      .engine-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Production stylesheet loader (no crossorigin to prevent GitHub Pages CORS blocking) -->
    <script>
      (function() {
        const isViteDev = window.location.port === '3000' || window.location.hostname.includes('run.app');
        if (!isViteDev) {
          const l = document.createElement('link');
          l.rel = 'stylesheet';
          const p = window.location.pathname;
          const base = p.endsWith('/') ? p : p.substring(0, p.lastIndexOf('/') + 1);
          l.href = (base.endsWith('/') ? base : base + '/') + 'assets/index.css';
          document.head.appendChild(l);
        }
      })();
    </script>
  </head>
  <body class="bg-[#020617] text-[#f1f5f9] antialiased selection:bg-rose-500/30 selection:text-white">
    <div id="root">
      <div id="initial-engine-loader" class="engine-preloader">
        <div class="engine-spinner"></div>
        <div>Loading Clinical Sciences Engine...</div>
      </div>
    </div>

    <!-- Vite development entry point -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Static host fallback (e.g. GitHub Pages without active Vite dev server) -->
    <script>
      (function() {
        const isViteDev = window.location.port === '3000' || window.location.hostname.includes('run.app');
        if (!isViteDev) {
          setTimeout(function() {
            if (!window.__APP_MOUNTED__) {
              const p = window.location.pathname;
              const base = p.endsWith('/') ? p : p.substring(0, p.lastIndexOf('/') + 1);
              const s = document.createElement('script');
              s.type = 'module';
              s.src = (base.endsWith('/') ? base : base + '/') + 'assets/index.js';
              s.onerror = function() {
                const fb = document.createElement('script');
                fb.type = 'module';
                fb.src = './assets/index.js';
                document.body.appendChild(fb);
              };
              document.body.appendChild(s);
            }
          }, 150);
        }
      })();
    </script>
  </body>
</html>

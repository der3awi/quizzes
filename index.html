<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Science Portal | Study Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .header { text-align: center; margin-bottom: 3rem; }
        .header h1 { font-weight: 800; letter-spacing: -0.02em; font-size: 2.5rem; margin-bottom: 0.5rem; }
        .header p { color: var(--accent); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.8rem; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            width: 100%; 
            max-width: 900px; 
        }

        .module-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
            overflow: hidden;
        }

        .module-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            background: rgba(56, 189, 248, 0.05);
        }

        .module-card h2 { font-weight: 800; font-size: 1.25rem; }
        .module-card p { color: var(--text-dim); font-size: 0.9rem; line-height: 1.5; }
        
        .status-tag {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 8px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border-radius: 4px;
            width: fit-content;
        }

        .footer { margin-top: 4rem; color: var(--text-dim); font-size: 0.75rem; letter-spacing: 0.05em; }
    </style>
</head>
<body>

    <div class="header">
        <p>Unified Learning Environment</p>
        <h1>Study Portal</h1>
    </div>

    <div class="grid">
        <a href="pathology/index.html" class="module-card">
            <div class="status-tag">Module Active</div>
            <h2>Pathology Core</h2>
            <p>Practical & Theory Mastery Engine. Covers inflammation, neoplasia, and hemodynamics.</p>
        </a>

        <a href="pharmacology/index.html" class="module-card">
    <div class="status-tag">Module Active</div>
    <h2>Pharmacology Core</h2>
    <p>Mechanism of action, pharmacokinetics, and drug interactions core.</p>
</a>
    </div>

    <div class="footer">POD 242 // SESSION 2026</div>

</body>
</html>

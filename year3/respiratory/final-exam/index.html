<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiratory Final Exam Simulation | RES 352</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
        // Automatic redirection into interactive study engine with module parameter
        const targetUrl = window.location.pathname.includes('/quizzes/') 
            ? '/quizzes/#res-final' 
            : '../../../#res-final';
        window.location.replace(targetUrl);
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020617;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            text-align: center;
        }
        .box {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #fbbf24;
            border-radius: 20px;
            padding: 2.5rem 2rem;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 4px 10px;
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border-radius: 9999px;
            display: inline-block;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.75rem; }
        p { color: #94a3b8; font-size: 0.85rem; line-height: 1.6; margin-bottom: 1.5rem; }
        .btn {
            display: inline-block;
            background: #fbbf24;
            color: #020617;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="box">
        <span class="tag">Assessment Bank • RES 352</span>
        <h1>Final Examination Simulation</h1>
        <p>Loading interactive examination engine with dual Core Practice and Past Exam Recall question banks...</p>
        <a href="../../../#res-final" class="btn">Launch Simulation Directly →</a>
    </div>
</body>
</html>

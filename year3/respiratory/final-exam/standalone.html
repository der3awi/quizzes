        { cat: 2, q: "A 16-year-old male with type 1 diabetes mellitus presents to the emergency department with nausea, abdominal pain, and deep, rapid Kussmaul respirations. Point-of-care capillary blood glucose is 480 mg/dL. An immediate arterial blood gas reveals:<table class='lab-table'><thead><tr><th>Parameter</th><th>Patient Value</th><th>Normal Range</th></tr></thead><tbody><tr><td>pH</td><td>7.24</td><td>7.35 – 7.45</td></tr><tr><td>PaCO2</td><td>38 mmHg</td><td>35 – 45 mmHg</td></tr><tr><td>HCO3</td><td>14 mEq/L</td><td>22 – 26 mEq/L</td></tr><tr><td>PaO2</td><td>96 mmHg</td><td>75 – 100 mmHg</td></tr></tbody></table><span class='q-stem-bold'>Applying the ROME rule and compensation principles, how is this patient's blood gas profile correctly categorized?</span>", a: ["Acute uncompensated metabolic acidosis", "Acute uncompensated respiratory acidosis", "Compensated chronic respiratory alkalosis", "Partially compensated metabolic alkalosis", "Partially compensated respiratory acidosis"], c: 0, r: "Low pH (7.24) and low HCO3 (14 mEq/L) with PaCO2 still inside the normal 35–45 mmHg window (38 mmHg) classifies as uncompensated metabolic acidosis." },
        // Q73
        { cat: 2, q: "A 58-year-old male is admitted to the medical step-down unit with acute dyspnea. A junior resident considers obtaining a venous blood gas (VBG) instead of an arterial blood gas (ABG) to spare the patient an arterial puncture.<span class='q-stem-bold'>According to standard clinical physiology guidelines, which of the following parameters cannot be reliably evaluated from a venous blood gas sample?</span>", a: ["Blood bicarbonate chemical buffer level", "Dissolved carbon dioxide tension (PCO2)", "Dissolved partial pressure of oxygen (PO2)", "Plasma base excess equivalent balance", "Systemic blood hydrogen ion acidity (pH)"], c: 2, r: "Venous blood gases reliably assess pH, PCO2, and HCO3, but cannot provide reliable PO2 data due to variable peripheral tissue oxygen extraction." },
        // Q74
        { cat: 3, q: "A 64-year-old male is admitted with high fever, chills, pleuritic chest pain, and productive cough with rust-colored sputum. Chest radiograph demonstrates dense right middle lobe alveolar consolidation. The admitting physician orders laboratory biomarkers to differentiate acute bacterial pneumonia from viral infection.<span class='q-stem-bold'>Which of the following acute-phase reactants is recognized as a relatively specific biomarker for bacterial pulmonary infection?</span>", a: ["C-reactive protein inflammatory reactant", "Erythrocyte sedimentation rate non-specific marker", "Fibrin degradation D-dimer breakdown fragment", "Procalcitonin acute-phase bacterial reactant", "Total peripheral white blood cell count"], c: 3, r: "Whereas WBC, CRP, ESR, and D-dimer are non-specific, procalcitonin (PCT) is relatively specific for bacterial infections." },
        // Q75
        { cat: 3, q: "A multidisciplinary critical care research team is evaluating novel inflammatory biomarkers in hospitalized patients with severe community-acquired pneumonia to guide early antimicrobial stewardship.<span class='q-stem-bold'>Beyond procalcitonin, which of the following novel biomarkers listed in the respiratory curriculum is relatively specific for bacterial pulmonary infection?</span>", a: ["Alanine aminotransferase hepatic enzyme", "Creatine kinase myocardial isoenzyme band", "Presepsin and soluble TREM-1 biomarkers", "Serum amylase and lipase pancreatic enzymes", "Urine vanillylmandelic acid degradation product"], c: 2, r: "Relatively specific bacterial biomarkers in CAP include procalcitonin (PCT), soluble TREM-1 (sTREM-1), presepsin, pro-ADM, copeptin, and pro-ANP." },
        // Q76
        { cat: 2, q: "A 34-year-old male scuba diver performs a deep wreck dive to 35 meters for 45 minutes. Due to equipment failure, he surfaces rapidly without completing the planned decompression safety stops. Thirty minutes after reaching the boat, he develops severe, deep aching pain localized in his right shoulder and both knees, worsening with limb motion.<span class='q-stem-bold'>Which of the following clinical manifestations of decompression sickness ('the bends') is this diver experiencing?</span>", a: ["Cardiopulmonary chokes decompression syndrome", "Cutaneous cutis marmorata microvascular occlusion", "Lymphatic decompression localized tissue edema", "Musculoskeletal bends deep joint pain", "Vestibular staggers labyrinthine embolization"], c: 3, r: "Musculoskeletal decompression sickness ('the bends') manifests with periarticular joint pain (shoulders, knees, elbows) due to nitrogen bubble formation." },
        // Q77
        { cat: 2, q: "A commercial diver surfaces precipitously from a deep saturation dive. Within 15 minutes, he develops severe substernal chest discomfort, a persistent hacking cough, tachypnea, profound dyspnea, and marked hypoxemia (pulse oximetry 81% on room air).<span class='q-stem-bold'>Which of the following life-threatening presentations of decompression sickness is this diver manifesting?</span>", a: ["Cardiopulmonary decompression syndrome ('the chokes')", "Isolated cutaneous marbling ('cutis marmorata')", "Musculoskeletal articular bubbles ('the bends')", "Spinal cord anterior horn ischemia ('the staggers')", "Vestibular labyrinthine disruption ('the swoons')"], c: 0, r: "Cardiopulmonary decompression sickness ('the chokes') results from nitrogen microbubble embolization in the pulmonary vasculature, presenting with substernal pain, cough, and dyspnea." },
        // Q78
        { cat: 2, q: "A 27-year-old female diver emerges from an ocean dive and notes intense itching across her trunk, shoulders, and thighs. Physical examination reveals patchy, mottled, violaceous and marbled skin discoloration across her abdomen without mucosal involvement or respiratory distress.<span class='q-stem-bold'>Which of the following cutaneous manifestations of decompression sickness is demonstrated in this patient?</span>", a: ["Contact dermatitis secondary to neoprene rubber", "Cutis marmorata mottled vascular discoloration", "Erythema marginatum rheumatic cutaneous rash", "Necrotizing cutaneous bacterial gas crepitus", "Urticarial wheals from aquatic venom sting"], c: 1, r: "Cutaneous decompression sickness presents with itching and mottled, marbled violaceous skin discoloration known as cutis marmorata." },
        // Q79
        { cat: 3, q: "A 66-year-old male with a history of anterior myocardial infarction and chronic left-sided heart failure reports that he cannot sleep flat in bed because he becomes intensely short of breath within two minutes of lying down. He is forced to sleep propped up on three large pillows or upright in an armchair.<span class='q-stem-bold'>Which of the following clinical terms describes this recumbent dyspnea, and what is its primary hemodynamic mechanism?</span>", a: ["Dyspnea on exertion caused by lactic metabolic acidosis", "Orthopnea caused by pulmonary vascular blood redistribution", "Paroxysmal nocturnal dyspnea caused by sleep apnea", "Platypnea caused by right-to-left interatrial shunting", "Trepopnea caused by unilateral diaphragmatic paralysis"], c: 1, r: "Orthopnea is dyspnea in the recumbent position caused by gravitational redistribution of venous blood from the lower extremities into the pulmonary circulation in left heart failure." },
        // Q80
        { cat: 2, q: "A 48-year-old female with acute severe Guillain-Barré syndrome develops progressive weakness of her intercostal muscles and diaphragm. Serial arterial blood gas monitoring shows a progressive rise in her PaCO2 from 40 mmHg up to 64 mmHg alongside a fall in arterial pH from 7.39 to 7.25.<span class='q-stem-bold'>Which of the following ventilatory disorders is directly responsible for this patient's hypercapnia and respiratory acidosis?</span>", a: ["Alveolar hyperventilation causing excessive CO2 loss", "Alveolar hypoventilation causing retention of CO2", "Anatomical right-to-left pulmonary arteriovenous shunt", "Increased dead space ventilation with normal breathing", "Primary metabolic base depletion from renal failure"], c: 1, r: "Respiratory acidosis is directly caused by alveolar hypoventilation, which results in CO2 retention (hypercapnia)." },
        // Q81
        { cat: 3, q: "A 58-year-old male quarry sandblaster presents with progressive exertional dyspnea and dry cough over the past two years. Physical examination reveals fine, 'Velcro-like' bibasilar inspiratory crackles and mild digital clubbing. High-resolution CT shows peripheral, subpleural reticular opacities and honeycombing. Pulmonary function testing demonstrates:<table class='lab-table'><thead><tr><th>Parameter</th><th>Observed</th><th>Predicted Reference</th></tr></thead><tbody><tr><td>FVC</td><td>2.1 L (52%)</td><td>&gt; 80% predicted</td></tr><tr><td>FEV1</td><td>1.8 L (56%)</td><td>&gt; 80% predicted</td></tr><tr><td>FEV1 / FVC</td><td>86%</td><td>70% – 80%</td></tr><tr><td>Total Lung Capacity (TLC)</td><td>3.2 L (55%)</td><td>&gt; 80% predicted</td></tr></tbody></table><span class='q-stem-bold'>Which of the following pathophysiological mechanisms accounts for the normal or elevated FEV1/FVC ratio characteristically seen in restrictive lung disease?</span>", a: ["Accelerated destruction of large airway cartilaginous plates", "Dynamic expiratory compression of small peripheral airways", "Increased parenchymal radial traction stenting airways open", "Loss of chest wall elasticity favoring dynamic hyperinflation", "Loss of pulmonary vascular resistance increasing compliance"], c: 2, r: "In interstitial fibrosis, increased elastic recoil exerts strong radial traction on bronchioles, stenting them open during forced expiration and preserving or increasing the FEV1/FVC ratio." },
        // Q82
        { cat: 1, q: "A pulmonary physiology fellow analyzes flow-volume loops from patients with various respiratory disorders. She reviews a curve from a patient with idiopathic pulmonary fibrosis displaying a normal peak expiratory flow contour but severely reduced vital capacity and total lung volume.<span class='q-stem-bold'>Which of the following visual configurations characteristically describes the flow-volume loop in parenchymal restrictive lung disease?</span>", a: ["A broad, flattened loop with truncated inspiratory limb", "A horizontally shifted loop with dynamic expiratory scooping", "A miniature, narrowed loop with preserved symmetrical contours", "A rectangular box-like contour during both flow phases", "An asymmetric loop showing selective plateau of expiration"], c: 2, r: "Restrictive lung disease produces a miniature, tall, narrow ('witch-hat') flow-volume loop shifted to the right with preserved expiratory contours." },
        // Q83
        { cat: 3, q: "A 62-year-old male with a 40 pack-year smoking history undergoes a routine preoperative chest radiograph prior to elective inguinal hernia repair. The radiologist identifies an incidental, well-circumscribed, non-calcified 2.8 cm solitary focal mass in the right middle lobe.<span class='q-stem-bold'>According to the clinical rule of thumb taught in the respiratory pathology course, how should this radiographic focal mass be managed?</span>", a: ["Assumed to represent active tuberculosis until proven otherwise", "Assumed to represent lung cancer until proven otherwise", "Considered a benign pulmonary hamartoma requiring no workup", "Presumed to be a resolving bacterial pneumonia consolidation", "Treated empirically with broad-spectrum macrolide antibiotics"], c: 1, r: "Clinical rule of thumb: a focal mass on an adult chest X-ray is lung cancer until proven otherwise (except in the lung apices, where TB is more likely)." },
        // Q84
        { cat: 3, q: "A 59-year-old male smoker presents with a 4-month history of a persistent 'brassy' cough and three episodes of frank hemoptysis (coughing up blood-streaked sputum). Bronchoscopy reveals an exophytic mass arising from the right mainstem bronchus with superficial mucosal erosion.<span class='q-stem-bold'>According to the clinicopathological mechanisms of lung cancer symptoms, which of the following mechanisms directly produces his cough and hemoptysis?</span>", a: ["Bronchial mucosal ulceration producing hemoptysis; irritation causing cough", "Compression of the phrenic nerve producing hemoptysis and cough", "Diaphragmatic invasion producing cough; pleural effusion hemoptysis", "Left atrial invasion producing hemoptysis; bronchospasm cough", "Pulmonary infarction producing cough; alveolar exudate hemoptysis"], c: 0, r: "In bronchogenic carcinoma, irritation of the bronchial mucosa triggers cough, while ulceration of the bronchial mucosa into blood vessels causes hemoptysis." },
        // Q85
        { cat: 3, q: "A 67-year-old male with locally advanced non-small cell lung cancer (NSCLC) undergoes staging chest CT with intravenous contrast. The imaging reveals a 6 cm primary tumor arising from the left upper lobe with direct, contiguous tumor invasion into the descending thoracic aorta and the esophagus.<span class='q-stem-bold'>In the TNM staging system, which of the following tumor categories is assigned to this patient, and what does it signify?</span>", a: ["T1 signifying tumor confined to visceral pleura", "T2 signifying tumor causing partial lobar atelectasis", "T3 signifying tumor invading chest wall or pericardium", "T4 signifying direct invasion of adjacent vital organs", "Tis signifying localized non-invasive carcinoma in situ"], c: 3, r: "T4 in the TNM staging system signifies direct tumor invasion into adjacent vital mediastinal organs (e.g., aorta, heart, esophagus, trachea, vertebral body)." },
        // Q86
        { cat: 3, q: "A 61-year-old female is diagnosed with biopsy-proven lung adenocarcinoma following a percutaneous core needle biopsy of a peripheral left lower lobe mass. A preliminary pathology staging form lists her clinical stage as T2 N1 MX.<span class='q-stem-bold'>What does the 'MX' designation specifically signify in the standardized TNM cancer staging system?</span>", a: ["Complete absence of any distant organ metastasis", "Histologically confirmed micrometastasis in bone marrow", "Metastatic involvement of contralateral mediastinal lymph nodes", "Presence of biopsy-proven distant metastatic disease", "Unknown metastatic status due to lack of radiological scans"], c: 4, r: "In TNM staging, M0 = no distant metastases, M1 = distant metastases present, and MX = metastatic status unknown/not yet assessed by imaging." },
        // Q87
        { cat: 3, q: "During a multidisciplinary thoracic oncology conference, the surgical team reviews management strategies for newly diagnosed patients with non-small cell lung cancer (NSCLC), considering tumor anatomical factors and cardiopulmonary functional fitness.<span class='q-stem-bold'>Approximately what percentage of patients with non-small cell lung cancer are suitable candidates for curative surgical resection in clinical practice?</span>", a: ["Approximately 5% of diagnosed patients", "Approximately 20% of diagnosed patients", "Approximately 50% of diagnosed patients", "Approximately 75% of diagnosed patients", "Approximately 95% of diagnosed patients"], c: 1, r: "Only about 20% of NSCLC patients present with localized disease and sufficient cardiopulmonary fitness to be suitable candidates for curative surgical resection." },
        // Q88
        { cat: 3, q: "A 56-year-old male with essential hypertension presents with a 4-week history of a persistent, annoying, dry non-productive cough that worsens at night. He denies fever, chills, postnasal drip, heartburn, or wheezing. A review of his medications reveals he was started on enalapril 10 mg daily 6 weeks ago.<span class='q-stem-bold'>What is the primary mechanism of this patient's drug-induced cough, and what is the definitive management?</span>", a: ["Bradykinin and substance P accumulation; discontinue enalapril", "Direct stimulation of medullary opioid receptors; add codeine", "Hypersensitivity histamine release; add oral antihistamines", "Inhibition of alveolar ENaC channels; administer inhaled steroids", "Mucosal fungal colonization; prescribe oral antifungal troches"], c: 0, r: "ACE inhibitors (enalapril) block degradation of bradykinin and substance P, which accumulate and irritate airway cough receptors; management requires discontinuing the ACE inhibitor." },
        // Q89
        { cat: 3, q: "A 63-year-old male with a history of chronic bronchitis presents with productive cough producing copious thick, purulent green sputum. He requests a prescription for a strong cough suppressant to stop coughing so he can sleep better.<span class='q-stem-bold'>Why are centrally acting cough suppressants (antitussives) generally contraindicated in patients with productive cough secondary to chronic bronchitis?</span>", a: ["They cause dangerous systemic fluid overload and pulmonary edema", "They cause harmful sputum retention leading to secondary infection", "They induce sudden hypertensive crises via alpha-1 stimulation", "They precipitate acute hyperkalemia through aldosterone blockade", "They trigger severe paradoxical bronchoconstriction via muscarinic activation"], c: 1, r: "In productive cough (especially chronic bronchitis or bronchiectasis), suppressing the cough reflex leads to harmful sputum retention, airway plugging, and secondary infection." },
        // Q90
        { cat: 3, q: "A 23-year-old female presents with a tickling, dry, irritating cough following a resolved upper respiratory tract infection. She finds that swallowing warm syrups and lozenges provides prompt, soothing relief.<span class='q-stem-bold'>Which of the following classes of agents relieves dry cough arising above the larynx by forming a soothing protective coating over the pharyngeal mucosa?</span>", a: ["Centrally acting opioid receptor agonists", "Inhaled long-acting antimuscarinic bronchodilators", "Peripheral demulcents containing glycerol syrups", "Peripheral mucolytics that cleave disulfide bonds", "Systemic beta-2 adrenoreceptor agonist tablets"], c: 2, r: "Demulcents (soothing syrups, glycerol, lozenges) relieve dry cough arising above the larynx by forming a protective coating over sensory endings in the pharyngeal mucosa." },
        // Q91
        { cat: 3, q: "A 31-year-old male develops acute tracheobronchitis with a harsh, painful, non-productive cough originating below the larynx. His physician advises non-pharmacological inhalational therapy to soothe irritated lower airway receptors.<span class='q-stem-bold'>According to the pharmacology curriculum, which of the following interventions provides peripheral antitussive relief for cough arising below the larynx?</span>", a: ["Cold dry air hyperventilation through mouth", "Dry powdered sodium chloride aerosol delivery", "High-dose oral codeine phosphate suspension", "Inhaled nebulized hypertonic saline solution", "Water aerosol and warm steam inhalation with menthol"], c: 4, r: "For dry cough originating below the larynx, water aerosol / warm steam inhalation (often with aromatic benzoin, menthol, or eucalyptus) provides soothing peripheral antitussive relief." },
        // Q92
        { cat: 3, q: "A 48-year-old female presents with an intractable dry nocturnal cough following viral bronchitis that is severely disrupting her sleep. Her physician prescribes codeine as a central antitussive agent.<span class='q-stem-bold'>What is the pharmacological mechanism of codeine in cough suppression, and what property contributes to its clinical antitussive efficacy?</span>", a: ["Blocks medullary cough center; efficacy aided by sedating effects", "Blocks pulmonary c-fibers; efficacy aided by bronchodilation", "Cleaves mucus glycoproteins; efficacy aided by expectoration", "Inhibits airway sensory nerves; efficacy aided by local anesthesia", "Stimulates beta-2 receptors; efficacy aided by ciliary clearance"], c: 0, r: "Codeine suppresses the medullary cough center in the brainstem, and part of its clinical antitussive efficacy is aided by its sedating effect." },
        // Q93
        { cat: 3, q: "A 26-year-old commercial airline pilot presents to an outpatient clinic requesting medication for an annoying, dry, tickling cough following a common cold. He emphasizes that he must remain fully alert and non-sedated during daytime work hours.<span class='q-stem-bold'>Which of the following centrally acting opioid antitussive agents is commonly utilized in over-the-counter preparations because it has fewer side effects and lacks significant sedation?</span>", a: ["Codeine phosphate oral elixir", "Dextromethorphan oral syrup", "Hydrocodone polistirex capsule", "Methadone hydrochloride solution", "Morphine sulfate oral solution"], c: 1, r: "Dextromethorphan (and pholcodine) suppresses the medullary cough center with fewer side effects and minimal sedation, making it standard in OTC cough preparations." },
        // Q94
        { cat: 3, q: "A 34-year-old female with moderate persistent asthma experiences daytime wheezing three times per week and nocturnal awakenings twice a month despite daily use of low-dose inhaled budesonide. Her physician prescribes Seretide for maintenance controller therapy.<span class='q-stem-bold'>Which of the following pharmaceutical combinations comprises the active ingredients of the inhaler Seretide?</span>", a: ["Albuterol and ipratropium bromide", "Formoterol and budesonide dipropionate", "Montelukast and theophylline anhydrous", "Salmeterol and fluticasone propionate", "Vilanterol and fluticasone furoate"], c: 3, r: "Seretide is a combination inhaler composed of salmeterol (LABA) and fluticasone propionate (ICS)." },
        // Q95
        { cat: 3, q: "A 42-year-old male with active, drug-susceptible pulmonary tuberculosis successfully completes the 2-month initial intensive phase of standard four-drug therapy (isoniazid, rifampicin, pyrazinamide, and ethambutol). Follow-up sputum smear microscopy is negative for acid-fast bacilli, and liver enzymes are normal.<span class='q-stem-bold'>What is the standard continuation phase regimen and duration for this patient's treatment?</span>", a: ["Continuation phase of 2 months using ethambutol and pyrazinamide", "Continuation phase of 4 months using isoniazid and rifampicin", "Continuation phase of 6 months using rifampicin and ethambutol", "Continuation phase of 9 months using isoniazid and pyrazinamide", "Continuation phase of 12 months using streptomycin and isoniazid"], c: 1, r: "Following the 2-month intensive phase (HRZE), the standard continuation phase for drug-susceptible TB is 4 months of isoniazid (INH) and rifampicin." },
        // Q96
        { cat: 3, q: "A 38-year-old female receiving standard anti-tuberculosis therapy contacts her physician in great distress, reporting that her urine, sweat, and tears have turned a bright orange-red color, staining her contact lenses. She has no fever, abdominal pain, or jaundice.<span class='q-stem-bold'>Which of the following anti-tuberculosis medications is responsible for this side effect, and what major organ toxicity necessitates monitoring?</span>", a: ["Ethambutol, requiring monitoring for visual color blindness", "Isoniazid, requiring monitoring for peripheral neuropathy", "Pyrazinamide, requiring monitoring for acute hyperuricemic gout", "Rifampicin, requiring monitoring for clinical hepatotoxicity", "Streptomycin, requiring monitoring for vestibulocochlear damage"], c: 3, r: "Rifampicin produces harmless orange-red discoloration of body fluids, but carries a risk of hepatotoxicity requiring liver function monitoring." },
        // Q97
        { cat: 3, q: "A community health director gives a grand rounds presentation on population-level strategies for preventing respiratory infections, including pertussis, measles, and influenza. She displays an epidemiological curve demonstrating that when vaccination coverage reaches high thresholds, disease outbreaks cease entirely, even among unimmunized newborns and immunocompromised patients.<span class='q-stem-bold'>Which of the following epidemiological terms describes this indirect population-level protection resulting from high immunization coverage?</span>", a: ["Active polyclonal mucosal hypersensitivity", "Cross-reactive antibody-dependent enhancement", "Herd immunity or community immunity", "Negative predictive serological protection", "Passive maternal vertical transplacental immunity"], c: 2, r: "Herd immunity (community immunity) occurs when widespread vaccination deprives pathogens of susceptible hosts, protecting unimmunized individuals in the community." },
        // Q98
        { cat: 2, q: "A 27-year-old primigravida at 28 weeks of gestation presents for a routine prenatal checkup. She notes mild, non-bothersome shortness of breath when climbing stairs. She is afebrile with normal physical exam. An arterial blood gas drawn as part of a high-altitude travel assessment reveals:<table class='lab-table'><thead><tr><th>Parameter</th><th>Patient Value</th><th>Normal Range</th></tr></thead><tbody><tr><td>pH</td><td>7.44</td><td>7.35 – 7.45</td></tr><tr><td>PaCO2</td><td>30 mmHg</td><td>35 – 45 mmHg</td></tr><tr><td>HCO3</td><td>20 mEq/L</td><td>22 – 26 mEq/L</td></tr><tr><td>PaO2</td><td>102 mmHg</td><td>75 – 100 mmHg</td></tr></tbody></table><span class='q-stem-bold'>Which of the following pregnancy-related hormones is directly responsible for stimulating central respiratory drive to produce this physiological acid-base state?</span>", a: ["Elevated serum human chorionic gonadotropin", "Elevated serum human placental lactogen", "Elevated systemic circulating estrogen levels", "Elevated systemic circulating progesterone levels", "Elevated systemic circulating prolactin levels"], c: 3, r: "During pregnancy, elevated progesterone directly stimulates the medullary respiratory center, increasing tidal volume and minute ventilation to cause compensated chronic respiratory alkalosis." },
        // Q99
        { cat: 0, q: "A 42-year-old male is struck forcefully across the midface with a blunt object, sustaining severe comminuted fractures of the posterior maxilla and lateral nasal wall. Profuse, high-volume venous hemorrhage ensues from the deep infratemporal region.<span class='q-stem-bold'>Nasal mucosal veins accompanying arterial branches that originate from the maxillary artery drain into which of the following venous plexuses?</span>", a: ["Cavernous sinus via superior petrosal tributary", "Facial vein directly through anterior angular vein", "Internal jugular vein via direct lingual branch", "Pterygoid plexus of veins in infratemporal fossa", "Superior sagittal sinus via parietal emissary vein"], c: 3, r: "Nasal veins accompanying branches of the maxillary artery drain into the pterygoid venous plexus located within the infratemporal fossa." },
        // Q100
        { cat: 0, q: "A 2-year-old boy is brought to the pediatric emergency department with a 2-day history of low-grade fever, rhinorrhea, hoarseness, a harsh 'barking' cough, and audible inspiratory stridor that worsens with crying. He is diagnosed with acute viral laryngotracheobronchitis (croup).<span class='q-stem-bold'>Which of the following anatomical characteristics of the young pediatric airway explains why minor mucosal edema causes critical airway narrowing in this infant?</span>", a: ["Cricoid ring is the narrowest non-distensible airway point", "Extrathoracic trachea possesses excessive fibrous cartilage rings", "Hyoid bone is fused solidly to thyroid alar cartilage", "Supraglottic aperture is protected by rigid calcified epiglottis", "Vocal cords are angled downward in an inverted funnel shape"], c: 0, r: "In young children under 8 years of age, the narrowest portion of the upper airway is the subglottic space at the complete, non-distensible cricoid cartilage ring." }
    ];

    let cur = 0;
    let chart;
    const STORAGE_KEY = 'res352_board_bank_v2';

    function getState() {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { answers: {}, flagged: [] };
    }

    function saveState(s) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
    }

    function calculateScore() {
        const state = getState();
        let correct = 0;
        corePool.forEach((q, i) => {
            if (state.answers[i] === q.c) correct++;
        });
        const total = corePool.length;
        const answeredCount = Object.keys(state.answers).length;
        const percent = total > 0 ? Math.round((correct / total) * 100) : 0;
        return { correct, total, answeredCount, percent };
    }

    function showScoreModal() {
        const stats = calculateScore();
        document.getElementById('scorePercent').innerText = `${stats.percent}%`;
        document.getElementById('scoreFraction').innerText = `${stats.correct} / ${stats.total} Correct (${stats.answeredCount} answered)`;
        document.getElementById('scoreModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('scoreModal').style.display = 'none';
    }

    function resetCurrentBank() {
        wipe();
        closeModal();
    }

    function wipe() { 
        if(confirm('Wipe all progress for Respiratory Board Review (100 Qs)?')) { 
            localStorage.removeItem(STORAGE_KEY); 
            render(); 
        } 
    }

    function updateChart() {
        const state = getState();
        const scores = [0, 0, 0, 0], counts = [0, 0, 0, 0];
        
        Object.keys(state.answers).forEach(k => {
            const q = corePool[k];
            if(!q) return; 
            counts[q.cat]++;
            if(state.answers[k] === q.c) scores[q.cat]++;
        });
        
        const perf = scores.map((s, i) => counts[i] === 0 ? 0 : Math.round((s / counts[i]) * 100));
        const ctx = document.getElementById('radarChart').getContext('2d');
        if(chart) chart.destroy();
        
        chart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Anat & Embryo', 'Mech & PFTs', 'Gas & ABGs', 'Path & Pharm'],
                datasets: [{ 
                    data: perf, 
                    backgroundColor: 'rgba(56, 189, 248, 0.2)', 
                    borderColor: '#38bdf8', 
                    pointBackgroundColor: '#38bdf8' 
                }]
            },
            options: { 
                scales: { 
                    r: { 
                        min: 0, 
                        max: 100, 
                        ticks: { display: false }, 
                        grid: { color: 'rgba(255,255,255,0.05)' }, 
                        pointLabels: { color: '#94a3b8', font: { size: 9, weight: 'bold' } } 
                    } 
                }, 
                plugins: { legend: { display: false } } 
            }
        });
    }

    function render() {
        const state = getState();
        const grid = document.getElementById('matrix');
        grid.innerHTML = '';
        
        corePool.forEach((d, i) => {
            const n = document.createElement('div');
            n.className = `node ${i === cur ? 'active' : ''} ${state.flagged.includes(i) ? 'flagged' : ''}`;
            if(state.answers[i] !== undefined) n.classList.add(state.answers[i] === d.c ? 'correct' : 'wrong');
            n.innerText = i + 1;
            n.onclick = () => { cur = i; render(); };
            grid.appendChild(n);
        });

        updateChart();
        const d = corePool[cur];
        document.getElementById('pID').innerText = `RESPIRATORY BOARD // Q${String(cur + 1).padStart(2, '0')}`;
        document.getElementById('qBody').innerHTML = d.q;
        
        const list = document.getElementById('optList');
        list.innerHTML = '';
        document.getElementById('ratBox').style.display = 'none';

        const letters = ['A', 'B', 'C', 'D', 'E'];
        d.a.forEach((txt, i) => {
            const opt = document.createElement('div');
            opt.className = `opt-item ${state.answers[cur] !== undefined ? (i === d.c ? 'correct' : (i === state.answers[cur] ? 'wrong' : '')) : ''}`;
            opt.innerHTML = `<span class="opt-index">${letters[i]}</span> <span>${txt}</span>`;
            if(state.answers[cur] === undefined) {
                opt.onclick = () => { 
                    state.answers[cur] = i; 
                    saveState(state); 
                    render(); 
                };
            }
            list.appendChild(opt);
        });

        if(state.answers[cur] !== undefined) {
            document.getElementById('ratBox').innerText = d.r;
            document.getElementById('ratBox').style.display = 'block';
        }
    }

    function proceed() { 
        if(cur < corePool.length - 1) { 
            cur++; 
            render(); 
        } else {
            showScoreModal();
        }
    }

    function prev() { 
        if(cur > 0) { 
            cur--; 
            render(); 
        } 
    }

    function toggleFlag() { 
        const state = getState();
        if(state.flagged.includes(cur)) {
            state.flagged = state.flagged.filter(id => id !== cur);
        } else {
            state.flagged.push(cur);
        }
        saveState(state); 
        render(); 
    }

    render();
</script>

        .modal-card { background: var(--panel); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; max-width: 440px; width: 90%; text-align: center; padding: 2.5rem 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }

<script>
    // Categories:
    // 0: Anatomy, Embryology & Congenital
    // 1: Mechanics, Volumes & PFTs
    // 2: Gas Exchange, ABGs & Environment
    // 3: Pathology, Infections & Pharm

    const corePool = [
        // Q1 (Replacement 1: Cystic Fibrosis Pathophysiology)
        { cat: 3, q: "A 4-month-old male infant is brought to the pediatric clinic due to chronic failure to thrive, persistent productive cough, and greasy, foul-smelling stools. Laboratory evaluation reveals exocrine pancreatic insufficiency with a fecal elastase concentration of 65 mcg/g (normal >200 mcg/g). Genetic analysis confirms a homozygous F508del mutation in the CFTR gene on chromosome 7.<span class='q-stem-bold'>Which of the following cellular transport abnormalities in the respiratory epithelium directly accounts for the dehydration of the airway surface liquid and formation of hyperviscous mucus in this infant?</span>", a: ["Impaired chloride secretion with compensatory downregulation of epithelial sodium channels", "Decreased chloride ion secretion coupled with unregulated hyperactivation of epithelial sodium channels", "Accelerated secretion of bicarbonate ions promoting excessive osmotic luminal water reabsorption", "Excessive apical extrusion of potassium ions causing secondary osmotic transudation into the submucosa", "Primary defect in ciliary dynein arms preventing active clearance of normally hydrated secretions"], c: 1, r: "In healthy airway epithelium, the CFTR channel secretes chloride and tonically downregulates/inhibits the epithelial sodium channel (ENaC). In cystic fibrosis, mutated CFTR fails to secrete chloride and loses its inhibitory regulation over ENaC, leading to hyperactivated ENaC channels that excessively reabsorb sodium and water from the airway lumen." },
        // Q2 (Replacement 2: Cystic Fibrosis Sweat Test)
        { cat: 3, q: "A 6-week-old female infant is evaluated following an abnormal newborn screening test demonstrating elevated immunoreactive trypsinogen (IRT). The infant was delivered at 39 weeks of gestation, currently weighs 4.4 kg, and has been feeding well without vomiting or respiratory symptoms. A quantitative pilocarpine iontophoresis sweat test is performed on both forearms.<span class='q-stem-bold'>According to international consensus guidelines taught in the curriculum, which of the following sweat chloride concentrations is unequivocally diagnostic of cystic fibrosis?</span>", a: ["A sweat chloride concentration greater than or equal to 30 mmol/L", "A sweat chloride concentration greater than or equal to 45 mmol/L", "A sweat chloride concentration greater than or equal to 60 mmol/L", "A sweat chloride concentration greater than or equal to 75 mmol/L", "A sweat chloride concentration greater than or equal to 90 mmol/L"], c: 2, r: "The quantitative pilocarpine iontophoresis sweat chloride test is the gold standard for CF diagnosis. Results >= 60 mmol/L are diagnostic of CF; 30-59 mmol/L is intermediate/borderline; and < 30 mmol/L makes CF unlikely." },
        // Q3
        { cat: 1, q: "A 52-year-old male with progressive exertional dyspnea is evaluated in the pulmonary clinic. Helium dilution testing reveals a residual volume (RV) of 1,200 mL and an expiratory reserve volume (ERV) of 1,100 mL. Standard spirometry reveals an inspiratory capacity (IC) of 3,500 mL.<span class='q-stem-bold'>What is this patient's calculated Total Lung Capacity (TLC)?</span>", a: ["4,600 mL", "4,700 mL", "5,800 mL", "6,900 mL", "3,500 mL"], c: 2, r: "Total Lung Capacity (TLC) = Vital Capacity (VC) + Residual Volume (RV). Vital capacity = IC + ERV = 3,500 + 1,100 = 4,600 mL. TLC = 4,600 + 1,200 = 5,800 mL." },
        // Q4
        { cat: 3, q: "A 61-year-old male with a 45 pack-year smoking history presents with worsening shortness of breath and chronic productive cough. Physical examination reveals an increased anteroposterior chest diameter ('barrel chest'), hyperresonance to percussion, and distant heart sounds. Spirometry confirms severe airflow limitation. Microscopic examination of lung parenchyma demonstrates destruction of alveolar septa predominantly centered around the respiratory bronchioles in the upper lung lobes, with relative sparing of distal alveoli.<span class='q-stem-bold'>Which of the following is the most likely diagnosis and underlying pathological distribution?</span>", a: ["Centriacinar emphysema, predominantly affecting the upper lung zones associated with cigarette smoke.", "Panacinar emphysema, predominantly affecting the lower lung zones associated with alpha-1-antitrypsin deficiency.", "Distal acinar emphysema, predominantly affecting the subpleural margins associated with spontaneous pneumothorax.", "Chronic bronchitis, predominantly characterized by marked hypertrophy of bronchial smooth muscle and mucus glands.", "Idiopathic pulmonary fibrosis, predominantly characterized by fibroblastic foci and peripheral honeycombing."], c: 0, r: "Emphysema in cigarette smokers is predominantly centriacinar (centrilobular) emphysema, which primarily affects the respiratory bronchioles of the upper lobes." },
        // Q5
        { cat: 3, q: "A medical student observes a professor discussing pulmonary pathology. The professor asks: 'If emphysema is fundamentally a disease characterized by the loss and destruction of alveolar walls, why does it manifest functionally as an obstructive airways disorder with prolonged expiration and air trapping?'<span class='q-stem-bold'>Which of the following best explains the precise pathophysiological mechanism of expiratory obstruction in emphysema?</span>", a: ["Loss of alveolar radial traction and elastic recoil causes premature dynamic collapse of small airways during expiration.", "Excessive goblet cell hyperplasia in large bronchi causes mechanical lumen obstruction with thick mucus plugs.", "Severe hypertrophy of peribronchial smooth muscle leads to irreversible tonic bronchospasm.", "Extensive peri-bronchiolar fibrosis rigidly constricts bronchiolar lumens during both phases of respiration.", "Hypersecretion of surfactant creates excessive airway wall surface tension that collapses terminal bronchioles."], c: 0, r: "Alveolar walls provide radial tethering (elastic traction) that holds small non-cartilaginous bronchioles open. Destruction of alveolar septa eliminates this tethering, leading to premature dynamic airway collapse during active expiration." },
        // Q6
        { cat: 3, q: "A 34-year-old non-smoking male accountant presents with progressive exertional dyspnea and wheezing over the past 2 years. His father died of liver cirrhosis and respiratory failure at age 42. High-resolution CT of the chest demonstrates diffuse, severe emphysematous changes that are most pronounced in the lower lobes bilaterally. Laboratory evaluation reveals abnormal liver enzymes with elevated ALT and AST.<span class='q-stem-bold'>Which of the following is the underlying molecular defect causing this patient's disease?</span>", a: ["Unchecked elastase activity due to a deficiency in an antiprotease enzyme synthesized by hepatocytes.", "Defective cystic fibrosis transmembrane conductance regulator causing dehydration of respiratory mucus.", "Autoantibodies against the non-collagenous domain of type IV collagen in alveolar basement membranes.", "Congenital deficiency of dynein arms causing immotile cilia and bronchiectasis.", "Constitutive overactivation of the epidermal growth factor receptor kinase in bronchiolar epithelium."], c: 0, r: "Panacinar emphysema focused in the lower lobes combined with liver disease is classic for alpha-1-antitrypsin (AAT) deficiency, resulting in unchecked neutrophil elastase destruction of alveolar elastic tissue." },
        // Q7
        { cat: 3, q: "A 58-year-old male with a 35 pack-year smoking history presents to his family physician complaining of a persistent cough that produces copious white-to-yellow sputum almost every morning. He notes that this cough has occurred for at least 4 consecutive months each year over the past 3 consecutive years. On exam, he is cyanotic and overweight, with bilateral coarse crackles and expiratory rhonchi.<span class='q-stem-bold'>What is the standard clinical diagnostic definition met by this patient?</span>", a: ["Chronic bronchitis: persistent productive cough for at least 3 consecutive months in at least 2 consecutive years.", "Bronchiectasis: irreversible permanent dilation of bronchi demonstrated on high-resolution chest CT scan.", "Emphysema: permanent enlargement of airspaces distal to terminal bronchioles with wall destruction.", "Asthma: documented airway hyperresponsiveness with at least 12% and 200 mL reversibility after bronchodilator.", "Simple chronic bronchitis: presence of hyperactive bronchial constriction without mucus production."], c: 0, r: "Chronic bronchitis is clinically defined as a persistent cough productive of sputum for at least 3 months in at least 2 consecutive years." },
        // Q8
        { cat: 1, q: "A 63-year-old former shipyard worker presents with progressive exertional dyspnea and dry cough. Physical exam demonstrates bilateral end-inspiratory fine velcro crackles and digital clubbing. Chest radiography reveals reticular interstitial opacities and pleural plaques. Spirometry is performed.<span class='q-stem-bold'>Which of the following sets of pulmonary function findings is characteristic of this patient's restrictive pulmonary disorder?</span>", a: ["Decreased FVC, decreased FEV1, normal or increased FEV1/FVC ratio, and decreased TLC.", "Normal FVC, markedly decreased FEV1, decreased FEV1/FVC ratio (<0.70), and increased TLC.", "Increased FVC, increased FEV1, markedly decreased FEV1/FVC ratio, and increased FRC.", "Decreased FVC, normal FEV1, markedly decreased FEV1/FVC ratio (<0.60), and normal TLC.", "Normal FVC, normal FEV1, normal FEV1/FVC ratio, and markedly increased residual volume."], c: 0, r: "Restrictive lung disorders (e.g., asbestosis, idiopathic pulmonary fibrosis, sarcoidosis) demonstrate reduced FVC, reduced FEV1, a preserved or increased FEV1/FVC ratio (>=0.80), and decreased Total Lung Capacity (TLC)." },
        // Q9
        { cat: 1, q: "A 48-year-old woman with systemic sclerosis is referred for flow-volume loop spirometry. The technician reviews the generated flow-volume loop. Compared to a healthy reference loop, her curve shows a markedly reduced vital capacity with preserved peak expiratory flow relative to her smaller lung volume. The loop appears tall and narrow, and the entire curve is shifted along the horizontal axis.<span class='q-stem-bold'>Based on the spirometry lecture, which of the following describes the axis shift and configuration of the flow-volume loop in restrictive disease?</span>", a: ["The loop shifts to the right along the volume axis with a narrowed horizontal width and reduced TLC.", "The loop shifts to the left along the volume axis with a wide horizontal width and increased RV.", "The loop demonstrates a scooped-out concave expiratory limb with an extreme shift to the left.", "The loop demonstrates flattening of both the inspiratory and expiratory limbs with no horizontal shift.", "The loop shifts downward below the horizontal zero-flow baseline with a normal vital capacity."], c: 0, r: "In restrictive lung disease, reduced lung compliance and volume shift the flow-volume loop to the right along the volume axis with a narrowed, miniature ('witch-hat') profile." },
        // Q10
        { cat: 1, q: "A 19-year-old college student with acute asthma exacerbation performs spirometry during her clinic visit. The resulting flow-volume curve is compared against her baseline tracing obtained when she was asymptomatic 6 months earlier.<span class='q-stem-bold'>Which of the following specific changes in the expiratory portion of the flow-volume loop is most characteristic of acute asthma?</span>", a: ["Reduced peak expiratory flow with a concave ('scooped-out') appearance of the expiratory curve.", "Sharp, rapid expiratory ascent with an abnormally elevated linear downward slope and normal RV.", "Selective amputation and flattening of only the inspiratory flow curve below the horizontal axis.", "Complete horizontal symmetric narrowing of the loop without altering peak flow rates.", "Shift of the entire curve to the right along the volume axis due to pulmonary stiffness."], c: 0, r: "In acute asthma, narrowed airways increase resistance and impair expiratory flow, producing a reduced PEF and a concave ('scooped-out') expiratory curve." },
        // Q11
        { cat: 3, q: "A 66-year-old male with a 50 pack-year smoking history presents with a 2-month history of worsening cough and hemoptysis. A chest radiograph demonstrates a 4-cm centrally located hilar mass obstructing the right main bronchus with secondary distal atelectasis. Bronchoscopy with biopsy of the mass is performed. Histopathology reveals sheets of polygonal malignant epithelial cells with abundant eosinophilic cytoplasm, prominent intercellular bridges, and swirling foci of keratinization ('keratin pearls').<span class='q-stem-bold'>Which of the following is the most likely diagnosis?</span>", a: ["Squamous cell carcinoma", "Adenocarcinoma", "Small cell lung carcinoma", "Large cell neuroendocrine carcinoma", "Bronchial carcinoid tumor"], c: 0, r: "Squamous cell carcinoma of the lung is classically a central hilar mass in smokers characterized histologically by keratin pearls and intercellular bridges." },
        // Q12 (Replacement 3: Acute Epiglottitis)
        { cat: 3, q: "A 5-year-old unimmunized boy is brought to the emergency department by his parents with acute onset of high fever (39.8°C / 103.6°F), severe throat pain, and difficulty swallowing. On physical examination, the child appears toxic, anxious, and sits leaning forward with his neck extended and mouth open, exhibiting continuous drooling. He has inspiratory stridor, a muffled 'hot potato' voice, and no cough. Lateral neck radiography demonstrates marked swelling of the supraglottic tissues ('thumbprint sign').<span class='q-stem-bold'>Which of the following represents the most appropriate immediate step in the management of this child?</span>", a: ["Direct pharyngeal inspection using a wooden tongue blade to confirm cherry-red epiglottic swelling", "Administration of nebulized racemic epinephrine and high-dose oral dexamethasone in the triage area", "Immediate placement of an intravenous catheter to obtain blood cultures and start broad-spectrum antibiotics", "Controlled airway examination and endotracheal intubation in an operating room with a surgical team on standby", "Emergent flexible fiberoptic laryngoscopy performed bedside while keeping the child in the supine position"], c: 3, r: "Acute epiglottitis (classic 'three Ds': dysphagia, drooling, distress, plus 'thumbprint sign') is a life-threatening airway emergency. The immediate priority is controlled endotracheal intubation in the operating room with an experienced surgical airway team on standby; agitating maneuvers (tongue blades, IV sticks) must be avoided." },
        // Q13
        { cat: 3, q: "A 68-year-old male with long-standing smoking history presents with severe sharp right-sided chest pain that worsens markedly with deep inspiration, coughing, and sneezing. Physical exam reveals a localized pleural friction rub over the right lateral chest wall. Chest CT confirms a peripheral subpleural tumor invading into the parietal pleura with an associated exudative effusion.<span class='q-stem-bold'>Based on the symptoms and mechanisms presented in the lecture, what is the underlying mechanism of this patient's pleuritic chest pain?</span>", a: ["Localized pleural inflammation and friction synchronized with respiratory chest wall movement.", "Mechanical ulceration of the major bronchial mucosa causing bronchospasm.", "Direct stretching of the visceral pleura, which is richly supplied with somatic nociceptive pain fibers.", "Spontaneous erosion into the pulmonary arterial trunk producing ischemic chest pain.", "Irritation of vagal sensory endings located exclusively within the alveolar parenchyma."], c: 0, r: "Pleuritic chest pain is localized pleural pain synchronized with respiration, caused by inflammation or malignant invasion of the somatic-innervated parietal pleura." },
        // Q14
        { cat: 3, q: "During a public health outbreak briefing regarding influenza vaccination, an epidemiologist explains that achieving an 85% immunization rate in a metropolitan area will prevent widespread transmission and protect infants under 6 months of age and individuals with severe combined immunodeficiency who cannot receive live vaccines.<span class='q-stem-bold'>Which of the following immunological and epidemiological principles is being described?</span>", a: ["Herd immunity, where high population coverage denies pathogens sufficient eligible hosts to sustain transmission.", "Passive artificial immunity, where circulating maternal antibodies provide lasting lifelong sterilizing immunity.", "Antigenic shift, where genetic reassortment creates a novel hemagglutinin subtype in non-immune individuals.", "Cross-reactive cell-mediated cytotoxicity, where non-specific natural killer cells eliminate all related respiratory viruses.", "Original antigenic sin, where memory B cells persistently dominate over naive antibody repertoires."], c: 0, r: "Herd (community) immunity occurs when a critical threshold of the population is immunized, depriving a pathogen of eligible hosts to sustain chains of transmission and indirectly protecting unimmunized individuals." },
        // Q15 (Replacement 4: Bilateral Choanal Atresia)
        { cat: 0, q: "A male neonate born at 39 weeks of gestation develops profound cyanosis and severe sternal retractions immediately upon delivery in the labor suite. When the infant cries vigorously, his cyanosis resolves promptly and his oxygen saturation rises to 98% on room air. However, as soon as he calms down and closes his mouth, severe hypoxemia and cyanosis recur. Attempts to gently advance a 6-French catheter through either anterior naris into the nasopharynx meet firm bony obstruction at a depth of 1.5 cm.<span class='q-stem-bold'>Which of the following congenital anomalies is the primary cause of this newborn's cyclical respiratory distress?</span>", a: ["Congenital laryngomalacia with dynamic inspiratory collapse of supraglottic cartilaginous structures", "Bilateral choanal atresia due to persistence of the embryological bucconasal membrane", "Congenital tracheal stenosis secondary to complete circumferential cartilaginous rings", "Unilateral cleft palate with secondary posterior displacement of the tongue into the hypopharynx", "Congenital pulmonary airway malformation resulting in large communicating parenchymal cysts"], c: 1, r: "Newborns are obligate nasal breathers. Bilateral choanal atresia causes cyclical cyanosis that worsens at rest/feeding and resolves when crying (oral breathing), confirmed by failure to pass a nasal catheter into the nasopharynx." },
        // Q16
        { cat: 3, q: "A 10-year-old boy with asthma uses a metered-dose inhaler (MDI) containing fluticasone. His pediatrician notices white curd-like plaques on his buccal mucosa and posterior pharynx that easily scrape off leaving an erythematous base. The pediatrician emphasizes proper inhaler technique and prescribes an add-on device.<span class='q-stem-bold'>Which of the following best describes the clinical benefit of using a spacer device with an inhaled corticosteroid MDI?</span>", a: ["It decreases oropharyngeal drug impaction, reducing local candidiasis, and improves lung deposition.", "It accelerates aerosol particle velocity to ensure rapid drug absorption through the gastric mucosa.", "It chemically conjugates the steroid to albumin to extend its plasma elimination half-life.", "It converts the pressurized liquid suspension into a heated vapor to prevent bronchospasm.", "It completely eliminates the need for daily maintenance dosing by creating a pulmonary depot."], c: 0, r: "Spacer devices slow aerosol droplet velocity and trap large particles in the chamber, decreasing oropharyngeal impaction (preventing oral thrush and hoarseness) while enhancing lower airway delivery." },
        // Q17
        { cat: 3, q: "A 45-year-old immigrant from Southeast Asia with active pulmonary tuberculosis is started on standard four-drug therapy (isoniazid, rifampicin, pyrazinamide, and ethambutol). At his 2-week clinic visit, the patient expresses extreme panic, reporting that his urine and tears have turned bright reddish-orange.<span class='q-stem-bold'>Which of the prescribed medications is responsible for this patient's presentation, and what is the appropriate management?</span>", a: ["Rifampicin; this is a benign, harmless adverse effect, and the patient should be reassured.", "Isoniazid; this indicates severe hepatic failure requiring immediate drug cessation.", "Pyrazinamide; this indicates acute urate nephropathy requiring intravenous hydration.", "Ethambutol; this represents retrobulbar optic leakage requiring urgent ophthalmologic surgery.", "Rifampicin; this indicates acute rhabdomyolysis and myoglobinuria requiring hemodialysis."], c: 0, r: "Rifampicin imparts a harmless reddish-orange discoloration to urine, tears, and sweat; reassuring the patient prevents unnecessary non-adherence." },
        // Q18 (Replacement 5: Tracheoesophageal Fistula Embryology)
        { cat: 0, q: "A newborn female born at 37 weeks of gestation to a mother whose pregnancy was complicated by polyhydramnios presents 20 minutes after birth with copious, frothy oral secretions and mild tachypnea. During her initial attempted feeding, the infant coughs, chokes, and turns transiently cyanotic. A chest radiograph demonstrates a coiled radiopaque feeding tube in the blind-ending upper esophageal pouch and significant gastric distension with bowel gas.<span class='q-stem-bold'>Failure of which of the following embryological events between the 4th and 5th weeks of gestation is responsible for this anomaly?</span>", a: ["Failure of recanalization of the endodermal core filling the primitive laryngeal lumen", "Faulty longitudinal partitioning of the foregut by the tracheoesophageal septum", "Defective cranial closure of the pleuroperitoneal folds within the pericardioperitoneal canals", "Incomplete branching morphogenesis of the secondary and tertiary bronchial lung buds", "Premature regression of the distal segment of the left fourth aortic vascular arch"], c: 1, r: "Proximal esophageal atresia with a distal tracheoesophageal fistula (Type C, ~86.6% of cases) results from faulty partitioning of the primitive foregut by the tracheoesophageal folds/septum during weeks 4–5 of gestation." },
        // Q19
        { cat: 3, q: "A 42-year-old woman undergoing treatment for pulmonary tuberculosis develops numbness, tingling, and burning pain in both feet in a stocking-glove distribution. Physical examination reveals decreased sensation to pinprick and vibration over the bilateral lower extremities.<span class='q-stem-bold'>Which of the following medications is most likely responsible for this neurological complication, and which cofactor deficiency mediates this process?</span>", a: ["Isoniazid; mediated by competition with and deficiency of pyridoxine (vitamin B6).", "Rifampicin; mediated by impaired intestinal absorption of cyanocobalamin (vitamin B12).", "Ethambutol; mediated by inhibition of thiamine pyrophosphokinase (vitamin B1).", "Pyrazinamide; mediated by depletion of nicotinic acid (vitamin B3).", "Streptomycin; mediated by oxidative damage to peripheral Schwann cell mitochondria."], c: 0, r: "Isoniazid (INH) promotes excretion of pyridoxine (vitamin B6) and inhibits pyridoxal phosphokinase, causing peripheral neuropathy that is prevented by vitamin B6 supplementation." },
        // Q20
        { cat: 3, q: "A 31-year-old male presents with a persistent, non-productive dry nocturnal cough following an uncomplicated viral upper respiratory tract infection. He seeks an over-the-counter antitussive that will suppress his cough reflex without causing drowsiness, significant constipation, or opioid addiction potential. He is recommended dextromethorphan.<span class='q-stem-bold'>Which of the following describes the mechanism of action of dextromethorphan in treating cough?</span>", a: ["Centrally acting suppression of the medullary cough center via NMDA/sigma receptor antagonism.", "Peripheral anesthetization of stretch receptors in the respiratory mucosa and pleura.", "Cleavage of disulfide bonds in cross-linked mucoprotein oligomers within bronchial secretions.", "Competitive blockade of muscarinic M3 receptors on postganglionic parasympathetic nerve terminals.", "Selective stimulation of beta-2 adrenergic receptors resulting in bronchial smooth muscle relaxation."], c: 0, r: "Dextromethorphan is a centrally acting antitussive that suppresses the medullary cough center without significant opioid analgesia, sedation, or dependence at standard doses." },
        // Q21
        { cat: 3, q: "A 50-year-old patient with cystic fibrosis is admitted with thick, tenacious, viscous mucus secretions that are difficult to expectorate. The medical team administers an inhaled mucolytic agent whose biochemical mechanism relies on reducing the viscosity of bronchial secretions by breaking mucus polymers.<span class='q-stem-bold'>Which of the following agents acts through this exact biochemical mechanism?</span>", a: ["N-acetylcysteine, which hydrolyzes disulfide bonds in mucoproteins.", "Guaifenesin, which acts as an irritant to stimulate respiratory tract fluid flow.", "Codeine, which binds mu-opioid receptors in the brainstem solitary tract.", "Dextromethorphan, which blocks glutamate transmission in bronchial ganglia.", "Ambroxol, which acts primarily by inhibiting pulmonary surfactant production."], c: 0, r: "N-acetylcysteine contains a free sulfhydryl group that directly cleaves disulfide bonds (-S-S-) in mucoproteins, liquefying thick respiratory secretions." },
        // Q22
        { cat: 1, q: "A premature neonate delivered at 28 weeks of gestation develops severe tachypnea, grunting, nasal flaring, and intercostal retractions within 30 minutes of birth. Arterial blood gas shows severe hypoxemia and respiratory acidosis. Chest radiograph reveals diffuse ground-glass reticulogranular opacities with prominent air bronchograms. The attending neonatologist explains that the neonate's respiratory distress syndrome is primarily due to deficiency of a phospholipid-rich substance that coats alveolar surfaces.<span class='q-stem-bold'>According to the physics and physiology presented in the lecture, what is the primary role of this substance in the alveoli?</span>", a: ["It reduces surface tension, thereby increasing pulmonary compliance and preventing alveolar collapse.", "It increases surface tension, thereby increasing elastic recoil and accelerating expiratory flow.", "It increases alveolar transpulmonary pressure to exceed atmospheric barometric pressure.", "It chemically degrades collagen and elastin fibers within the interalveolar interstitium.", "It prevents pulmonary capillary leakage by directly occluding endothelial tight junctions."], c: 0, r: "Pulmonary surfactant (produced by Type II pneumocytes) reduces alveolar surface tension, increasing lung compliance, reducing the work of breathing, and preventing end-expiratory atelectasis." },
        // Q23 (Replacement 6: Stages of Lung Maturation)
        { cat: 0, q: "A 26-year-old primigravida presents to the labor and delivery unit in active premature labor at 22 weeks of gestation. Ultrasound confirms intact fetal membranes and a single live fetus with normal anatomical morphology. The obstetrical and neonatal intensive care teams counsel the parents regarding the developmental status of the fetal respiratory system and the physiological threshold for extrauterine survival.<span class='q-stem-bold'>Which stage of pulmonary maturation is active at this gestational age, and what is its hallmark anatomical development?</span>", a: ["Pseudoglandular stage, characterized by formation of the bronchial tree up to terminal bronchioles", "Canalicular stage, characterized by formation of respiratory bronchioles and capillary vascularization", "Terminal sac stage, characterized by extensive thinning of type I pneumocytes and mature alveoli", "Alveolar stage, characterized by multiplication of definitive alveoli from secondary connective septa", "Embryonic stage, characterized by initial outpouching of the respiratory diverticulum from foregut"], c: 1, r: "The canalicular stage occurs from weeks 16 to 26 of gestation, characterized by enlargement of bronchial lumina, formation of respiratory bronchioles and alveolar ducts, and prominent capillary vascularization." },
        // Q24
        { cat: 3, q: "A 35-year-old male with chronic asthma inadvertently sprays an organophosphate insecticide in an enclosed garden shed. Within 20 minutes, he develops severe dyspnea, wheezing, diffuse rhonchi, profuse oral secretions, diaphoresis, and pinpoint pupils. His severe bronchoconstriction and hypersecretion are mediated by massive acetylcholine accumulation stimulating airway receptors.<span class='q-stem-bold'>Which of the following receptor types and autonomic pathways mediates this profound bronchoconstriction and mucus hypersecretion?</span>", a: ["Muscarinic M3 receptors stimulated by postganglionic parasympathetic vagal fibers.", "Beta-2 adrenergic receptors stimulated by sympathetic postganglionic adrenergic fibers.", "Alpha-1 adrenergic receptors stimulated by circulating systemic epinephrine.", "Nicotinic neuronal receptors on pulmonary vascular endothelial cells.", "Histamine H2 receptors on respiratory pseudostratified ciliated columnar cells."], c: 0, r: "Parasympathetic vagal fibers release acetylcholine onto muscarinic M3 receptors on bronchial smooth muscle and glands, inducing bronchoconstriction and mucus secretion." },
        // Q25 (Replacement 7: Pediatric Viral Croup Etiology)
        { cat: 3, q: "A 15-month-old girl is brought to the pediatric urgent care clinic by her father due to a 2-day history of clear rhinorrhea, low-grade fever (38.1°C / 100.6°F), and progressive hoarseness. Her father notes that over the past 6 hours, she developed a harsh, barking, 'seal-like' cough and noisy breathing that becomes markedly pronounced whenever she cries or becomes agitated. On physical examination, the child has clear lungs bilaterally, inspiratory stridor at rest, and mild subcostal retractions without drooling or dysphagia.<span class='q-stem-bold'>Which of the following infectious pathogens is the most common etiology of this patient's clinical syndrome?</span>", a: ["Human parainfluenza virus types 1 and 2 causing subglottic inflammatory edema", "Group A beta-hemolytic Streptococcus producing severe tonsillopharyngeal exudates", "Respiratory syncytial virus causing extensive bronchiolar epithelial necrosis and plugging", "Bordetella pertussis causing toxin-mediated lymphocytic leukocytosis and paroxysms", "Haemophilus influenzae type b causing life-threatening supraglottic cellulitis"], c: 0, r: "Croup (acute laryngotracheobronchitis) presents in children under 3 years with hoarseness, barking 'seal-like' cough, and inspiratory stridor due to subglottic edema, most commonly caused by Parainfluenza virus types 1 and 2." },
        // Q26
        { cat: 3, q: "A 22-year-old previously healthy female university student presents with a 10-day history of low-grade fever, non-productive dry hacking cough, sore throat, and bilateral ear pain. Her room-mate had similar symptoms two weeks ago. Physical examination reveals an erythematous posterior pharynx, mild bullous myringitis, and minimal bilateral scattered crackles. Chest radiograph reveals bilateral patchy, diffuse reticular infiltrates that appear significantly worse than suggested by her physical examination.<span class='q-stem-bold'>Which of the following is the most likely pathogen responsible for this presentation of 'walking pneumonia', and what is the first-line oral antibiotic class?</span>", a: ["Mycoplasma pneumoniae; treated with a Macrolide (e.g., azithromycin) or Tetracycline (doxycycline).", "Streptococcus pneumoniae; treated with a First-generation Cephalosporin (cefazolin).", "Klebsiella pneumoniae; treated with an Aminoglycoside (gentamicin) monotherapy.", "Pseudomonas aeruginosa; treated with high-dose oral Amoxicillin.", "Staphylococcus aureus; treated with oral Vancomycin."], c: 0, r: "Mycoplasma pneumoniae causes atypical 'walking' pneumonia with diffuse interstitial infiltrates worse than physical signs. Lacking a peptidoglycan cell wall, it is treated with macrolides or tetracyclines." },
        // Q27
        { cat: 3, q: "A 59-year-old male heavy smoker presents with left shoulder pain radiating down his medial forearm, weakness of his left hand grip, and droopiness of his left eyelid. Physical exam reveals left-sided ptosis, miosis, and facial anhidrosis. Chest radiography reveals an ill-defined focal soft-tissue mass at the extreme apex of the left lung.<span class='q-stem-bold'>Which of the following structures is most likely compressed by this apical tumor to cause his pupillary and eyelid abnormalities?</span>", a: ["Cervicothoracic (stellate) sympathetic chain ganglion", "Oculomotor nerve (CN III) in the superior orbital fissure", "Recurrent laryngeal nerve looping under the aortic arch", "Phrenic nerve traversing along the anterior scalene muscle", "Facial nerve (CN VII) within the stylomastoid foramen"], c: 0, r: "Apical Pancoast (superior sulcus) tumors compress the cervicothoracic (stellate) sympathetic ganglion, causing ipsilateral Horner syndrome (ptosis, miosis, anhidrosis)." },
        // Q28
        { cat: 3, q: "A 64-year-old male with central small cell lung carcinoma is admitted with confusion, lethargy, and seizures. Laboratory evaluation reveals serum sodium of 116 mEq/L (normal 135–145), serum osmolality of 245 mOsm/kg (normal 275–295), and urine osmolality of 520 mOsm/kg. He is euvolemic on examination with no peripheral edema or jugular venous distension.<span class='q-stem-bold'>Which of the following paraneoplastic endocrinopathies is responsible for this patient's severe hyponatremia?</span>", a: ["Ectopic secretion of Arginine Vasopressin (Antidiuretic Hormone) causing SIADH.", "Ectopic secretion of Parathyroid Hormone-related Protein (PTHrP) causing hypercalcemia.", "Ectopic secretion of Adrenocorticotropic Hormone (ACTH) causing secondary hyperaldosteronism.", "Autoantibodies directed against presynaptic P/Q-type voltage-gated calcium channels.", "Hypersecretion of Calcitonin by neuroendocrine medullary carcinoma cells."], c: 0, r: "Small cell lung carcinoma (SCLC) frequently secretes ectopic ADH (arginine vasopressin), causing euvolemic hyponatremia with concentrated urine (SIADH)." },
        // Q29
        { cat: 1, q: "A 60-year-old male with severe emphysema undergoes whole-body plethysmography. Spirometry demonstrates FEV1/FVC of 0.45. Plethysmographic assessment demonstrates a markedly elevated Total Lung Capacity (TLC) of 135% of predicted and a Residual Volume (RV) of 190% of predicted.<span class='q-stem-bold'>Which of the following best explains why residual volume and total lung capacity are increased in this patient?</span>", a: ["Severe loss of pulmonary elastic recoil promotes premature small airway closure and significant air trapping.", "Active contraction of the diaphragm maintains excessive negative intrapleural pressure at end-expiration.", "Proliferation of dense myofibroblasts deposits excessive collagen in the peribronchial spaces.", "Reflex hyperventilation increases tidal volume beyond physiological inspiratory capacity limits.", "Hypertrophy of chest wall skeletal musculature prevents the ribcage from returning to its neutral resting position."], c: 0, r: "Loss of elastic recoil and alveolar radial tethering in emphysema results in premature small airway closure during expiration, trapping air and elevating RV, FRC, and TLC." },
        // Q30
        { cat: 0, q: "A 3-year-old boy is brought to the emergency department after accidentally choking on a raw peanut while running. He has sudden coughing and localized right-sided expiratory wheezing. Chest radiograph demonstrates hyperlucency and air-trapping in the right lower lung lobe during expiration. Flexible bronchoscopy is planned for foreign body retrieval.<span class='q-stem-bold'>Which of the following anatomical features of the right primary bronchus accounts for the predilection of aspirated foreign bodies to lodge in the right bronchial tree?</span>", a: ["The right primary bronchus is wider, shorter, and runs more vertically than the left main bronchus.", "The right primary bronchus is narrower, longer, and branches at a sharper horizontal angle.", "The right primary bronchus lacks hyaline cartilage rings, allowing greater luminal distensibility.", "The right primary bronchus passes directly beneath the aortic arch, narrowing its entrance.", "The right primary bronchus receives a higher velocity jet of air due to the leftward cardiac tilt."], c: 0, r: "The right main bronchus is wider, shorter (~2.5 cm), and oriented more vertically than the left main bronchus, making it the favored path for aspirated foreign objects." },
        // Q31
        { cat: 3, q: "A 71-year-old male with chronic obstructive pulmonary disease presents with high fever, shaking chills, pleuritic chest pain, and productive cough with rust-colored sputum. Physical exam reveals bronchial breath sounds and dullness to percussion over the right middle lobe. Sputum Gram stain reveals abundant lancet-shaped gram-positive diplococci with surrounding halos. Culture demonstrates alpha-hemolytic colonies that are sensitive to optochin and soluble in bile.<span class='q-stem-bold'>Which of the following is the causative organism, and what is its primary virulence factor?</span>", a: ["Streptococcus pneumoniae; polysaccharide capsule that inhibits phagocytosis.", "Staphylococcus aureus; protein A that binds the Fc portion of IgG.", "Klebsiella pneumoniae; hyperviscous mucoid exopolysaccharide capsule.", "Haemophilus influenzae; polyribosylribitol phosphate (PRP) capsule.", "Pseudomonas aeruginosa; exotoxin A that ADP-ribosylates elongation factor 2."], c: 0, r: "Streptococcus pneumoniae is an alpha-hemolytic, optochin-sensitive, bile-soluble gram-positive lancet diplococcus whose main virulence factor is its antiphagocytic polysaccharide capsule." },
        // Q32
        { cat: 3, q: "A 50-year-old male receiving rifampicin, isoniazid, pyrazinamide, and ethambutol for active cavitary tuberculosis complains of exquisite pain, swelling, and redness in his right first metatarsophalangeal joint. Serum uric acid is elevated at 10.4 mg/dL (normal 3.5–7.2). Arthrocentesis reveals needle-shaped, negatively birefringent crystals under polarized light microscopy.<span class='q-stem-bold'>Which of the anti-tuberculosis drugs in this patient's regimen is notorious for competing with uric acid for renal tubular secretion, thereby precipitating acute gout?</span>", a: ["Pyrazinamide", "Rifampicin", "Isoniazid", "Ethambutol", "Streptomycin"], c: 0, r: "Pyrazinamide competes with uric acid for renal proximal tubular secretion, leading to hyperuricemia and acute gouty arthritis." },
        // Q33
        { cat: 3, q: "A 30-year-old male on quadruple anti-tuberculosis therapy undergoes routine vision screening. He reports difficulty distinguishing between the red and green signals at traffic intersections. Automated perimetry confirms a bilateral central scotoma with decreased visual acuity.<span class='q-stem-bold'>Which of the following medications is responsible for this adverse drug reaction, and what monitoring parameter is indicated?</span>", a: ["Ethambutol; causes retrobulbar optic neuritis and requires baseline and periodic red-green visual acuity testing.", "Isoniazid; causes toxic retinopathy and requires routine slit-lamp biomicroscopy.", "Rifampicin; causes corneal orange staining and requires monthly intraocular pressure measurements.", "Pyrazinamide; causes macular degeneration and requires baseline fluorescein angiography.", "Ciprofloxacin; causes retinal detachment and requires annual B-scan ocular ultrasound."], c: 0, r: "Ethambutol causes dose-dependent retrobulbar optic neuritis manifesting as central scotoma and red-green color blindness." },
        // Q34
        { cat: 3, q: "A 35-year-old female living with HIV and stable on an antiretroviral therapy (ART) regimen including efavirenz (a non-nucleoside reverse transcriptase inhibitor) is diagnosed with active pulmonary tuberculosis. Two weeks after starting standard RIPE therapy, her plasma HIV-1 RNA viral load spikes significantly.<span class='q-stem-bold'>Which of the following pharmacological interactions explains this treatment failure of her antiretroviral therapy?</span>", a: ["Rifampicin is a potent inducer of hepatic cytochrome P450 enzymes (CYP3A4), accelerating ART clearance.", "Isoniazid irreversibly inhibits hepatic CYP2C19, causing toxic intracellular ART accumulation.", "Pyrazinamide binds tightly to efavirenz in the gastrointestinal lumen, forming an unabsorbable chelate.", "Ethambutol promotes renal tubular hypersecretion of reverse transcriptase inhibitors.", "Rifampicin directly blocks retroviral CD4 coreceptor binding sites on peripheral T lymphocytes."], c: 0, r: "Rifampicin potently induces hepatic CYP450 enzymes (including CYP3A4), accelerating the hepatic metabolism and clearance of co-administered antiretrovirals." },
        // Q35
        { cat: 3, q: "A 16-year-old boy presents to the emergency room with an acute severe asthma attack. He is tachypneic, speaking in short broken sentences, with widespread expiratory and inspiratory wheezing. He is immediately treated with nebulized albuterol. Within minutes, his dyspnea eases and peak expiratory flow improves significantly.<span class='q-stem-bold'>Which of the following intracellular signaling events is primarily responsible for the rapid bronchodilation induced by albuterol?</span>", a: ["Activation of adenylyl cyclase, increasing intracellular cyclic AMP (cAMP) and activating protein kinase A.", "Direct blockade of voltage-gated L-type calcium channels on airway epithelial ciliated borders.", "Inhibition of phosphodiesterase-4, preventing degradation of cyclic GMP (cGMP) in mast cells.", "Antagonism of cysteinyl leukotriene CysLT1 receptors on bronchiolar vascular smooth muscle.", "Dephosphorylation and nuclear translocation of cytoplasmic glucocorticoid receptors."], c: 0, r: "Albuterol stimulates Gs-coupled beta-2 adrenergic receptors, activating adenylyl cyclase to raise intracellular cAMP and activate PKA, relaxing bronchial smooth muscle." },
        // Q36
        { cat: 3, q: "A 12-year-old girl with mild persistent asthma and aspirin-exacerbated respiratory disease (AERD) experiences recurrent bronchospasm and rhinorrhea. Her pediatric allergist prescribes montelukast as daily oral maintenance therapy.<span class='q-stem-bold'>Which of the following represents the primary mechanism of action of montelukast?</span>", a: ["Selective competitive antagonism of the cysteinyl leukotriene-1 (CysLT1) receptor.", "Direct inhibition of the 5-lipoxygenase (5-LOX) enzyme preventing arachidonate conversion.", "Irreversible acetylation of cyclooxygenase-1 and cyclooxygenase-2 enzymes.", "Stabilization of pulmonary mast cell membranes preventing degranulation of histamine.", "Recombinant monoclonal antibody binding circulating free immunoglobulin E (IgE)."], c: 0, r: "Montelukast is a selective competitive antagonist of CysLT1 receptors, blocking the bronchoconstrictive and inflammatory effects of leukotrienes C4, D4, and E4." },
        // Q37
        { cat: 0, q: "A thoracic surgeon reviews anatomical landmarks prior to performing a right middle lobectomy for a localized benign pulmonary lesion. The surgeon identifies the horizontal and oblique fissures of the lung.<span class='q-stem-bold'>Which of the following anatomical descriptions accurately distinguishes the right lung from the left lung?</span>", a: ["The right lung has three lobes and two fissures (oblique and horizontal), whereas the left lung has two lobes.", "The right lung has two lobes and a deep cardiac notch, whereas the left lung has three lobes.", "The right lung is longer and narrower than the left lung due to the position of the underlying liver.", "The right lung contains the lingula, an anatomical homologue to the left upper lobe apex.", "The right lung has a single pulmonary vein entering the left atrium, whereas the left has three."], c: 0, r: "The right lung consists of 3 lobes separated by 2 fissures (oblique and horizontal), whereas the left lung has 2 lobes separated by 1 oblique fissure and features a cardiac notch and lingula." },
        // Q38
        { cat: 1, q: "A 68-year-old male with severe emphysema and an 80 pack-year smoking history undergoes pulmonary compliance testing. A 62-year-old female with idiopathic pulmonary fibrosis (IPF) undergoes identical testing. The compliance curves (change in lung volume dV plotted against change in transpulmonary pressure dP) are compared to a healthy normal baseline curve.<span class='q-stem-bold'>Which of the following correctly pairs the disease state with its corresponding alteration in static pulmonary compliance?</span>", a: ["Emphysema demonstrates increased compliance (steep curve); Pulmonary fibrosis demonstrates decreased compliance (flattened curve).", "Emphysema demonstrates decreased compliance; Pulmonary fibrosis demonstrates increased compliance.", "Both emphysema and pulmonary fibrosis demonstrate identically increased compliance.", "Both emphysema and pulmonary fibrosis demonstrate identically decreased compliance.", "Emphysema maintains normal compliance; Pulmonary fibrosis demonstrates isolated chest wall hyper-compliance."], c: 0, r: "Loss of elastic tissue in emphysema increases lung compliance (steep curve), whereas interstitial collagen deposition in pulmonary fibrosis decreases lung compliance (stiff, flattened curve)." },
        // Q39
        { cat: 3, q: "A 2-year-old boy is brought to the emergency department at 2:00 AM in late autumn with sudden-onset harsh, barking cough, inspiratory stridor, and hoarseness. His symptoms worsen when he is agitated. His mother states he had a mild runny nose and low-grade fever for the preceding two days. On physical exam, he has mild subcostal retractions and clear breath sounds bilaterally. An anteroposterior soft-tissue neck radiograph reveals symmetric subglottic narrowing ('steeple sign').<span class='q-stem-bold'>Which of the following viral agents is the most frequent cause of this clinical syndrome (croup / acute laryngotracheobronchitis)?</span>", a: ["Parainfluenza virus", "Respiratory syncytial virus", "Adenovirus", "Coxsackievirus A", "Rhinovirus"], c: 0, r: "Acute laryngotracheobronchitis (croup) with barking cough and subglottic 'steeple sign' is most frequently caused by Parainfluenza virus." },
        // Q40
        { cat: 3, q: "A 29-year-old pregnant woman at 18 weeks of gestation presents with acute bacterial maxillary sinusitis and fever. She has a documented severe IgE-mediated anaphylactic reaction to amoxicillin (developed urticaria, angioedema, and airway compromise during childhood). She is prescribed an oral macrolide antibiotic.<span class='q-stem-bold'>Which of the following describes the mechanism of antibacterial action of macrolide antibiotics (e.g., azithromycin, clarithromycin)?</span>", a: ["Reversible binding to the 50S ribosomal subunit, inhibiting peptide translocation.", "Binding to the 30S ribosomal subunit, causing misreading of mRNA codons.", "Inhibition of bacterial DNA gyrase (topoisomerase II) preventing DNA supercoiling.", "Blockade of dihydrofolate reductase preventing tetrahydrofolic acid synthesis.", "Inhibition of transpeptidase enzymes preventing peptidoglycan cell wall cross-linking."], c: 0, r: "Macrolides bind reversibly to the 23S rRNA of the 50S bacterial ribosomal subunit, blocking translocation during protein synthesis." },
        // Q41
        { cat: 0, q: "A 24-year-old male presents to the emergency department with severe headache, high spiking fever, and progressive periorbital edema 5 days after developing a painful furuncle in the anterior vestibule of his nose. Physical examination reveals chemosis, bilateral proptosis, and restricted extraocular eye movements. High-resolution contrast-enhanced CT of the head confirms septic thrombosis of the superior sagittal and cavernous sinuses.<span class='q-stem-bold'>Which of the following venous communications provides the direct anatomical conduit through the anterior cranial fossa for the intracranial spread of this infection?</span>", a: ["An emissary vein traversing the foramen cecum", "An emissary vein traversing the foramen rotundum", "A posterior ethmoidal vein entering superior petrosal", "The infraorbital vein draining into maxillary plexus", "The sphenopalatine vein entering the pterygoid fossa"], c: 0, r: "In some individuals, an emissary vein traverses the foramen cecum in the frontal bone anterior to the crista galli, directly connecting nasal veins with the superior sagittal sinus." },
        // Q42
        { cat: 0, q: "A 32-year-old male undergoes surgical excision of an obstructing polyp from the posterior nasal septum and adjacent hard palate under local anesthesia. The operating otolaryngologist plans a selective nerve block to achieve complete anesthesia of the mucosa covering the posterior aspect of the nasal septum and anterior hard palate.<span class='q-stem-bold'>Which of the following nerves must be selectively anesthetized to block general sensation across this specific mucosal territory?</span>", a: ["The anterior ethmoidal nerve from ophthalmic division", "The greater petrosal nerve from the facial trunk", "The nasopalatine nerve from the maxillary division", "The olfactory nerve filaments within cribriform plate", "The superior cervical ganglion sympathetic gray rami"], c: 2, r: "General sensation to the posterior nasal septum and anterior hard palate is supplied by the nasopalatine nerve (branch of the maxillary nerve, CN V2)." },
        // Q43
        { cat: 0, q: "An 11-year-old boy is brought to the outpatient clinic with mild, recurrent bleeding from his right nostril over the past two days. His mother notes that the bleeding typically follows vigorous digital trauma (nose picking) during dry weather. Anterior rhinoscopy reveals minor mucosal oozing and crusted excoriations localized exclusively to the anterior margin of the nasal vestibule.<span class='q-stem-bold'>Which of the following vascular structures was most likely torn to produce this child's clinical presentation?</span>", a: ["Deep venous plexus located within the nasal vestibule", "Major sphenopalatine arterial trunk in posterior septum", "Pterygoid venous plexus situated in infratemporal fossa", "Ruptured septal branch of the anterior ethmoidal artery", "Superior ophthalmic vein draining to cavernous sinus"], c: 0, r: "While arterial ruptures cause pulsatile spurting, mild epistaxis from nose picking typically tears the veins located in the nasal vestibule." },
        // Q44
        { cat: 0, q: "A male neonate born at 39 weeks of gestation is examined in the newborn nursery. Inspection reveals an accessory nostril located superior to the normal left nostril, displaying a smaller but similar contour to the native aperture. On probing, the tract ends blindly at a depth of 2 mm. The underlying left nasal ala appears depressed, while the primary bilateral nostrils are equal in projection and diameter.<span class='q-stem-bold'>Which of the following congenital anomalies best classifies this infant's developmental physical finding?</span>", a: ["Choanal atresia with posterior bony membranous septation", "Congenital arhinia due to failure of placode formation", "Nasal dermoid sinus cyst with intracranial extension", "Supernumerary nostril ending blindly above native ala", "Unilateral cleft lip with primary maxillary clefting"], c: 3, r: "Supernumerary (accessory) nostril is a rare congenital anomaly characterized by a blind-ending accessory aperture above the native nostril with mild alar depression." },
        // Q45
        { cat: 1, q: "A 45-year-old male is seated quietly in an environmental physiology suite. During the onset of unforced, spontaneous inspiration, contraction and descent of his diaphragm increase the craniocaudal and transverse dimensions of his thoracic cavity.<span class='q-stem-bold'>Which of the following physical laws directly explains the resulting reduction in intrapulmonary (alveolar) pressure relative to atmospheric pressure that drives airflow inward?</span>", a: ["Boyle's law relating inverse pressure to gas volume", "Charles's law relating gas volume to Kelvin temperature", "Dalton's law of additive partial pressures in gas mixtures", "Fick's law of passive molecular diffusion through barriers", "Henry's law relating dissolved gas volume to pressure"], c: 0, r: "Boyle's law (P1V1 = P2V2) states that at constant temperature, gas pressure is inversely proportional to volume; thoracic expansion lowers intrapulmonary pressure below atmospheric pressure." },
        // Q46
        { cat: 1, q: "A 28-year-old healthy male volunteer undergoes esophageal manometry and spirometric assessment during an investigation of chest wall mechanics. At the end of a normal tidal expiration (functional residual capacity), with the glottis open and no airflow occurring, his intrapulmonary alveolar pressure is 0 cmH2O and his intrapleural pressure is measured at -5 cmH2O.<span class='q-stem-bold'>Which of the following mathematical differences defines this subject's transpulmonary (recoil) pressure under these resting conditions?</span>", a: ["Alveolar pressure minus atmospheric barometric pressure", "Alveolar pressure minus intrapleural pleural pressure", "Barometric pressure minus transdiaphragmatic pressure", "Intrapleural pressure minus alveolar airway pressure", "Intrapleural pressure minus transthoracic wall pressure"], c: 1, r: "Transpulmonary (recoil) pressure is the difference between alveolar pressure and intrapleural pressure (Ptp = Palv - Ppl)." },
        // Q47
        { cat: 1, q: "A 35-year-old male undergoes lung function testing in a clinical pulmonary physiology laboratory. Stepwise increments in his transpulmonary pressure are recorded while measuring resulting lung volume changes under quasi-static conditions.<span class='q-stem-bold'>In a normal, healthy adult, by what volume will the lungs expand for each 1 cmH2O increase in transpulmonary pressure?</span>", a: ["Approximately 50 milliliters of air per cmH2O", "Approximately 100 milliliters of air per cmH2O", "Approximately 200 milliliters of air per cmH2O", "Approximately 500 milliliters of air per cmH2O", "Approximately 1000 milliliters of air per cmH2O"], c: 2, r: "Normal total compliance of both lungs combined in an adult is approximately 200 mL of air per cmH2O of transpulmonary pressure." },
        // Q48
        { cat: 1, q: "An experimental histology laboratory investigates the mechanical behavior of human pulmonary parenchymal tissue strips under alternating deflation and inflation tensions in a tissue bath.<span class='q-stem-bold'>Which of the following structural arrangements best describes the conformational state of elastin and collagen fibers within the lung parenchyma during resting deflation?</span>", a: ["Cross-linked covalent lattices resisting any initial tension", "Degraded soluble fragments suspended in surfactant film", "Elastically contracted and kinked conformational arrangements", "Fully elongated rigid rods transmitting maximal recoil force", "Hyperphosphorylated fibrillar complexes anchored to laminin"], c: 2, r: "In deflated lungs, parenchymal elastin and collagen fibers reside in an elastically contracted and kinked state; upon inflation, they unkink and stretch." },
        // Q49
        { cat: 1, q: "A neonatologist explains the biophysical principles governing alveolar stability to a medical student rotating in the neonatal intensive care unit. She presents the formula derived from the Law of LaPlace for spherical structures (P = 2T / r), where P is distending pressure, T is wall surface tension, and r is alveolar radius.<span class='q-stem-bold'>According to this physical law, what would occur in interconnected alveoli of differing radii if surface tension were constant throughout the lung?</span>", a: ["Collapsing pressure would remain identical across all units", "Larger alveoli would require higher pressures to stay open", "Larger alveoli would empty into smaller neighboring units", "Smaller alveoli would require higher distending pressures", "Surface tension would spontaneously drop to zero in all units"], c: 3, r: "By LaPlace's Law (P = 2T/r), smaller alveoli have a smaller radius and generate higher inward collapsing pressures, requiring higher distending pressures to remain open unless surfactant lowers T." },
        // Q50
        { cat: 1, q: "A female infant is delivered via urgent cesarean section at 29 weeks of gestation due to placental abruption. Within 20 minutes of birth, the neonate develops severe tachypnea (respiratory rate 78/min), prominent subcostal retractions, expiratory grunting, and cyanosis on room air. Chest radiography reveals diffuse bilateral 'ground-glass' reticulogranular opacities with prominent air bronchograms.<span class='q-stem-bold'>At what gestational age does the physiological synthesis of pulmonary surfactant typically begin in the developing human fetus?</span>", a: ["After the sixteenth week of intrauterine pregnancy", "After the twentieth week of intrauterine pregnancy", "After the twenty-fourth week of intrauterine pregnancy", "After the thirty-second week of intrauterine pregnancy", "After the thirty-seventh week of intrauterine pregnancy"], c: 3, r: "Physiological synthesis of pulmonary surfactant by Type II pneumocytes begins after the 32nd week of pregnancy; infants born prior are at high risk for IRDS." },
        // Q51
        { cat: 1, q: "A premature infant with severe infant respiratory distress syndrome (IRDS) is found to have extensive alveolar atelectasis accompanied by marked fluid retention in both the pulmonary interstitium and alveolar spaces.<span class='q-stem-bold'>Failure of surfactant to stimulate the functional maturation of which of the following transport channels directly accounts for this persistent intra-alveolar fluid retention?</span>", a: ["Aquaporin-1 water channels on pulmonary capillary endothelia", "Cystic fibrosis transmembrane conductance regulator channels", "Epithelial sodium channels (ENaC) on alveolar pneumocytes", "Sodium-potassium-chloride cotransporters on bronchioles", "Voltage-gated calcium channels on bronchial smooth muscle"], c: 2, r: "Surfactant is required for the functional maturation of epithelial sodium channels (ENaC), which reabsorb sodium and water from the alveoli after birth." },
        // Q52
        { cat: 1, q: "A 60-year-old male hospitalized in the intensive care unit is being managed for acute hypoxemic respiratory failure. During a clinical discussion on factors that suppress alveolar type II pneumocyte metabolic activity, several clinical conditions are evaluated.<span class='q-stem-bold'>Which of the following clinical conditions or interventions is explicitly recognized to cause a decrease in pulmonary surfactant production?</span>", a: ["Antenatal maternal administration of dexamethasone", "Chronic inhalation of 100% supplemental oxygen", "Moderate endurance exercise in cool environments", "Reflex sympathetic stimulation of beta-2 receptors", "Thyroid hormone supplementation in mild hypothyroidism"], c: 1, r: "Surfactant production is decreased by pulmonary artery occlusion, main bronchus occlusion, chronic inhalation of 100% oxygen, and cigarette smoking." },
        // Q53
        { cat: 1, q: "A 25-year-old male medical student undergoes baseline pulmonary function testing as part of a physiology laboratory demonstration. Starting from the end of a normal, quiet expiration (normal expiratory level), he is instructed to inspire with maximal effort, distending his lungs to their greatest possible volume.<span class='q-stem-bold'>Which of the following lung capacities did this student just demonstrate, and what is its typical average normal value?</span>", a: ["Functional residual capacity averaging 2300 milliliters", "Inspiratory capacity averaging 3500 milliliters", "Total lung capacity averaging 5800 milliliters", "Vital capacity averaging 4600 milliliters", "Volume of tidal breathing averaging 500 milliliters"], c: 1, r: "Inspiratory Capacity (IC = VT + IRV) is the maximum volume inspired starting from the normal end-expiratory level, averaging ~3,500 mL." },
        // Q54
        { cat: 1, q: "A 30-year-old healthy male volunteer sits upright and breathes quietly into a closed-circuit spirometer. At the exact nadir of an unforced, resting tidal expiration, airflow ceases momentarily prior to the initiation of the next breath.<span class='q-stem-bold'>Which of the following pulmonary capacities represents the volume of air remaining within his respiratory system at this specific physiological point?</span>", a: ["Expiratory capacity equal to tidal volume plus ERV", "Functional residual capacity equal to ERV plus RV", "Inspiratory capacity equal to tidal volume plus IRV", "Residual volume equal to total capacity minus IC", "Vital capacity equal to total lung volume minus RV"], c: 1, r: "Functional Residual Capacity (FRC = ERV + RV, ~2,300 mL) is the volume of air remaining in the lungs at the end of a normal quiet expiration." },
        // Q55
        { cat: 1, q: "A 40-year-old male athlete undergoes spirometry in both the upright standing and recumbent supine positions. His vital capacity (VC) is measured at 4800 mL while standing, but drops to 4400 mL when measured in the supine position.<span class='q-stem-bold'>Which of the following physiological mechanisms best accounts for the higher vital capacity observed while standing compared to the recumbent position?</span>", a: ["Decreased venous return causing alveolar hypoperfusion", "Gravitational descent of abdominal viscera freeing the diaphragm", "Increased intrapleural pressure compressing alveolar bases", "Reflex sympathetic stimulation of bronchial smooth muscle", "Shift of systemic blood volume into pulmonary capillaries"], c: 1, r: "Vital capacity is higher when standing because gravity pulls abdominal organs downward away from the diaphragm and decreases thoracic vascular blood pooling." },
        // Q56
        { cat: 1, q: "A research study compares pulmonary function parameters between 100 healthy young adult females and 100 healthy young adult males matched for age, physical conditioning, and athletic status.<span class='q-stem-bold'>On average, how do pulmonary volumes and capacities in females compare quantitatively to those measured in males?</span>", a: ["Approximately 5% to 10% greater in females than males", "Approximately 20% to 25% lower in females than males", "Approximately 40% to 50% lower in females than males", "Completely identical after correcting for body weight", "Greater only in expiratory reserve and residual volumes"], c: 1, r: "All pulmonary volumes and capacities are approximately 20% to 25% lower in women than in men." },
        // Q57
        { cat: 1, q: "A 52-year-old male with long-standing dyspnea undergoes comprehensive pulmonary function testing. The technician explains that while tidal volume, inspiratory capacity, and vital capacity can be determined directly with standard bedside water-seal spirometry, certain specific volumes require the helium dilution technique.<span class='q-stem-bold'>Which of the following sets of pulmonary volumes and capacities cannot be measured by direct spirometry alone?</span>", a: ["Inspiratory capacity, tidal volume, and expiratory reserve", "Residual volume, functional residual capacity, and total capacity", "Tidal volume, vital capacity, and inspiratory reserve volume", "Vital capacity, expiratory reserve volume, and tidal volume", "Vital capacity, inspiratory capacity, and expiratory volume"], c: 1, r: "Residual Volume (RV), Functional Residual Capacity (FRC), and Total Lung Capacity (TLC) cannot be measured by direct spirometry and require helium dilution or plethysmography." },
        // Q58
        { cat: 1, q: "A 22-year-old male college sprinter undergoes baseline physiological evaluation at rest. His resting tidal volume (VT) is measured at 500 mL, and his resting respiratory rate is recorded at 14 breaths per minute.<span class='q-stem-bold'>What is this subject's calculated Respiratory Minute Volume (RMV), also termed Pulmonary Ventilation?</span>", a: ["3.5 liters of air per minute", "5.2 liters of air per minute", "7.0 liters of air per minute", "8.8 liters of air per minute", "10.5 liters of air per minute"], c: 2, r: "Respiratory Minute Volume (RMV) = VT x Respiratory Rate = 500 mL x 14 breaths/min = 7,000 mL/min = 7.0 L/min." },
        // Q59
        { cat: 1, q: "The same 22-year-old sprinter (tidal volume 500 mL, respiratory rate 14 breaths per minute) has his anatomical dead space volume (VD) determined to be 150 mL.<span class='q-stem-bold'>What is this athlete's calculated Effective Ventilation Volume (EVV), also known as Alveolar Ventilation?</span>", a: ["2.1 liters of gas per minute", "3.5 liters of gas per minute", "4.9 liters of gas per minute", "6.3 liters of gas per minute", "7.0 liters of gas per minute"], c: 2, r: "Effective Ventilation Volume (Alveolar Ventilation) = (VT - VD) x RR = (500 - 150) x 14 = 350 x 14 = 4,900 mL/min = 4.9 L/min." },
        // Q60
        { cat: 1, q: "A 38-year-old female is evaluated for dyspnea prior to major abdominal surgery. The technician performs a Maximal Breathing Capacity (MBC) test, also termed Maximal Voluntary Ventilation (MVV). The patient breathes as deeply and rapidly as possible through a low-resistance spirometer for 15 seconds, and the total volume exhaled is extrapolated to 1 minute.<span class='q-stem-bold'>Which of the following ranges represents the normal reference value for Maximal Voluntary Ventilation in a healthy adult?</span>", a: ["40 to 70 liters of air per minute", "80 to 110 liters of air per minute", "125 to 170 liters of air per minute", "200 to 250 liters of air per minute", "300 to 350 liters of air per minute"], c: 2, r: "Normal Maximal Voluntary Ventilation (MVV / MBC) is 125 to 170 L/min." },
        // Q61
        { cat: 1, q: "A 19-year-old female with moderate persistent asthma is taught to monitor her airway caliber at home using a portable peak flow meter. She is instructed to inhale to total lung capacity and then exhale forcefully and maximally for 10 milliseconds through the mouthpiece.<span class='q-stem-bold'>What is the expected normal reference range for Peak Expiratory Flow Rate (PEFR), and which airway segment does it primarily assess?</span>", a: ["150 to 250 L/min, assessing peripheral terminal bronchioles", "250 to 350 L/min, assessing alveolar duct elastic recoil", "400 to 600 L/min, assessing caliber of larger airways", "650 to 800 L/min, assessing small non-cartilaginous airways", "850 to 1000 L/min, assessing respiratory capillary diffusion"], c: 2, r: "Normal PEFR is 400 to 600 L/min and primarily reflects the caliber of larger conducting airways (reduced in asthma, unreliable in small airway disease like emphysema)." },
        // Q62
        { cat: 1, q: "A 28-year-old male volunteer with normal respiratory mechanics completes a Forced Vital Capacity (FVC) maneuver in a pulmonary physiology laboratory. His timed expired volumes are recorded sequentially at 1, 2, and 3 seconds.<span class='q-stem-bold'>Which of the following percentage sequences represents the normal physiological values for FEV1, FEV2, and FEV3 expressed as a fraction of total FVC?</span>", a: ["FEV1 = 65%, FEV2 = 75%, and FEV3 = 85%", "FEV1 = 70%, FEV2 = 80%, and FEV3 = 90%", "FEV1 = 75%, FEV2 = 85%, and FEV3 = 95%", "FEV1 = 83%, FEV2 = 90%, and FEV3 = 97%", "FEV1 = 95%, FEV2 = 98%, and FEV3 = 100%"], c: 3, r: "In healthy adults, FVC is exhaled within 3 seconds with normal timed percentages of FEV1 = 83%, FEV2 = 90%, and FEV3 = 97%." },
        // Q63
        { cat: 1, q: "A 29-year-old female presents with chronic episodic dry cough, especially noticeable at night and during cold weather runs. Baseline spirometry shows an FEV1 of 94% of predicted and an FEV1/FVC ratio of 81%. To evaluate for suspected cough-variant asthma, she undergoes bronchochallenge testing with graded concentrations of inhaled methacholine.<span class='q-stem-bold'>Which of the following criteria defines a positive bronchochallenge test diagnostic of airway hyperresponsiveness?</span>", a: ["A 10% decrease in baseline forced vital capacity", "A 20% decrease in baseline forced expiratory volume (FEV1)", "A 35% decrease in baseline peak expiratory flow rate", "A 50% decrease in baseline maximal voluntary ventilation", "An 80% decrease in baseline airway conductance resistance"], c: 1, r: "A positive methacholine or histamine bronchochallenge test is defined by a >= 20% decrease in baseline FEV1." },
        // Q64
        { cat: 2, q: "A 55-year-old female with progressive exertional dyspnea undergoes diagnostic right heart catheterization to evaluate her cardiopulmonary hemodynamics at rest.<span class='q-stem-bold'>Which of the following sets of pressures reflects the normal physiological values within the human pulmonary circulation?</span>", a: ["Systolic 15 mmHg, diastolic 5 mmHg, mean arterial 10 mmHg, capillary 4 mmHg", "Systolic 25 mmHg, diastolic 8–12 mmHg, mean arterial 15 mmHg, capillary 7 mmHg", "Systolic 40 mmHg, diastolic 18 mmHg, mean arterial 25 mmHg, capillary 14 mmHg", "Systolic 60 mmHg, diastolic 25 mmHg, mean arterial 35 mmHg, capillary 18 mmHg", "Systolic 120 mmHg, diastolic 80 mmHg, mean arterial 93 mmHg, capillary 25 mmHg"], c: 1, r: "Normal pulmonary arterial pressures are systolic ~25 mmHg, diastolic 8–12 mmHg, mean pulmonary arterial pressure ~15 mmHg, and mean capillary pressure ~7 mmHg." },
        // Q65
        { cat: 2, q: "A 45-year-old male with early interstitial pulmonary fibrosis undergoes evaluation for exertional dyspnea. Arterial blood gas analysis reveals a resting PaO2 of 80 mmHg with a normal PaCO2 of 38 mmHg. During exercise testing, his PaO2 drops sharply to 62 mmHg, whereas his PaCO2 remains normal at 39 mmHg.<span class='q-stem-bold'>Which of the following physical properties explains why carbon dioxide transfer across the blood-gas barrier is preserved despite structural thickening that impairs oxygen diffusion?</span>", a: ["CO2 has a diffusing capacity approximately 20 times that of oxygen", "CO2 is actively transported by apical epithelial transport pumps", "CO2 utilizes transcellular hemoglobin channels across pneumocytes", "O2 has a much higher liquid solubility constant than CO2", "Oxygen binds more tightly to plasma albumin than carbon dioxide"], c: 0, r: "Because CO2 is ~24 times more soluble in water/membranes than O2, its diffusing capacity across the blood-gas barrier is approximately 20 times higher than that of oxygen." },
        // Q66
        { cat: 2, q: "In a medical physiology laboratory, students analyze time-course curves illustrating the partial pressure of different gases in pulmonary capillary blood as it traverses an alveolar capillary of normal length (transit time ~ 0.75 seconds at rest). For a healthy volunteer breathing room air, capillary blood PO2 reaches complete equilibrium with alveolar PO2 within the first 0.25 seconds (one-third) of capillary transit.<span class='q-stem-bold'>Under normal resting physiological conditions, which of the following terms correctly classifies the gas exchange kinetics for oxygen and nitrous oxide (N2O)?</span>", a: ["Active ATP-dependent transport gas exchange", "Carrier-saturated facilitated diffusion kinetics", "Diffusion-limited alveolar gas exchange", "Perfusion-limited pulmonary gas exchange", "Surface-area-independent bulk transport"], c: 3, r: "At rest, O2, CO2, and N2O equilibrate completely within the first third of capillary transit (~0.25 s); thus, total transfer depends solely on pulmonary blood flow (perfusion-limited)." },
        // Q67
        { cat: 2, q: "A 26-year-old male athlete performs high-intensity running on an inclined treadmill. As his cardiac output increases from a resting baseline of 5 L/min up to 25 L/min, invasive measurements confirm that his pulmonary diffusing capacity for both oxygen and carbon dioxide increases more than twofold.<span class='q-stem-bold'>Which of the following microvascular adaptations in the pulmonary circulation is primarily responsible for this marked increase in diffusing capacity during exercise?</span>", a: ["Active vasoconstriction of apical Zone 1 pulmonary arterioles", "Capillary recruitment and distension expanding effective surface area", "Increased thickness of the alveolar-capillary basement membrane", "Reduction in red blood cell 2,3-bisphosphoglycerate concentration", "Suppression of alveolar epithelial sodium channel fluid reabsorption"], c: 1, r: "During exercise, recruitment of previously closed apical capillaries and distension of open capillaries markedly expands the effective gas-exchanging surface area." },
        // Q68
        { cat: 2, q: "A 21-year-old male is brought to the emergency department by friends after being found unresponsive in a bathroom. Physical examination reveals a respiratory rate of 6 breaths per minute, shallow breathing, cyanotic lips, and pinpoint pupils. Arterial blood gas (ABG) drawn on room air reveals:<table class='lab-table'><thead><tr><th>Parameter</th><th>Patient Value</th><th>Normal Range</th></tr></thead><tbody><tr><td>pH</td><td>7.22</td><td>7.35 – 7.45</td></tr><tr><td>PaCO2</td><td>68 mmHg</td><td>35 – 45 mmHg</td></tr><tr><td>HCO3</td><td>24 mEq/L</td><td>22 – 26 mEq/L</td></tr><tr><td>PaO2</td><td>54 mmHg</td><td>75 – 100 mmHg</td></tr><tr><td>O2 Sat</td><td>84%</td><td>94 – 100%</td></tr></tbody></table><span class='q-stem-bold'>Which of the following acid-base disturbances is present in this patient?</span>", a: ["Compensated chronic respiratory acidemic disorder", "Partially compensated metabolic alkalotic disorder", "Partially compensated respiratory acidemic disorder", "Uncompensated acute metabolic alkalotic disturbance", "Uncompensated acute respiratory acidemic disorder"], c: 4, r: "pH is low (7.22) and PaCO2 is high (68 mmHg) while HCO3 remains normal (24 mEq/L), defining uncompensated acute respiratory acidosis secondary to opioid respiratory depression." },
        // Q69
        { cat: 2, q: "A 68-year-old male with a 50 pack-year smoking history and severe chronic obstructive pulmonary disease (COPD) undergoes routine arterial blood gas analysis during an elective pre-operative evaluation. He is alert and oriented, sitting comfortably on room air:<table class='lab-table'><thead><tr><th>Parameter</th><th>Patient Value</th><th>Normal Range</th></tr></thead><tbody><tr><td>pH</td><td>7.36</td><td>7.35 – 7.45</td></tr><tr><td>PaCO2</td><td>58 mmHg</td><td>35 – 45 mmHg</td></tr><tr><td>HCO3</td><td>32 mEq/L</td><td>22 – 26 mEq/L</td></tr><tr><td>PaO2</td><td>68 mmHg</td><td>75 – 100 mmHg</td></tr><tr><td>O2 Sat</td><td>92%</td><td>94 – 100%</td></tr></tbody></table><span class='q-stem-bold'>Which of the following acid-base states is demonstrated by these blood gas results?</span>", a: ["Acute uncompensated metabolic acidemic state", "Acute uncompensated respiratory acidemic state", "Fully compensated chronic respiratory acidosis", "Partially compensated acute respiratory acidosis", "Partially compensated primary metabolic alkalosis"], c: 2, r: "pH is within the normal range (7.36) on the acidic side, with elevated PaCO2 (58 mmHg) buffered by renal bicarbonate retention (HCO3 32 mEq/L), indicating fully compensated chronic respiratory acidosis." },
        // Q70
        { cat: 2, q: "A 72-year-old female with chronic bronchitis is admitted to the hospital with a 3-day history of worsening productive cough, fever, and dyspnea. Arterial blood gas analysis on 2 L/min nasal cannula oxygen shows:<table class='lab-table'><thead><tr><th>Parameter</th><th>Patient Value</th><th>Normal Range</th></tr></thead><tbody><tr><td>pH</td><td>7.30</td><td>7.35 – 7.45</td></tr><tr><td>PaCO2</td><td>60 mmHg</td><td>35 – 45 mmHg</td></tr><tr><td>HCO3</td><td>29 mEq/L</td><td>22 – 26 mEq/L</td></tr><tr><td>PaO2</td><td>62 mmHg</td><td>75 – 100 mmHg</td></tr></tbody></table><span class='q-stem-bold'>Based on the standard clinical ABG interpretation algorithm, what is the correct diagnosis?</span>", a: ["Acute uncompensated metabolic alkalosis", "Acute uncompensated respiratory acidosis", "Fully compensated respiratory acidosis", "Partially compensated respiratory acidosis", "Primary uncompensated metabolic acidosis"], c: 3, r: "Acidemic pH (7.30) + elevated PaCO2 (60 mmHg) + elevated HCO3 (29 mEq/L) indicates partially compensated respiratory acidosis." },
        // Q71
        { cat: 2, q: "A 19-year-old female university student presents to the urgent care clinic during final examinations experiencing severe anxiety, palpitations, dizziness, and carpopedal spasms in both hands. Physical examination reveals a respiratory rate of 34 breaths per minute and clear breath sounds. Arterial blood gas reveals:<table class='lab-table'><thead><tr><th>Parameter</th><th>Patient Value</th><th>Normal Range</th></tr></thead><tbody><tr><td>pH</td><td>7.56</td><td>7.35 – 7.45</td></tr><tr><td>PaCO2</td><td>24 mmHg</td><td>35 – 45 mmHg</td></tr><tr><td>HCO3</td><td>23 mEq/L</td><td>22 – 26 mEq/L</td></tr><tr><td>PaO2</td><td>108 mmHg</td><td>75 – 100 mmHg</td></tr></tbody></table><span class='q-stem-bold'>Which of the following acid-base disturbances is present in this student?</span>", a: ["Acute uncompensated metabolic alkalosis", "Acute uncompensated respiratory alkalosis", "Compensated chronic respiratory alkalosis", "Partially compensated metabolic acidosis", "Partially compensated respiratory alkalosis"], c: 1, r: "Alkalemic pH (7.56) + low PaCO2 (24 mmHg) + normal HCO3 (23 mEq/L) confirms acute uncompensated respiratory alkalosis caused by hyperventilation." },
        // Q72

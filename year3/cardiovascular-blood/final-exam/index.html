    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #f43f5e; /* Crimson for CVS */
            --accent-gold: #fbbf24;
            --success: #10b981;
            --danger: #f43f5e;
            --flag: #f59e0b;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }

        .nav-header { padding: 0.85rem 2rem; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100; gap: 1rem; }
        .logo { font-weight: 800; letter-spacing: 0.1em; font-size: 0.85rem; display: flex; align-items: center; gap: 12px; color: #fff; }
        .pulse { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .tab-switcher {
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
            gap: 4px;
        }
        .mode-tab {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mode-tab:hover { color: #fff; }
        .mode-tab.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px rgba(244, 63, 94, 0.4);
        }
        .mode-tab.past-active {
            background: var(--accent-gold);
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(251, 191, 36, 0.4);
        }

        .app-grid { display: grid; grid-template-columns: 340px 1fr; flex: 1; overflow: hidden; }

        .sidebar { background: rgba(15, 23, 42, 0.4); border-right: 1px solid var(--border); padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
        .chart-wrapper { height: 220px; width: 100%; position: relative; }
        
        .label-id { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; font-weight: 800; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block; }
        .matrix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
        .node { aspect-ratio: 1; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.68rem; font-weight: 600; cursor: pointer; color: var(--text-dim); position: relative; transition: all 0.2s; }
        .node.active { border-color: var(--accent); background: rgba(244, 63, 94, 0.12); color: white; }
        .node.past-active { border-color: var(--accent-gold); background: rgba(251, 191, 36, 0.15); color: white; }
        .node.correct { border-color: var(--success); color: var(--success); }
        .node.wrong { border-color: var(--danger); color: var(--danger); }
        .node.flagged::before { content: ''; position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; background: var(--flag); border-radius: 50%; border: 2px solid var(--bg); }

        .stage { padding: 2rem 3rem; display: flex; justify-content: center; overflow-y: auto; }
        .content-wrap { max-width: 800px; width: 100%; }

        .proc-header { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-size: 0.75rem; margin-bottom: 1rem; opacity: 0.8; }
        .q-text { font-size: 1.25rem; font-weight: 700; line-height: 1.5; margin-bottom: 2rem; color: #fff; }

        .options { display: grid; gap: 0.85rem; }
        .opt-item { background: var(--panel); border: 1px solid var(--border); padding: 1.15rem 1.5rem; border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 1.25rem; font-size: 0.98rem; font-weight: 500; transition: 0.2s; }
        .opt-item:hover { border-color: var(--accent); transform: translateX(6px); }
        .opt-item.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .opt-item.wrong { border-color: var(--danger); background: rgba(244, 63, 94, 0.1); color: var(--danger); }
        .opt-index { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; opacity: 0.4; flex-shrink: 0; }

        .rationale { margin-top: 2rem; padding: 1.5rem; background: rgba(30, 41, 59, 0.6); border-left: 4px solid var(--accent); border-radius: 10px; display: none; line-height: 1.6; color: var(--text-dim); font-size: 0.92rem; }

        .action-row { margin-top: 2.5rem; display: flex; gap: 1rem; }
        .btn-ui { padding: 0.9rem 1.75rem; border-radius: 10px; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; border: none; transition: 0.2s; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.05); }
        .btn-next { background: var(--accent); color: #fff; flex: 1; box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3); }
        .btn-next:hover { opacity: 0.95; }
        
        .hub-link { color: var(--text-dim); text-decoration: none; font-size: 0.75rem; font-weight: 700; transition: 0.2s; display: inline-flex; align-items: center; }
        .hub-link:hover { color: var(--text); }

        /* End Score Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); z-index: 200; align-items: center; justify-content: center; }
        .modal-card { background: var(--panel); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; max-width: 440px; width: 90%; text-align: center; padding: 2.5rem 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    </style>

<script>
    // Categories:
    // 0: Anatomy & Development
    // 1: Physiology & Hemodynamics
    // 2: Hematology & Coagulation
    // 3: Pathology & Pharmacology

    const corePool = [
        { cat: 0, q: "A 45-year-old male presents with acute cardiac tamponade due to a massive pericardial effusion. Emergency pericardiocentesis is performed using a subxiphoid approach. Which layer of the pericardial sac is traversed immediately after the needle penetrates the fibrous pericardium?", a: ["Parietal serous pericardium", "Visceral serous pericardium (epicardium)", "Myocardium", "Endocardium"], c: 0, r: "The pericardium consists of an outer tough fibrous pericardium lined internally by the parietal layer of the serous pericardium. Piercing the fibrous pericardium immediately enters through the closely adherent parietal serous pericardium into the pericardial cavity." },
        { cat: 0, q: "During fetal circulation, highly oxygenated blood returning from the placenta enters the right atrium via the inferior vena cava (IVC). By which anatomical mechanism is this oxygen-rich stream preferentially shunted into the left atrium?", a: ["High pulmonary vascular resistance diverting flow backward into the superior vena cava", "Guidance by the valve of the inferior vena cava (Eustachian valve) across the foramen ovale", "Active contraction of the pectinate muscles within the right auricle", "Direct streaming through the ductus venosus into the left coronary vein"], c: 1, r: "In the fetus, the valve of the IVC (Eustachian valve) and crista dividens preferentially direct the oxygen-rich stream from the IVC across the foramen ovale into the left atrium." },
        { cat: 0, q: "During thoracic surgery involving the posterior mediastinum, the surgical team isolates the principal longitudinal structures. Which of the following structures lies within the posterior mediastinum and is positioned immediately posterior to the fibrous pericardium and left atrium?", a: ["Internal thoracic artery", "Thymus gland remnants", "Esophagus accompanied by the esophageal nerve plexus", "Phrenic nerve running with the pericardiacophrenic vessels"], c: 2, r: "The esophagus descends through the posterior mediastinum directly posterior to the fibrous pericardium and left atrium (left atrial enlargement in mitral stenosis can compress it and cause dysphagia)." },
        { cat: 1, q: "In left ventricular pressure-volume loop analysis, an isolated increase in myocardial contractility (positive inotropic state, such as during sympathetic stimulation) produces which characteristic change on the diagram?", a: ["Decreases total Stroke Volume (SV) while elevating End-Systolic Volume", "Shifts the End-Diastolic Pressure-Volume Relationship (EDPVR) curve upward and to the left, reducing ventricular compliance", "Expands the loop exclusively to the right by increasing End-Diastolic Volume (EDV) without altering ESV", "Shifts the End-Systolic Pressure-Volume Relationship (ESPVR) line upward and to the left, decreasing End-Systolic Volume (ESV)"], c: 3, r: "Positive inotropic stimulation increases the slope of the ESPVR line, shifting it upward and to the left. The ventricle ejects blood more completely, resulting in a lower End-Systolic Volume (ESV) and higher Stroke Volume (SV)." },
        { cat: 1, q: "During Phase 2 (plateau phase) of the ventricular cardiac action potential, the prolonged depolarization is maintained primarily by a delicate balance between which opposing ionic currents?", a: ["Sustained inward Ca2+ influx through L-type calcium channels balanced by outward K+ efflux (IK)", "Rapid inward Na+ current (INa) balanced by outward Cl- influx", "Inward funny current (If) balanced by primary Na+/K+-ATPase electrogenic pumping", "Inward Na+/Ca2+ exchange current balanced solely by T-type calcium channel inactivation"], c: 0, r: "Phase 2 (plateau) reflects an electrical balance between inward Ca2+ current through L-type calcium channels and outward repolarizing K+ currents (IK delayed rectifier)." },
        { cat: 1, q: "A 58-year-old male presents to the emergency department with acute retrosternal chest pain. The 12-lead ECG demonstrates acute ST-segment elevation in leads II, III, and aVF with reciprocal ST depression in lead aVL. Transmural infarction is localized to which ventricular wall, and which coronary artery is typically occluded?", a: ["Anterior LV wall; Left Anterior Descending (LAD) artery (~50% of cases)", "Inferior LV wall; Right Coronary Artery (RCA) (~30% of cases)", "Lateral LV wall; Left Circumflex (LCx) artery (~20% of cases)", "Anteroseptal wall; Left main coronary trunk"], c: 1, r: "Leads II, III, and aVF face the inferior surface of the left ventricle, which is supplied by the Right Coronary Artery (RCA) in the vast majority of individuals (~30% of all acute infarctions)." },
        { cat: 1, q: "A 62-year-old female experiences typical angina pectoris during exercise treadmill testing. Which electrocardiographic finding characteristically signifies acute transient subendocardial ischemia on the 12-lead ECG?", a: ["Convex-upward ST-segment elevation with reciprocal ST depression", "Pathological broad Q waves measuring > 0.04 seconds in duration", "Horizontal or downsloping ST-segment depression >= 1 mm and/or symmetrical T-wave inversion", "Widening of the QRS complex > 120 ms with marked axis deviation"], c: 2, r: "Subendocardial ischemia involves only the inner layer of the myocardium and characteristically produces ST-segment depression (horizontal or downsloping) and/or T-wave inversion." },
        { cat: 2, q: "In secondary hemostasis, both the intrinsic and extrinsic coagulation cascades converge to activate a critical common protease. Which coagulation factor activation marks the beginning of the common pathway?", a: ["Activation of Factor XII to XIIa by subendothelial collagen", "Proteolytic conversion of soluble fibrinogen directly by Factor IXa", "Direct activation of Factor XIII into fibrinoligase by tissue factor", "Activation of Factor X to Xa, which complexes with Factor Va on phospholipids to form prothrombinase"], c: 3, r: "Both pathways converge on the cleavage of Factor X to Factor Xa. Factor Xa complexes with Factor Va, Ca2+, and platelet phospholipids to form the prothrombinase complex." },
        { cat: 2, q: "A 54-year-old male is admitted for acute deep vein thrombosis and started on intravenous Unfractionated Heparin (UFH). Which laboratory coagulation parameter is routinely utilized to monitor UFH therapeutic intensity and adjust dosing?", a: ["Activated Partial Thromboplastin Time (aPTT)", "Prothrombin Time / International Normalized Ratio (PT/INR)", "Bleeding Time (BT)", "Thrombin Time (TT)"], c: 0, r: "Unfractionated Heparin inhibits Factors IIa, Xa, and IXa in the intrinsic and common pathways; its anticoagulant effect is monitored clinically using the aPTT (target 1.5–2.5x control)." },
        { cat: 2, q: "A 23-year-old female presents with persistent fatigue, pallor, and pica. A CBC demonstrates microcytic, hypochromic red blood cells with low Hb (9.2 g/dL) and low MCV (68 fL). Which complete iron profile pattern confirms iron deficiency anemia and distinguishes it from anemia of chronic disease?", a: ["Elevated serum ferritin, decreased Total Iron-Binding Capacity (TIBC / transferrin), and elevated serum iron", "Decreased serum ferritin, elevated transferrin / TIBC, and low serum iron", "Normal serum ferritin, normal TIBC, and elevated serum transferrin saturation", "Markedly elevated serum ferritin, normal transferrin, and high transferrin saturation"], c: 1, r: "In iron deficiency anemia, iron stores are depleted: serum ferritin is low (most specific) and TIBC/transferrin is elevated as the liver attempts to capture circulating iron." },
        { cat: 1, q: "Examination of the internal jugular venous pulse waveform demonstrates three positive deflections (a, c, and v waves). What physiological mechanical event is responsible for generating the prominent 'a' wave?", a: ["Bulging of the tricuspid valve into the right atrium during right ventricular isovolumetric contraction", "Passive venous filling of the right atrium against a closed tricuspid valve during ventricular systole", "Active contraction of the right atrium during atrial systole", "Rapid emptying of the right atrium into the ventricle following tricuspid valve opening"], c: 2, r: "The 'a' wave of the JVP corresponds to active right atrial contraction (atrial systole), occurring just prior to S1 and coinciding with the PR interval on ECG." },
        { cat: 2, q: "During the final stage of blood coagulation, soluble circulating fibrinogen is converted into insoluble fibrin meshwork. Which enzyme cleaves fibrinopeptides A and B from fibrinogen and subsequently activates Factor XIII to cross-link the fibrin monomers?", a: ["Activated Factor X (Factor Xa)", "Plasmin", "Tissue Plasminogen Activator (tPA)", "Thrombin (Factor IIa)"], c: 3, r: "Thrombin (Factor IIa) cleaves fibrinopeptides A and B from fibrinogen to generate fibrin monomers and activates Factor XIII to covalently cross-link the strands into an insoluble clot." },
        { cat: 1, q: "On a left ventricular pressure-volume loop, what specific mechanical phase of the cardiac cycle begins at the exact point of aortic valve closure (point 3 on the diagram)?", a: ["Isovolumetric ventricular relaxation", "Reduced ejection phase", "Rapid ejection phase", "Rapid ventricular filling"], c: 0, r: "When LV pressure falls below aortic diastolic pressure, the aortic valve closes. All valves remain closed as ventricular pressure drops at constant ESV, defining isovolumetric relaxation." },
        { cat: 1, q: "The sinoatrial (SA) node functions as the dominant primary pacemaker of the human heart. Which electrophysiological characteristic enables the SA node to override and suppress all latent pacemakers (AV node, Purkinje fibers)?", a: ["Longest refractory period and largest resting membrane potential (-90 mV)", "Steepest slope of spontaneous diastolic Phase 4 depolarization driven by funny currents (If)", "Fastest conduction velocity through gap junctions within nodal tissue", "Exclusive reliance on voltage-gated fast Na+ channels during Phase 0"], c: 1, r: "The SA node possesses the steepest slope of Phase 4 spontaneous depolarization (fastest intrinsic firing rate: 60-100 bpm), overriding and suppressing all latent pacemakers via overdrive suppression." },
        { cat: 1, q: "A sudden acute elevation in systemic vascular resistance (increased LV afterload, such as in acute severe hypertension) produces which immediate hemodynamic adaptation on the left ventricular pressure-volume loop?", a: ["Increases Stroke Volume (SV) and decreases End-Systolic Volume (ESV)", "Shifts the loop downward and to the right by reducing End-Diastolic Volume", "Elevates peak systolic pressure, increases End-Systolic Volume (ESV), and reduces Stroke Volume (SV)", "Abolishes the isovolumetric contraction phase completely"], c: 2, r: "Increased afterload forces the LV to generate higher peak pressure and shortens ejection. Less blood is ejected, resulting in higher End-Systolic Volume (ESV) and reduced Stroke Volume (SV)." },
        { cat: 1, q: "According to the Starling hypothesis governing transcapillary fluid filtration, what is the primary physical force driving net filtration of fluid out of the capillary lumen into the interstitial space at the arterial end of the microcirculation?", a: ["Interstitial fluid hydrostatic pressure (Pif)", "Lymphatic pump suction pressure", "Plasma colloid oncotic pressure (pi_c) generated by circulating albumin", "Capillary hydrostatic pressure (Pc) exceeding plasma colloid oncotic pressure (pi_c)"], c: 3, r: "At the arterial end of capillaries, capillary hydrostatic pressure (Pc ~32-35 mmHg) exceeds plasma oncotic pressure (pi_c ~25-28 mmHg), driving fluid filtration into the interstitium." },
        { cat: 1, q: "On a standard surface 12-lead ECG, which waveform directly corresponds to the electrical repolarization of the ventricular myocardium?", a: ["T wave", "QRS complex", "P wave", "U wave"], c: 0, r: "The T wave represents ventricular repolarization (Phase 3 of the action potential). The P wave reflects atrial depolarization, and the QRS complex represents ventricular depolarization." },
        { cat: 0, q: "During embryonic development of the thoracoabdominal cavity, which embryological precursor gives rise to the central tendon of the adult diaphragm?", a: ["Pleuroperitoneal membranes", "Septum transversum", "Dorsal mesentery of the esophagus (mesoesophagus)", "Muscular ingrowth from lateral body wall somites"], c: 1, r: "The septum transversum grows dorsally from the anterior body wall to form the central tendon of the diaphragm." },
        { cat: 0, q: "In the fetal circulation, the ductus arteriosus shunts deoxygenated blood from the pulmonary trunk directly into the descending aorta, bypassing the high-resistance fetal lungs. What is the adult fibrous anatomical remnant of this vessel?", a: ["Ligamentum teres hepatis", "Ligamentum venosum", "Ligamentum arteriosum", "Medial umbilical ligament"], c: 2, r: "The ductus arteriosus closes postnatally and undergoes fibrous obliteration into the ligamentum arteriosum, connecting the pulmonary artery to the aortic arch concavity." },
        { cat: 0, q: "In approximately 60% of human hearts, the arterial branch that supplies blood to the sinoatrial (SA) node arises directly from which epicardial vessel?", a: ["Left anterior descending (LAD) artery", "Marginal branch of the posterior descending artery", "Left circumflex (LCx) artery", "Right coronary artery (RCA)"], c: 3, r: "The SA nodal artery arises from the Right Coronary Artery (RCA) in ~60% of individuals, and from the Left Circumflex (LCx) artery in ~40%." },
        { cat: 1, q: "A 64-year-old male undergoes a pre-operative ECG. The tracing shows regular sinus rhythm with a fixed, constant PR interval measuring 0.28 seconds (280 ms), with every P wave followed by a QRS complex (1:1 conduction). What is the diagnosis?", a: ["First-degree atrioventricular (AV) block", "Mobitz Type I (Wenckebach) second-degree AV block", "Mobitz Type II second-degree AV block", "Third-degree complete AV block"], c: 0, r: "First-degree AV block is defined electrocardiographically by uniform PR interval prolongation > 0.20 s (> 200 ms) with a constant 1:1 relationship between P waves and QRS complexes (no dropped beats)." },
        { cat: 1, q: "A 22-year-old college athlete undergoes a routine sports clearance ECG. The tracing shows normal sinus rhythm, but reveals a shortened PR interval (< 0.12 seconds / < 120 ms), a slurred initial upstroke on the QRS complex (delta wave), and a widened QRS complex. Which electrophysiological mechanism is responsible for this presentation?", a: ["Conduction delay within the dual pathways of the compact AV node", "Ventricular pre-excitation via an accessory pathway (Bundle of Kent) bypassing the AV node", "Impaired impulse transmission through the right bundle branch within the moderator band", "Re-entrant micro-circuitry localized entirely within the sinoatrial node tissue"], c: 1, r: "Wolff-Parkinson-White (WPW) syndrome features a short PR interval (< 120 ms), delta wave, and widened QRS caused by ventricular pre-excitation through an accessory pathway (Bundle of Kent)." },
        { cat: 2, q: "What is the normal reference range for circulating reticulocytes in healthy adult peripheral blood, and what clinical significance does a reticulocyte count >= 3% carry in an anemic patient?", a: ["0.01%-0.1%; indicates primary bone marrow aplasia", "5.0%-10.0%; indicates excessive ineffective erythropoiesis", "0.5%-1.5% (up to 2.5%); an elevated count (>= 3%) indicates active bone marrow erythropoietic response to hemolysis or blood loss", "12.0%-15.0%; indicates severe megaloblastic maturation arrest"], c: 2, r: "Normal adult reticulocytes make up 0.5%–1.5% (up to 2.5%) of RBCs. A count >= 3% in anemia reflects an active bone marrow response to hemolysis or acute blood loss." },
        { cat: 1, q: "Which plasma protein fraction is synthesized exclusively by hepatocytes and accounts for approximately 70% to 80% of total intravascular colloid osmotic (oncotic) pressure?", a: ["Alpha-1 globulin", "Gamma globulins (immunoglobulins)", "Fibrinogen", "Albumin"], c: 3, r: "Albumin (~66 kDa) circulates at high concentrations (3.5–5.0 g/dL) and is responsible for ~75–80% of total plasma oncotic pressure (pi_c)." },
        { cat: 2, q: "In a patient presenting with severe Vitamin B12 or folate deficiency (megaloblastic anemia with MCV > 100 fL), which combination of morphological findings on the peripheral blood smear is characteristic of impaired nuclear maturation?", a: ["Hypersegmented neutrophils (>= 5 nuclear lobes) and oval macrocytes", "Microcytic, hypochromic red blood cells with target cells", "Sickle-shaped red cells and elevated reticulocytes (>= 3%)", "Microspherocytes with loss of central pallor and polychromatophilia"], c: 0, r: "Impaired DNA synthesis in megaloblastic anemia produces nuclear-cytoplasmic asynchrony, manifesting as oval macrocytes and hypersegmented neutrophils with >= 5 nuclear lobes." },
        { cat: 2, q: "A peripheral blood smear identifies a granulocyte that constitutes less than 1% of total leukocytes, possesses a lobed nucleus obscured by large, dark blue/purple specific granules, and participates in immediate hypersensitivity reactions. Which cell is described?", a: ["Eosinophil", "Basophil", "Monocyte", "Neutrophil"], c: 1, r: "Basophils (< 1% of WBCs) have cytoplasm packed with dark-blue/purple specific granules rich in histamine, heparin, and leukotrienes, mediating immediate hypersensitivity." },
        { cat: 2, q: "During primary hemostasis, activated platelets undergo aggregation and cross-linking to form the primary hemostatic plug. Which plasma protein directly bridges adjacent platelets by binding to activated GP IIb/IIIa surface receptors?", a: ["von Willebrand factor (vWF)", "Tissue Factor (Thromboplastin)", "Fibrinogen", "Plasminogen"], c: 2, r: "Upon platelet activation, conformational changes expose GP IIb/IIIa receptors. Circulating fibrinogen binds to GP IIb/IIIa on adjacent platelets, bridging them into a platelet plug." },
        { cat: 2, q: "The Prothrombin Time (PT) test is performed by adding tissue thromboplastin and calcium to citrated patient plasma. Which coagulation pathway(s) and factors does the PT specifically evaluate?", a: ["Intrinsic pathway exclusively (Factors XII, XI, IX, and VIII)", "Platelet glycoprotein surface receptor density", "Factor XIII cross-linking activity alone", "Extrinsic pathway (Factor VII) and common pathway (Factors X, V, Prothrombin, and Fibrinogen)"], c: 3, r: "Prothrombin Time (PT) evaluates the extrinsic pathway (Factor VII) and the common pathway (Factors X, V, II, and I)." },
        { cat: 2, q: "Which ABO and Rh blood group is designated as the universal red blood cell donor in emergency transfusions because its erythrocytes lack A, B, and Rh(D) surface agglutinogens?", a: ["Type O Negative", "Type AB Positive", "Type A Negative", "Type B Positive"], c: 0, r: "Type O Negative red blood cells express neither A, B, nor Rh(D) surface agglutinogens, preventing recipient antibody-mediated hemolysis in emergency transfusions." },
        { cat: 2, q: "Intact vascular endothelium maintains an antithrombotic surface that actively prevents inappropriate clot formation. Antithrombin III activity is endogenously accelerated by several thousand-fold upon binding to which endothelial membrane structure?", a: ["Thrombomodulin", "Heparin-like molecules (heparan sulfate proteoglycans)", "Prostacyclin (PGI2)", "Endothelial-derived nitric oxide (NO)"], c: 1, r: "Heparan sulfate proteoglycans on intact endothelial surfaces bind Antithrombin III, inducing an allosteric conformational shift that accelerates inactivation of Factors IIa and Xa by >1000-fold." },
        { cat: 2, q: "Which eicosanoid synthesized by vascular endothelial cells from arachidonic acid acts via cell surface receptors to stimulate adenylate cyclase, elevating platelet cAMP to inhibit platelet aggregation and promote vasodilation?", a: ["Thromboxane A2 (TXA2)", "Leukotriene B4 (LTB4)", "Prostacyclin (PGI2)", "Endothelin-1"], c: 2, r: "Endothelial prostacyclin (PGI2) binds IP receptors to elevate platelet cAMP, preventing aggregation and promoting vasodilation, balancing platelet-derived TXA2." },
        { cat: 2, q: "In Classical Hodgkin Lymphoma, diagnostic binucleated Reed-Sternberg cells characteristically express which diagnostic cell-surface immunohistochemical markers according to your lecture curriculum?", a: ["CD3 and CD4 (T-cell markers)", "CD68 and CD163 (macrophage markers)", "CD19 and CD20 (mature B-cell markers)", "CD15 and CD30 (Hodgkin's cell markers)"], c: 3, r: "In Dr. Steele's slides ('Lymphoid cell markers you should know'), CD15 and CD30 are identified as classic Reed-Sternberg/Hodgkin's cell markers." },
        { cat: 2, q: "A 26-year-old female presents with easy bruising, spontaneous petechiae, and multiple subcutaneous hemorrhages. Evaluation confirms thrombocytopenic purpura with a platelet count of 35,000/uL. Which coagulation profile finding is characteristic of this primary hemostatic disorder?", a: ["Prolonged bleeding time (BT) with normal PT and aPTT", "Prolonged Prothrombin Time (PT) with normal bleeding time", "Markedly prolonged aPTT with decreased fibrinogen", "Elevated D-dimer with depleted Factor VIII"], c: 0, r: "Thrombocytopenic purpura impairs primary hemostasis, prolonging Bleeding Time (BT). Because plasma coagulation factors and liver synthesis are unaffected, PT and aPTT remain completely normal." },
        { cat: 2, q: "Which circulating plasma lipoprotein class is synthesized primarily by the liver and transports the highest percentage of endogenous triglycerides to peripheral adipose and muscle tissues?", a: ["Chylomicrons", "Very Low-Density Lipoprotein (VLDL)", "Low-Density Lipoprotein (LDL)", "High-Density Lipoprotein (HDL)"], c: 1, r: "VLDL is synthesized by hepatocytes to transport endogenous triglycerides (~55% of core volume). Chylomicrons transport dietary/exogenous triglycerides from the gut." },
        { cat: 2, q: "Familial Hypercholesterolemia (Type IIa) is a primary genetic dyslipidemia characterized by severe elevations in circulating LDL cholesterol and premature coronary atherogenesis. It is most commonly caused by loss-of-function mutations in the gene encoding:", a: ["Apolipoprotein E (Apo E)", "Lipoprotein lipase (LPL)", "Low-Density Lipoprotein (LDL) receptor", "Lecithin-cholesterol acyltransferase (LCAT)"], c: 2, r: "Familial Hypercholesterolemia (Type IIa) is an autosomal dominant disease caused by mutations in the LDL receptor gene, preventing hepatic LDL clearance and causing severe hypercholesterolemia." },
        { cat: 2, q: "A 68-year-old male presents with persistent lower back pain, hypercalcemia, renal insufficiency, and normocytic anemia. Serum protein electrophoresis reveals a monoclonal immunoglobulin spike (M component). A bone marrow biopsy is performed. Which characteristic finding confirms multiple myeloma?", a: ["Myeloblasts containing crystalline Auer rods", "Abundant ruptured, fragile 'smudge' cells in a background of small lymphocytes", "Large binucleated Reed-Sternberg cells with prominent inclusion-like nucleoli", "Sheets of neoplastic plasma cells displaying eccentric 'clock-face' chromatin and perinuclear halos"], c: 3, r: "Multiple myeloma features sheets of neoplastic plasma cells with eccentric round nuclei, clumped 'clock-face/cartwheel' chromatin, basophilic cytoplasm, and a prominent perinuclear halo." },
        { cat: 2, q: "Which major apolipoprotein serves as the essential structural protein embedded within VLDL, IDL, and LDL, functioning as the primary recognition ligand for binding to the hepatic LDL receptor?", a: ["Apolipoprotein B-100 (Apo B-100)", "Apolipoprotein A-I (Apo A-I)", "Apolipoprotein C-II (Apo C-II)", "Apolipoprotein B-48 (Apo B-48)"], c: 0, r: "Apolipoprotein B-100 is synthesized by the liver as the structural backbone of VLDL, IDL, and LDL, serving as the primary ligand recognized by hepatic LDL receptors." },
        { cat: 2, q: "Severe Vitamin B12 (cobalamin) deficiency results in subacute combined degeneration of the spinal cord (affecting dorsal and lateral columns). Which biochemical enzymatic defect directly accounts for this myelin damage?", a: ["Defective conversion of homocysteine to methionine alone, causing folate trapping", "Impaired conversion of methylmalonyl-CoA to succinyl-CoA, resulting in accumulation of methylmalonic acid and abnormal myelin fatty acids", "Inability to absorb dietary iron through duodenal enterocytes", "Failure of erythropoietin gene transcription in renal tubular cells"], c: 1, r: "Vitamin B12 is an essential cofactor for methylmalonyl-CoA mutase. Deficiency causes methylmalonic acid (MMA) accumulation, leading to abnormal fatty acid incorporation and spinal demyelination." },
        { cat: 2, q: "A 24-year-old male of Mediterranean descent presents with acute fatigue, jaundice, and dark urine following exposure to an oxidative trigger. A CBC reveals acute hemolytic anemia with reticulocytosis (>= 3%). In this patient's red blood cells, a deficiency in glucose-6-phosphate dehydrogenase (G6PD) impairs the generation of which essential protective substance?", a: ["Adenosine triphosphate (ATP) via terminal glycolysis", "2,3-Bisphosphoglycerate (2,3-BPG) to facilitate tissue oxygen unloading", "Reduced NADPH (NADPH2) required to protect red blood cells from oxidants", "CD59 membrane protein to protect against terminal complement lysis"], c: 2, r: "G6PD catalyzes the first step in the pentose phosphate pathway to generate NADPH (reduced form), which maintains reduced glutathione to protect RBCs against oxidative lysis." },
        { cat: 2, q: "A 28-year-old traveler presents with persistent periorbital edema, muscle weakness, and fever following suspected helminth infection. A peripheral blood differential reveals marked leukocytosis with 18% eosinophils (normal: 1-4%). Which substance stored within the large, refractile red cytoplasmic granules of these cells is primarily responsible for damaging invading parasites?", a: ["Perforin and granzyme", "Myeloperoxidase", "Heparin and histamine", "Major Basic Protein (MBP)"], c: 3, r: "Eosinophils store Major Basic Protein (MBP) and Eosinophil Cationic Protein (ECP) in their refractile granules, which are cytotoxic to invading helminthic parasites." },
        { cat: 2, q: "In the intrinsic pathway of blood coagulation, efficient conversion of Factor X to Factor Xa requires assembly of the multicomponent 'intrinsic tenase' complex on the activated platelet membrane. Which combination of factors constitutes this complex?", a: ["Factor IXa, Factor VIIIa, Calcium, and platelet phospholipids", "Factor VIIa, Tissue Factor, and Ca2+", "Factor Xa, Factor Va, Calcium, and prothrombin", "Thrombin, Thrombomodulin, and Protein C"], c: 0, r: "The intrinsic tenase complex consists of Factor IXa (enzyme), Factor VIIIa (cofactor), Ca2+, and platelet phospholipids, which cleaves Factor X into Factor Xa." },
        { cat: 2, q: "Inherited deficiency of Protein C or its cofactor Protein S is an established hereditary thrombophilia predisposing individuals to recurrent deep vein thrombosis and purpura fulminans. What is the physiological mechanism of Activated Protein C (APC)?", a: ["Direct competitive inhibition of tissue factor pathway inhibitor (TFPI)", "Proteolytic cleavage and inactivation of active coagulation Factors Va and VIIIa", "Cleavage and permanent destruction of circulating Antithrombin III", "Inhibition of tissue plasminogen activator (tPA) release"], c: 1, r: "Activated Protein C (APC), with its cofactor Protein S, proteolytically degrades and inactivates coagulation Factors Va and VIIIa, acting as an essential physiological anticoagulant brake." },
        { cat: 2, q: "A 28-year-old female presents with recurrent lower extremity deep vein thrombosis and a history of repeated miscarriages. Coagulation testing demonstrates an unexpectedly prolonged aPTT that fails to correct upon a 1:1 mixing study with normal plasma. Testing confirms Antiphospholipid Syndrome (APS). What explains the in vitro versus in vivo paradox in APS?", a: ["Antibodies destroy Factor VIII causing hemophilia in vivo", "Antibodies selectively stimulate endothelial prostacyclin production", "Antiphospholipid antibodies interfere with phospholipid reagent surfaces causing prolonged aPTT in vitro, but promote cell damage and thrombosis in vivo", "Defective platelet dense granule secretion causes prolonged in vitro clotting"], c: 2, r: "In APS, antiphospholipid antibodies interfere with phospholipid reagents used in laboratory assays causing prolonged in vitro aPTT, but induce endothelial injury and platelet activation in vivo causing thrombosis." },
        { cat: 0, q: "Histological examination of the systemic microcirculation distinguishes capillaries from arterioles and venules. Which structural characteristic uniquely defines true capillaries?", a: ["A thick tunica media containing multiple concentric layers of smooth muscle", "Bicuspid endothelial valves preventing retrograde fluid flow", "Internal elastic lamina with well-developed connective tissue adventitia", "Absence of vascular smooth muscle, consisting solely of a single layer of endothelial cells and basement membrane"], c: 3, r: "True capillaries lack smooth muscle and consist solely of a single layer of endothelial cells resting on a basal lamina, maximizing diffusion efficiency." },
        { cat: 2, q: "Elevated plasma homocysteine is a recognized independent risk factor for atherosclerosis and thrombophilia due to endothelial dysfunction and impaired nitric oxide release. Supplementation with which group of vitamins is clinically indicated to lower elevated homocysteine levels?", a: ["Vitamin B6 (pyridoxine), Vitamin B12 (cobalamin), and Folic Acid", "Vitamins A, C, and E", "Vitamins D, K1, and K2", "Niacin and Thiamine"], c: 0, r: "Homocysteine metabolism relies on remethylation (requiring Vitamin B12 and Folate) and transsulfuration (requiring Vitamin B6). Supplementing B6, B12, and folate lowers prothrombotic homocysteine." },
        { cat: 2, q: "In pathological conditions characterized by severe bone marrow fibrosis or severe chronic hemolytic stress, which organ serves as the primary site of extramedullary hematopoiesis?", a: ["Thymus", "Spleen (and liver)", "Kidney", "Adrenal cortex"], c: 1, r: "When bone marrow is infiltrated or fibrotic, the spleen and liver revert to their fetal role as the primary sites of extramedullary hematopoiesis." },
        { cat: 2, q: "A 34-year-old female with blood type O accidentally receives an emergency transfusion of packed red blood cells from a type A donor. Within minutes, she develops acute lumbar pain, fever, hemoglobinuria, and hypotension. According to blood group immunology, which primary mechanism and downstream complication occur in this mismatched transfusion?", a: ["Donor plasma agglutinins attack recipient erythrocytes, causing splenic sequestration", "Preformed IgE antibodies bind donor membrane antigens, causing systemic mast cell degranulation", "Recipient anti-A agglutinins attack donor red cell agglutinogens, causing intravascular hemolysis that can precipitate acute renal failure and DIC", "Donor cytotoxic T lymphocytes infiltrate recipient tissues, inducing graft-versus-host hemolysis"], c: 2, r: "In mismatched transfusions, recipient anti-A agglutinins attack donor red cell agglutinogens, causing acute intravascular hemolysis, hemoglobinuria, renal failure, and DIC." },
        { cat: 2, q: "In addition to mediating platelet adhesion to subendothelial collagen, what is the key physiological function of von Willebrand Factor (vWF) regarding Factor VIII in circulation?", a: ["vWF proteolytically cleaves and inactivates Factor VIII to terminate clotting", "vWF inhibits Factor VIII synthesis in the liver", "vWF converts Factor VIII into active Factor VIIIa in the absence of thrombin", "vWF binds and regulates circulating levels of Factor VIII, protecting it from degradation and releasing it upon activation"], c: 3, r: "vWF serves as the essential plasma carrier protein for Factor VIII, stabilizing its circulating levels and protecting it from premature proteolytic clearance." },
        { cat: 1, q: "A 38-year-old male suffers severe closed head trauma resulting in acutely elevated intracranial pressure (ICP) that severely reduces cerebral perfusion. The patient develops profound arterial hypertension accompanied by reflex bradycardia and irregular respirations (Cushing's triad). What physiological mechanism initiates this powerful 'last-ditch' CNS ischemic response?", a: ["Medullary ischemia causing severe local accumulation of CO2 and H+, which powerfully excites the vasomotor center to trigger massive sympathetic vasoconstriction", "Sudden activation of carotid sinus baroreceptors due to direct neck compression", "Massive release of Atrial Natriuretic Peptide (ANP) from stretched atrial myocardium", "Reflex parasympathetic vasodilatation of splanchnic and renal vascular beds"], c: 0, r: "The CNS ischemic response (Cushing reflex) is triggered by medullary ischemia; local CO2 and H+ accumulation powerfully excites the vasomotor center, inducing massive sympathetic peripheral vasoconstriction." },
        { cat: 1, q: "During cardiac excitation-contraction coupling, the influx of extracellular Ca2+ through sarcolemmal L-type calcium channels triggers massive 'calcium-induced calcium release' from the sarcoplasmic reticulum via which specific channel?", a: ["Inositol trisphosphate (IP3) receptor", "Ryanodine receptor-channel (RyR / RyR2)", "Sarcoplasmic/endoplasmic reticulum Ca2+-ATPase (SERCA) pump", "Sarcolemmal Na+/Ca2+ antiporter"], c: 1, r: "Extracellular trigger calcium entering through L-type channels binds to Ryanodine receptors (RyR2) on the sarcoplasmic reticulum, inducing massive calcium-induced calcium release." },
        { cat: 3, q: "A 64-year-old male is hospitalized following an acute transmural anterior myocardial infarction. On post-infarction day 5, he suddenly develops severe dyspnea, hypotension, jugular venous distension, and distant heart sounds (Beck's triad), rapidly progressing to pulseless electrical activity and death. Autopsy reveals hemopericardium caused by ventricular free-wall rupture. Why is the infarcted myocardium at highest risk for mechanical rupture specifically between days 3 and 7 post-infarction?", a: ["Hyperacute reperfusion injury induces immediate microvascular spasm and contraction bands", "Rapid accumulation of mature type I collagen fibers creates excessive wall stiffness and mechanical shear", "Lytic degradation of necrotic myocytes by infiltrating macrophages is maximal before collagenous scar tissue is organized", "Infiltration of eosinophils releasing major basic protein dissolves the fibrous pericardium"], c: 2, r: "Between days 3 and 7 post-MI, macrophage phagocytosis and enzymatic lysis of necrotic tissue are maximal while collagenous scar deposition is just beginning, leaving the ventricular wall at its weakest." },
        { cat: 3, q: "A 52-year-old male presents 6 hours after the onset of severe crushing chest pain. Which cardiac biomarker is the gold standard for diagnosing myocardial infarction, rising within 3-4 hours, peaking at 8-18 hours, and remaining elevated in serum for 7-10 days?", a: ["Creatine Kinase-MB (CK-MB)", "Lactate Dehydrogenase (LDH-1)", "Aspartate Aminotransferase (AST)", "Cardiac Troponin I / T (cTnI / cTnT)"], c: 3, r: "Cardiac Troponin I and T are the gold standard markers for myocardial infarction, elevating within 3–4 hours, peaking at 8–18 hours, and remaining detectable for 7–10 days." },
        { cat: 3, q: "Histopathological examination of an atheromatous coronary plaque from a patient with long-standing stable angina reveals a 'stable plaque' phenotype. Which morphological features characterize a stable plaque compared to a vulnerable plaque?", a: ["Thick, dense collagenous fibrous cap with a small lipid core and minimal inflammatory infiltrate", "Thin fibrous cap and large lipid-rich necrotic core with dense foam cell inflammation", "Extensive superficial ulceration and intra-plaque hemorrhage with occlusive thrombus", "Complete disruption of the internal elastic lamina with absence of vascular smooth muscle"], c: 0, r: "Stable plaques have a thick fibrous cap rich in collagen and smooth muscle cells, a small necrotic lipid core, and minimal inflammatory infiltrate, conferring resistance to rupture." },
        { cat: 3, q: "A 58-year-old male is recovering in the coronary care unit following an acute transmural left ventricular anterior myocardial infarction. On post-infarct day 5, he suddenly collapses with profound hypotension, distant/muffled heart sounds on auscultation, and marked jugular venous distension (Beck's triad). Emergency echocardiography confirms hemopericardium causing acute cardiac tamponade. What is the definitive anatomical diagnosis?", a: ["Papillary muscle rupture producing acute mitral regurgitation", "Ventricular free-wall rupture", "Ventricular septal rupture causing an acute left-to-right shunt", "Delayed autoimmune pericarditis (Dressler's syndrome)"], c: 1, r: "Between post-MI days 3 and 7, macrophage clearance renders the myocardium soft and weak. A transmural tear through the free wall causes hemopericardium, tamponade, and Beck's triad." },
        { cat: 3, q: "Which primary cardiomyopathy is inherited as an autosomal dominant trait caused by mutations in sarcomeric contractile proteins (such as beta-myosin heavy chain or myosin-binding protein C) and presents histopathologically with marked myofiber disarray and asymmetric septal hypertrophy?", a: ["Dilated Cardiomyopathy (DCM)", "Restrictive Cardiomyopathy", "Hypertrophic Obstructive Cardiomyopathy (HOCM)", "Arrhythmogenic Right Ventricular Cardiomyopathy"], c: 2, r: "HOCM is an autosomal dominant disorder caused by mutations in sarcomeric genes (e.g., beta-myosin heavy chain), causing asymmetric septal hypertrophy and chaotic myofiber disarray." },
        { cat: 3, q: "A 46-year-old male with a history of mitral valve prolapse presents with low-grade fever, malaise, and a new regurgitant murmur following an invasive dental extraction. Physical examination reveals painful, tender erythematous nodules on the pulp of his fingertips and painless hemorrhagic macules on his palms. Blood cultures grow alpha-hemolytic streptococci. Which mechanism correctly explains the fingertip lesions (Osler's nodes) versus the palmar lesions (Janeway lesions)?", a: ["Both lesions represent sterile platelet-fibrin thrombi dislodged from damaged chordae tendineae", "Osler's nodes are non-inflammatory calluses, whereas Janeway lesions represent localized Arthus-type granulomas", "Osler's nodes represent direct fungal infiltration, whereas Janeway lesions are caused by IgA vasculitis", "Osler's nodes are painful immunologic phenomena (immune-complex deposition), whereas Janeway lesions are painless embolic phenomena (septic microemboli)"], c: 3, r: "In Duke criteria (BE TIMER): Osler's nodes are painful immunologic deposits on the digits; Janeway lesions are painless embolic septic lesions on the palms and soles." },
        { cat: 3, q: "A 28-year-old female of Asian descent presents with upper extremity claudication, dizziness, and marked discrepancy in blood pressure between her arms. Physical examination reveals absent radial pulses bilaterally ('pulseless disease'). Biopsy confirms granulomatous inflammation of the aortic arch. Diagnosis?", a: ["Takayasu Arteritis", "Giant Cell (Temporal) Arteritis", "Polyarteritis Nodosa (PAN)", "Kawasaki Disease"], c: 0, r: "Takayasu Arteritis is a granulomatous large-vessel vasculitis of the aortic arch and its branches in young females (< 40 yrs), leading to luminal stenosis and absent upper limb pulses." },
        { cat: 3, q: "A 72-year-old female presents with severe unilateral temporal headache, jaw claudication while chewing, and tender induration along her scalp. ESR is markedly elevated (95 mm/hr). If treatment with high-dose corticosteroids is delayed, which severe complication carries the greatest clinical risk?", a: ["Renal failure secondary to crescentic glomerulonephritis", "Permanent irreversible blindness due to ischemic optic neuropathy from ophthalmic / posterior ciliary artery involvement", "Coronary artery aneurysm rupture", "Pulmonary hemorrhage with cavitation"], c: 1, r: "Giant Cell Arteritis carries a critical risk of permanent blindness due to anterior ischemic optic neuropathy secondary to ophthalmic or posterior ciliary artery occlusion." },
        { cat: 3, q: "A 3-year-old boy presents with high fever for 6 days, bilateral non-purulent conjunctivitis, erythema of the oral mucosa with a 'strawberry tongue', edema and erythema of hands and feet, and cervical lymphadenopathy. If untreated, which life-threatening cardiac sequela represents the primary risk?", a: ["Infective endocarditis with aortic root abscess", "Constrictive pericarditis with pericardial knock", "Coronary artery aneurysms and thrombosis leading to myocardial infarction", "Malignant hypertension secondary to renal artery stenosis"], c: 2, r: "Kawasaki disease is a necrotizing vasculitis with a predilection for coronary arteries in children; untreated cases have a ~20% risk of coronary artery aneurysms and thrombosis." },
        { cat: 3, q: "A 48-year-old male presents with chronic refractory sinusitis, nasal bridge collapse ('saddle-nose' deformity), hemoptysis from cavitary lung nodules, and hematuria from focal necrotizing glomerulonephritis. Biopsy demonstrates necrotizing granulomatous vasculitis. Which autoantibody marker is characteristically positive?", a: ["Perinuclear antineutrophil cytoplasmic antibodies (p-ANCA / anti-MPO)", "Anticentromere antibodies", "Anti-double stranded DNA (anti-dsDNA)", "Cytoplasmic antineutrophil cytoplasmic antibodies (c-ANCA / anti-PR3)"], c: 3, r: "Granulomatosis with Polyangiitis (GPA / Wegener's) features upper/lower respiratory granulomas and glomerulonephritis, and is strongly associated with c-ANCA (anti-proteinase 3)." },
        { cat: 3, q: "A 6-year-old boy presents 10 days after a resolved upper respiratory tract infection with palpable purpura localized to his buttocks and lower extremities, colicky abdominal pain, and knee arthralgias. Urinalysis reveals microscopic hematuria. Skin biopsy confirms leukocytoclastic vasculitis. Which type of immune deposition characteristically drives this disease?", a: ["IgA-dominant immune complex deposition within vessel walls", "IgG anti-glomerular basement membrane antibodies", "Circulating IgE-mediated mast cell degranulation", "Anti-cardiolipin IgM antibodies"], c: 0, r: "Henoch-Schönlein Purpura (HSP / IgA vasculitis) is mediated by IgA-containing immune complexes depositing in small vessels of skin, GI tract, joints, and kidneys." },
        { cat: 3, q: "A 42-year-old female with long-standing severe bronchial asthma presents with fever, palpable purpura, numbness and weakness in her right hand (mononeuritis multiplex), and marked peripheral eosinophilia (> 1,500/uL). Biopsy reveals necrotizing small-vessel vasculitis with eosinophil-rich extravascular granulomas. What is the diagnosis?", a: ["Microscopic Polyangiitis (MPA)", "Eosinophilic Granulomatosis with Polyangiitis (EGPA / Churg-Strauss)", "Polyarteritis Nodosa (PAN)", "Goodpasture syndrome"], c: 1, r: "EGPA (Churg-Strauss) is characterized by severe asthma, marked peripheral blood eosinophilia, necrotizing granulomas, mononeuritis multiplex, and p-ANCA positivity (~50%)." },
        { cat: 3, q: "A 52-year-old male presents with fever, unintended weight loss, severe abdominal pain, and new-onset renovascular hypertension. Serum serology is positive for Hepatitis B surface antigen (HBsAg). Visceral angiography reveals 'string-of-pearls' aneurysmal dilatations, and biopsy confirms transmural necrotizing inflammation with fibrinoid necrosis. Which vascular bed is characteristically spared in this disease?", a: ["Renal arteries", "Mesenteric arteries", "Pulmonary circulation", "Coronary arteries"], c: 2, r: "Polyarteritis Nodosa (PAN) is a necrotizing vasculitis of medium-sized arteries (often Hepatitis B-linked) that characteristically spares the pulmonary vasculature." },
        { cat: 3, q: "A 48-year-old male with a history of congenital bicuspid aortic valve undergoes an invasive dental extraction without antibiotic prophylaxis. Three weeks later, he develops low-grade fever, malaise, anorexia, and a new murmur. What is the most common causative organism of subacute infective endocarditis in this clinical setting?", a: ["Staphylococcus aureus", "Enterococcus faecalis", "Staphylococcus epidermidis", "Viridans group Streptococci (e.g., S. sanguinis, S. mitis)"], c: 3, r: "Viridans group streptococci (oral commensals) produce transient bacteremia after dental work, adhering to abnormal native valves via extracellular dextrans to cause subacute endocarditis." },
        { cat: 3, q: "A 31-year-old intravenous drug user (IVDU) is admitted with high spiking fevers, chills, pleuritic chest pain, and multiple septic pulmonary emboli on chest CT. Auscultation reveals a new holosystolic murmur at the lower left sternal border that intensifies with inspiration (Carvallo's sign). Which cardiac valve is most commonly infected, and by which organism?", a: ["Tricuspid valve; Staphylococcus aureus", "Mitral valve; Streptococcus pneumoniae", "Aortic valve; Pseudomonas aeruginosa", "Pulmonary valve; Candida albicans"], c: 0, r: "In IV drug users, injected skin flora hits the right heart first; Staphylococcus aureus is responsible in >60-70% of cases, commonly attacking the tricuspid valve." },
        { cat: 3, q: "A 66-year-old male underwent mechanical aortic valve replacement 6 weeks ago. He now presents with persistent low-grade fever, fatigue, and early prosthetic valve dysfunction. Repeated blood cultures grow Gram-positive, catalase-positive, coagulase-negative cocci. Which organism is the predominant cause of early prosthetic valve endocarditis (< 1 year post-surgery)?", a: ["Streptococcus pyogenes", "Staphylococcus epidermidis", "Streptococcus pneumoniae", "Staphylococcus aureus"], c: 1, r: "Early prosthetic valve endocarditis (< 1 year) is predominantly caused by Staphylococcus epidermidis (CoNS) via slime/biofilm production on synthetic valve materials." },
        { cat: 3, q: "During a physical examination of a patient with suspected infective endocarditis, the physician identifies multiple small, painless, flat erythematous macules on the palmar surface of the hands and soles of the feet. What are these lesions, and what is their underlying pathogenesis?", a: ["Osler's nodes; caused by circulating immune complex deposition", "Roth spots; caused by retinal flame-shaped hemorrhages", "Janeway lesions; caused by septic microemboli from cardiac vegetations", "Splinter hemorrhages; caused by trauma to the nail bed"], c: 2, r: "Janeway lesions are painless erythematous macules on the palms and soles representing septic microemboli from valvular vegetations." },
        { cat: 3, q: "A patient with a mechanical mitral valve is suspected of having prosthetic valve endocarditis, but an initial Transthoracic Echocardiogram (TTE) is inconclusive due to acoustic shadowing from the mechanical ring. Which diagnostic imaging modality offers superior sensitivity (> 90-95%) for detecting small vegetations (< 2 mm), perivalvular abscesses, and leaflet perforation?", a: ["Repeat standard TTE in 48 hours", "Coronary angiography", "Standard contrast-enhanced chest CT alone", "Transesophageal Echocardiogram (TEE)"], c: 3, r: "Transesophageal Echocardiography (TEE) avoids acoustic shadowing and achieves >90-95% sensitivity for detecting prosthetic vegetations and perivalvular root abscesses." },
        { cat: 3, q: "Bacterial biofilms formed on cardiac implantable electronic devices (CIEDs, pacemakers) and prosthetic valves produce a dense extracellular polymeric substance (EPS) matrix. How does this matrix primarily protect bacteria from host defenses and systemic antibiotics?", a: ["Acting as a physical diffusion barrier, inducing metabolic dormancy (persister cells), and shielding microbes from phagocytes and antibodies", "Rapidly mutating bacterial ribosomal 30S and 50S subunits", "Secreting penicillinase enzymes exclusively into systemic plasma", "Transforming bacterial colonies into heat-resistant spores"], c: 0, r: "The biofilm EPS matrix acts as a physical barrier, induces metabolic dormancy in deep persister cells, and shields bacteria from host antibodies and phagocytes." },
        { cat: 3, q: "A 68-year-old male with persistent bacteremia and subacute infective endocarditis has blood cultures growing non-enterococcal group D streptococci. According to the diagnostic source-to-pathogen clues taught in your cardiovascular microbiology lectures, an organism originating from a gut or genitourinary (GU) tract source points toward which likely pathogen?", a: ["Viridans group streptococci (VGS)", "Streptococcus gallolyticus (or Enterococcus faecalis)", "Staphylococcus aureus", "Coagulase-negative staphylococci (CoNS)"], c: 1, r: "Microbiology lectures teach that a gut or GU tract source points toward Enterococcus faecalis or Streptococcus gallolyticus (associated with occult colon lesions)." },
        { cat: 3, q: "Statins (e.g., Atorvastatin, Rosuvastatin) represent first-line pharmacotherapy for hypercholesterolemia. By which primary molecular mechanism do statins lower plasma Low-Density Lipoprotein (LDL) cholesterol?", a: ["Directly inhibiting intestinal cholesterol absorption through enterocytes", "Binding bile acids in the intestine to promote their fecal excretion", "Competitively inhibiting HMG-CoA reductase, decreasing hepatic cholesterol synthesis and upregulating LDL receptors on hepatocytes", "Activating PPAR-alpha to increase lipoprotein lipase synthesis"], c: 2, r: "Statins competitively inhibit HMG-CoA reductase; hepatic intracellular cholesterol depletion triggers upregulation of surface LDL receptors to clear circulating LDL." },
        { cat: 3, q: "A 56-year-old male with primary hypercholesterolemia exhibits inadequate LDL cholesterol reduction despite maximal tolerated statin therapy. Ezetimibe is added to his regimen. What is the primary mechanism of action of ezetimibe according to your pharmacology lectures?", a: ["Competitively inhibits hepatic HMG-CoA reductase to shut down cholesterol synthesis", "Selectively activates lipoprotein lipase to accelerate triglyceride clearance", "Forms insoluble complexes with bile acids in the intestine to increase fecal elimination", "Inhibits intestinal absorption of dietary and biliary cholesterol, decreasing cholesterol delivery to the liver (second-line therapy when statin alone is inadequate)"], c: 3, r: "Ezetimibe inhibits intestinal absorption of dietary and biliary cholesterol, decreasing cholesterol delivery to the liver; used as second-line therapy with statins." },
        { cat: 3, q: "An electrophysiological study evaluates an antiarrhythmic agent classified as Vaughan-Williams Class IA (e.g., Quinidine, Procainamide). Which combination of channel blockades explains why Class IA agents moderately depress Phase 0 depolarization and simultaneously prolong the total Action Potential Duration (APD)?", a: ["Fast inward Na+ channel blockade combined with outward K+ channel blockade", "Pure Na+ channel blockade with rapid dissociation and shortened repolarization", "L-type Ca2+ channel blockade combined with beta-receptor blockade", "Inward funny channel (If) blockade with activated K+ channels"], c: 0, r: "Class IA agents moderately block voltage-gated fast Na+ channels (slowing Phase 0) and block repolarizing K+ channels (IKr), prolonging repolarization and total APD." },
        { cat: 3, q: "Lidocaine is a Vaughan-Williams Class IB antiarrhythmic agent that binds rapidly to fast Na+ channels and dissociates rapidly, shortening Phase 3 repolarization and Action Potential Duration (APD). What is the primary clinical indication for intravenous lidocaine?", a: ["Maintenance of sinus rhythm in chronic atrial fibrillation and flutter", "Acute termination and suppression of ventricular tachycardia / fibrillation post-myocardial infarction", "Paroxysmal supraventricular tachycardia due to AV nodal re-entry", "Chronic prophylaxis of exertional angina pectoris"], c: 1, r: "Lidocaine binds rapidly to inactivated Na+ channels in depolarized/ischemic tissue, making it clinically indicated for acute post-MI ventricular tachycardia and fibrillation." },
        { cat: 3, q: "A 64-year-old male recovering from an acute myocardial infarction requires long-term antiarrhythmic therapy to reduce the incidence of ventricular arrhythmias and sudden cardiac death. Which drug is classified as a Vaughan-Williams Class III antiarrhythmic that uniquely possesses potent nonselective beta-adrenoceptor blocking activity to reduce post-MI mortality?", a: ["Quinidine", "Lidocaine", "Sotalol", "Flecainide"], c: 2, r: "In Dr. Alsbou's slides, Sotalol is highlighted as a Class III agent with potent nonselective beta-blocking activity that reduces post-MI mortality and sudden cardiac death." },
        { cat: 3, q: "Beta-adrenergic receptor blockers (Class II antiarrhythmics, e.g., Metoprolol, Bisoprolol) suppress automaticity and control ventricular rate in supraventricular tachycardias. Which electrophysiological action is primarily responsible for these effects?", a: ["Increasing intracellular cAMP and accelerating L-type Ca2+ channel opening", "Opening inward rectifier potassium channels during Phase 0", "Markedly prolonging the QRS complex by blocking fast inward Na+ channels in Purkinje fibers", "Decreasing the slope of Phase 4 spontaneous diastolic depolarization in the SA and AV nodes, slowing AV nodal conduction velocity"], c: 3, r: "Beta-blockers inhibit sympathetic stimulation, reducing intracellular cAMP and lowering the Phase 4 spontaneous diastolic depolarization slope in SA and AV nodes." },
        { cat: 3, q: "Amiodarone is a broad-spectrum Class III antiarrhythmic that prolongs Phase 3 repolarization and Action Potential Duration (APD) by blocking outward K+ channels (IKr). Which multi-organ adverse effect profile is associated with chronic amiodarone therapy, requiring baseline and serial monitoring?", a: ["Pulmonary fibrosis, thyroid dysfunction (hypo- or hyperthyroidism due to high iodine content), corneal microdeposits, and hepatotoxicity", "Agranulocytosis and lupus-like syndrome", "Gingival hyperplasia, severe peripheral edema, and flushing", "Cinchonism, thrombocytopenia, and intractable diarrhea"], c: 0, r: "Amiodarone exhibits extensive tissue accumulation causing pulmonary fibrosis, hypo/hyperthyroidism (high iodine content), corneal microdeposits, and hepatotoxicity." },
        { cat: 3, q: "Non-dihydropyridine Calcium Channel Blockers (Verapamil, Diltiazem) exert negative inotropic, chronotropic, and dromotropic actions. Concomitant administration of non-dihydropyridine CCBs with which drug class carries a dangerous risk of severe bradycardia and complete AV nodal block?", a: ["Thiazide diuretics", "Beta-adrenoceptor blockers (e.g., Metoprolol, Atenolol)", "HMG-CoA reductase inhibitors (Statins)", "Angiotensin-Converting Enzyme (ACE) inhibitors"], c: 1, r: "Combining Verapamil or Diltiazem with Beta-blockers produces additive depression of AV nodal conduction and myocardial contractility, risking severe bradycardia and AV block." },
        { cat: 3, q: "Dihydropyridine Calcium Channel Blockers (e.g., Amlodipine, Nifedipine) effectively lower arterial blood pressure in hypertensive patients primarily through which vascular mechanism?", a: ["Selective inhibition of L-type Ca2+ channels in sinoatrial nodal pacemaker cells", "Competitive antagonism of vascular alpha-1 adrenergic receptors", "Selective blockade of voltage-gated L-type Ca2+ channels in peripheral arteriolar vascular smooth muscle, reducing total peripheral resistance", "Inhibition of calcium reabsorption in the renal distal convoluted tubule"], c: 2, r: "Dihydropyridines selectively inhibit voltage-gated L-type Ca2+ channels in peripheral arteriolar smooth muscle, reducing total peripheral resistance (TPR)." },
        { cat: 3, q: "A 54-year-old male with hypertension and type 2 diabetes mellitus is started on Lisinopril. Three weeks later, he develops a persistent, dry, non-productive nocturnal cough without fever or wheezing. What is the pharmacological mechanism responsible for this adverse effect?", a: ["Reflex sympathetic stimulation of bronchial beta-2 receptors", "Drug-induced bronchospasm secondary to elevated aldosterone levels", "Direct stimulation of histamine H1 receptors in bronchial mast cells", "Inhibition of kininase II (ACE), leading to local accumulation of bradykinin and substance P in the respiratory tract"], c: 3, r: "ACE is identical to kininase II. Blocking ACE prevents bradykinin degradation; accumulated bradykinin and substance P irritate bronchial mucosa, causing a persistent dry cough." },
        { cat: 3, q: "A 29-year-old female at 18 weeks of gestation presents for routine antenatal care. Her blood pressure is persistently elevated at 155/98 mmHg, confirming gestational hypertension. According to Dr. Alsbou's cardiovascular pharmacology lecture, which antihypertensive regimen is considered safe and appropriate during pregnancy, and which class is strictly contraindicated?", a: ["Hydralazine, Methyldopa, and Atenolol (or Labetalol) are safe choices; ACE inhibitors and ARBs are strictly contraindicated", "ACE inhibitors (e.g., Enalapril) are first-line; Beta-blockers are strictly contraindicated", "High-dose thiazide diuretics are first-line; Hydralazine is strictly contraindicated", "Continuous intravenous Sodium Nitroprusside is first-line; Methyldopa is strictly contraindicated"], c: 0, r: "Dr. Alsbou's slides specify that hydralazine, methyldopa, and labetalol/atenolol are safe in pregnancy, whereas ACE inhibitors and ARBs are strictly contraindicated due to severe fetotoxicity." },
        { cat: 3, q: "Which electrolyte disturbance represents a well-recognized potential adverse effect of Angiotensin-Converting Enzyme Inhibitors (ACEIs) and Angiotensin Receptor Blockers (ARBs), particularly in patients with pre-existing renal insufficiency?", a: ["Hypokalemia", "Hyperkalemia", "Hypercalcemia", "Hypomagnesemia"], c: 1, r: "Inhibition of Angiotensin II production or receptor binding reduces adrenal aldosterone secretion, diminishing renal potassium excretion and predisposing to hyperkalemia." },
        { cat: 3, q: "Spironolactone and Eplerenone are used in heart failure and hypertension. At which anatomical and cellular site do these agents act as competitive antagonists?", a: ["Na+/K+/2Cl- cotransporter in the thick ascending limb of the loop of Henle", "Na+/Cl- cotransporter in the early distal convoluted tubule", "Mineralocorticoid (Aldosterone) receptors in the late distal tubule and cortical collecting duct principal cells", "Carbonic anhydrase enzyme in the proximal convoluted tubule"], c: 2, r: "Spironolactone and Eplerenone competitively block cytoplasmic mineralocorticoid receptors in the late distal tubule and collecting duct, reducing ENaC expression and retaining potassium." },
        { cat: 3, q: "Unfractionated Heparin (UFH) produces immediate parenteral anticoagulation. How does heparin molecularly interact with Antithrombin III to inhibit coagulation?", a: ["Directly binds and hydrolyzes fibrin polymers within an established clot", "Irreversibly blocks the platelet membrane GP IIb/IIIa receptor complex", "Competitively antagonizes Vitamin K epoxide reductase in the endoplasmic reticulum of hepatocytes", "Binds Antithrombin III via a specific pentasaccharide sequence, inducing a conformational change that accelerates inactivation of Thrombin (Factor IIa) and Factor Xa by ~1000-fold"], c: 3, r: "UFH binds Antithrombin III via a specific pentasaccharide sequence, inducing a conformational change that accelerates ATIII-mediated inactivation of Thrombin (IIa) and Factor Xa by ~1000-fold." },
        { cat: 3, q: "Low Molecular Weight Heparins (LMWH, e.g., Enoxaparin) have largely replaced Unfractionated Heparin (UFH) for routine venous thromboembolism management. What is the primary pharmacological and pharmacokinetic difference between LMWH and UFH?", a: ["LMWH has higher anti-Factor Xa activity relative to anti-Factor IIa activity (~2:1 to 4:1), higher bioavailability, a longer half-life, and does not require routine aPTT monitoring", "LMWH preferentially inhibits Thrombin (IIa) over Factor Xa", "LMWH is given orally whereas UFH is given parenterally", "LMWH cannot be used in patients with deep venous thrombosis"], c: 0, r: "LMWH has a shorter polysaccharide chain length, producing an anti-Xa:anti-IIa ratio of 2:1 to 4:1, with high bioavailability, long half-life, and no routine aPTT monitoring needed." },
        { cat: 3, q: "A 62-year-old male with a history of transient ischemic attacks (TIA) requires antiplatelet therapy for secondary stroke prevention. The clinical pharmacology team evaluates ticlopidine versus clopidogrel. Why is clopidogrel preferred over ticlopidine for routine clinical therapy according to your lecture slides?", a: ["Ticlopidine is ineffective orally and must be administered by continuous intravenous infusion", "Ticlopidine carries a high risk of life-threatening hematologic adverse reactions, including neutropenia/agranulocytosis, thrombotic thrombocytopenic purpura (TTP), and aplastic anemia", "Ticlopidine causes severe acute renal failure and profound hyperkalemia in over 50% of patients", "Ticlopidine has an extremely short elimination half-life of 15 minutes, requiring six doses daily"], c: 1, r: "Dr. Alsbou's slides highlight that ticlopidine carries life-threatening hematologic risks (agranulocytosis, TTP, aplastic anemia), making clopidogrel the preferred first-line agent." },
        { cat: 3, q: "A 54-year-old patient requiring systemic anticoagulation is evaluated on the surgical ward. According to Dr. Alsbou's pharmacology lecture on heparin, which clinical situation represents an absolute surgical contraindication to heparin administration, and which adverse effect is specifically associated with long-term heparin therapy?", a: ["Recent minor dental scaling; Ototoxicity", "History of uncomplicated deep vein thrombosis; Pulmonary fibrosis", "During and after surgery of the brain, eye, or spinal cord; Osteoporosis", "Concomitant administration of beta-blockers; Retinal detachment"], c: 2, r: "Heparin is absolutely contraindicated during and after surgery of the brain, eye, or spinal cord due to catastrophic hemorrhage risk; long-term use is associated with osteoporosis." },
        { cat: 3, q: "Warfarin is a widely utilized oral anticoagulant. Which enzyme does warfarin competitively inhibit in hepatocytes to interfere with the post-translational modification of Vitamin K-dependent clotting factors?", a: ["Gamma-glutamyl carboxylase", "Hepatic lipase", "Factor Xa protease", "Vitamin K epoxide reductase (VKORC1)"], c: 3, r: "Warfarin competitively inhibits Vitamin K epoxide reductase (VKORC1), blocking the regeneration of reduced vitamin K required for gamma-carboxylation of Factors II, VII, IX, X, C, and S." },
        { cat: 3, q: "During the initial 24 to 48 hours of starting Warfarin therapy without heparin bridging, a patient can develop a transient paradoxical hypercoagulable state predisposing to microvascular thrombosis and skin necrosis. What explains this phenomenon?", a: ["Protein C has a very short half-life (~6 hours) and declines rapidly before procoagulant clotting factors (II, IX, X) are depleted", "Factor II (prothrombin) levels plummet within 2 hours of administration", "Warfarin induces immediate platelet aggregation via ADP release", "Direct cytotoxicity of warfarin metabolites on cutaneous vascular endothelium"], c: 0, r: "Anticoagulant Protein C has a very short half-life (~6 hours) and is cleared rapidly before procoagulant Factors II, IX, and X decline, causing transient unopposed hypercoagulability." },
        { cat: 3, q: "Dabigatran etexilate is an oral anticoagulant prescribed for stroke prevention in non-valvular atrial fibrillation. Which specific molecular mechanism describes its action?", a: ["Competitive antagonist of Vitamin K epoxide reductase", "Potent, reversible direct competitive inhibitor of Thrombin (Factor IIa)", "Direct allosteric activator of Antithrombin III", "Irreversible selective blocker of Factor Xa"], c: 1, r: "Dabigatran etexilate is an oral prodrug converted to dabigatran, a reversible direct competitive inhibitor of free and clot-bound Thrombin (Factor IIa)." },
        { cat: 3, q: "Rivaroxaban, Apixaban, and Edoxaban belong to which class of anticoagulants, and how do they achieve their clinical anticoagulant effect?", a: ["Direct Thrombin inhibitors that require routine aPTT monitoring", "Indirect Vitamin K antagonists that inhibit Factor VII carboxylation", "Direct Factor Xa inhibitors that selectively bind the active catalytic site of Factor Xa without requiring Antithrombin III", "Fibrinolytic agents that convert plasminogen to active plasmin"], c: 2, r: "Rivaroxaban, Apixaban, and Edoxaban are direct Factor Xa inhibitors (DOACs) that bind directly to the active site of Factor Xa without requiring Antithrombin III." },
        { cat: 3, q: "Ticlopidine and Clopidogrel are antiplatelet agents used to prevent ischemic stroke and atherosclerotic complications following recent MI. By which specific molecular mechanism do these drugs inhibit platelet aggregation according to your pharmacology lectures?", a: ["Reversibly inhibiting cyclooxygenase-1 (COX-1) to block thromboxane A2 synthesis", "Directly binding active Glycoprotein IIb/IIIa receptors to physically block fibrinogen bridging", "Inhibiting platelet phosphodiesterase to increase intracellular cAMP levels", "Irreversibly inhibiting the binding of adenosine diphosphate (ADP) to its receptors on platelets, thereby preventing the secondary activation of GP IIb/IIIa receptors"], c: 3, r: "Dr. Alsbou teaches that ticlopidine and clopidogrel irreversibly block ADP binding to platelet P2Y12 receptors, preventing activation of GP IIb/IIIa receptors." },
        { cat: 3, q: "Aspirin produces effective cardioprotective antiplatelet effects at low daily doses (75-81 mg/day). What is the biochemical mechanism responsible for this selective and durable platelet inhibition?", a: ["Irreversible covalent acetylation and inactivation of platelet Cyclooxygenase-1 (COX-1), blocking Thromboxane A2 (TXA2) synthesis for the platelet lifespan", "Reversible competitive inhibition of endothelial prostacyclin synthase", "Direct antagonism of platelet thromboxane prostanoid (TP) receptors", "Inhibition of lipoxygenase, preventing leukotriene B4 generation"], c: 0, r: "Aspirin permanently acetylates and inactivates platelet COX-1, shutting down Thromboxane A2 synthesis for the entire 7–10 day lifespan of the anucleate platelet." },
        { cat: 3, q: "Abciximab, Eptifibatide, and Tirofiban are potent intravenous antiplatelet agents administered during percutaneous coronary intervention (PCI). Which statement accurately describes their mechanism of action?", a: ["They selectively inhibit platelet phosphodiesterase-5", "They bind directly to platelet Glycoprotein IIb/IIIa receptors, blocking fibrinogen binding and halting the final common pathway of platelet aggregation", "They reversibly inhibit platelet cyclooxygenase-1", "They accelerate the degradation of prothrombin by Antithrombin III"], c: 1, r: "GP IIb/IIIa inhibitors (Abciximab, Eptifibatide, Tirofiban) block the final common pathway of aggregation by preventing fibrinogen bridging between adjacent platelets." },
        { cat: 3, q: "Fibrinolytic (thrombolytic) agents such as Alteplase (recombinant tissue plasminogen activator, rtPA), Reteplase, and Tenecteplase dissolve established intravascular thrombi by which enzymatic mechanism?", a: ["Directly cleaving fibrinogen molecules to prevent polymer formation", "Activating Antithrombin III to degrade Factor XIIIa", "Converting inactive plasminogen to active plasmin, which directly digests the insoluble fibrin clot meshwork", "Inhibiting alpha-2-antiplasmin to prevent endogenous fibrinolysis"], c: 2, r: "Fibrinolytic agents convert inactive plasminogen into active plasmin, an enzyme that directly degrades the insoluble cross-linked fibrin meshwork of established clots." },
        { cat: 3, q: "A 65-year-old male receiving an intravenous infusion of Unfractionated Heparin develops acute severe retroperitoneal hemorrhage. Heparin is immediately stopped. Which specific pharmacological antidote is administered intravenously to neutralize circulating heparin?", a: ["Vitamin K1 (Phytonadione)", "Fresh Frozen Plasma alone without antidote", "Aminocaproic acid", "Protamine sulfate"], c: 3, r: "Protamine sulfate is a positively charged polycationic protein that complexes with strongly negatively charged heparin molecules via electrostatic bonds, neutralizing anticoagulant activity." },
        { cat: 3, q: "A 58-year-old male presents with acute anterior ST-elevation myocardial infarction (STEMI) presenting within 3 hours of symptom onset. Primary percutaneous coronary intervention (PCI) is unavailable, and emergency intravenous fibrinolysis with Alteplase (tPA) is considered. Which clinical condition represents an absolute contraindication to fibrinolytic therapy according to your cardiovascular pharmacology lecture?", a: ["History of prior cerebrovascular accident (CVA / stroke) or active internal bleeding", "Mild essential hypertension well-controlled on an ACE inhibitor", "Concurrent daily administration of low-dose aspirin", "Elevated serum LDL cholesterol on statin therapy"], c: 0, r: "In Dr. Alsbou's slides, absolute contraindications to fibrinolytics include prior cerebrovascular accident (stroke), peptic ulcer, bleeding disorders, and active internal hemorrhage." },
        { cat: 3, q: "A clinical pharmacology ward round compares the pharmacological and pharmacokinetic profiles of Unfractionated Heparin versus Warfarin. According to Dr. Alsbou's comparison table, which statement correctly distinguishes Heparin from Warfarin?", a: ["Warfarin has an immediate onset of action within minutes, whereas Heparin requires several days to produce an anticoagulant effect", "Heparin acts immediately via Antithrombin III and is antagonized by protamine sulfate, whereas Warfarin interferes with hepatic factor synthesis, requires several days for full effect, and is antagonized by Vitamin K", "Warfarin is administered solely parenterally, whereas Heparin is taken orally", "Warfarin is safe during pregnancy, whereas Heparin readily crosses the placenta and is teratogenic"], c: 1, r: "Heparin is rapid-acting, administered parenterally, acts via Antithrombin III, and is reversed with protamine. Warfarin takes 3–5 days to deplete factors, is taken orally, and is reversed with Vitamin K." },
        { cat: 3, q: "A 32-year-old female with severe iron deficiency anemia is unable to tolerate oral ferrous sulfate due to intractable gastrointestinal adverse effects. She is prescribed parenteral iron dextran (CosmoFer). According to Dr. Alsbou's lecture on iron therapy, which adverse effect and clinical contraindication are specifically emphasized for parenteral iron?", a: ["Immediate hyperkalemia; contraindicated in congestive heart failure", "Severe hypercalcemia and nephrolithiasis; contraindicated in chronic renal disease", "Permanent skin staining on IM injection and risk of acute hypersensitivity / anaphylactoid reactions; contraindicated in patients with a history of allergic disorders (asthma, eczema)", "Aplastic bone marrow failure; contraindicated in G6PD deficiency"], c: 2, r: "Dr. Alsbou's slides highlight that parenteral iron can cause permanent skin staining, acute hypersensitivity/anaphylaxis, and is contraindicated in patients with allergic histories (asthma/eczema)." },

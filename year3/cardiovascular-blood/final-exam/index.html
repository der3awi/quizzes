    <style>

        .mode-tab:hover { color: #fff; }

            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px rgba(244, 63, 94, 0.4);

        .node.active { border-color: var(--accent); background: rgba(244, 63, 94, 0.12); color: white; }
        .node.past-active { border-color: var(--accent-gold); background: rgba(251, 191, 36, 0.15); color: white; }

        .node.wrong { border-color: var(--danger); color: var(--danger); }
        .node.flagged::before { content: ''; position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; background: var(--flag); border-radius: 50%; border: 2px solid var(--bg); }

        .stage { padding: 2rem 3rem; display: flex; justify-content: center; overflow-y: auto; }
        .content-wrap { max-width: 800px; width: 100%; }

        .proc-header { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-size: 0.75rem; margin-bottom: 1rem; opacity: 0.8; }
        .q-text { font-size: 1.25rem; font-weight: 700; line-height: 1.5; margin-bottom: 2rem; color: #fff; }

        .options { display: grid; gap: 0.85rem; }
        .opt-item { background: var(--panel); border: 1px solid var(--border); padding: 1.15rem 1.5rem; border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 1.25rem; font-size: 0.98rem; font-weight: 500; transition: 0.2s; }
        .opt-item:hover { border-color: var(--accent); transform: translateX(6px); }
        .opt-item.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .opt-item.wrong { border-color: var(--danger); background: rgba(244, 63, 94, 0.1); color: var(--danger); }
        .opt-index { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; opacity: 0.4; flex-shrink: 0; }

        .rationale { margin-top: 2rem; padding: 1.5rem; background: rgba(30, 41, 59, 0.6); border-left: 4px solid var(--accent); border-radius: 10px; display: none; line-height: 1.6; color: var(--text-dim); font-size: 0.92rem; }

        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.05); }
        .btn-next { background: var(--accent); color: #fff; flex: 1; box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3); }
        .btn-next:hover { opacity: 0.95; }
        
        .hub-link { color: var(--text-dim); text-decoration: none; font-size: 0.75rem; font-weight: 700; transition: 0.2s; display: inline-flex; align-items: center; }
        .hub-link:hover { color: var(--text); }

<script>
    // Categories:
    // 0: Anatomy & Development
    // 1: Physiology & Hemodynamics
    // 2: Hematology & Coagulation
    // 3: Pathology & Pharmacology

    const corePool = [
        { cat: 0, q: "A 45-year-old male presents with pericardial effusion. Pericardiocentesis is performed. Which layer of the pericardium is pierced immediately after passing through the fibrous pericardium?", a: ["Visceral pericardium", "Parietal serous pericardium", "Myocardium", "Epicardium"], c: 1, r: "The pericardium consists of an outer fibrous pericardium lined internally by the parietal serous pericardium. The pericardial cavity lies between parietal and visceral serous pericardium." },
        { cat: 0, q: "During fetal circulation, blood entering the right atrium from the inferior vena cava (IVC) is preferentially directed into the left atrium via which structure?", a: ["Ductus venosus", "Ductus arteriosus", "Foramen ovale", "Ligamentum arteriosum"], c: 2, r: "The valve of the IVC (Eustachian valve) directs oxygenated IVC blood through the foramen ovale into the left atrium." },
        { cat: 0, q: "A patient undergoes surgery in the posterior mediastinum. Which of the following structures is located directly posterior to the pericardium of the left atrium?", a: ["Thymus", "Esophagus", "Ascending aorta", "Phrenic nerve"], c: 1, r: "The esophagus lies in the posterior mediastinum directly behind the left atrium." },
        { cat: 1, q: "In ventricular pressure-volume loop analysis, an isolated increase in myocardial contractility (positive inotropy) results in which change?", a: ["Shift of ESPVR line to the left with increased stroke volume", "Increased EDV with unchanged ESV", "Shift of EDPVR to the right", "Decreased peak systolic pressure with increased ESV"], c: 0, r: "Increased contractility increases Emax (ESPVR slope), shifting ESV leftward and increasing SV." },
        { cat: 1, q: "During Phase 2 (plateau phase) of the cardiac ventricular action potential, which ionic currents are primarily balanced?", a: ["Inward Na+ current and outward K+ current", "Inward L-type Ca2+ current and outward delayed rectifier K+ current", "Inward T-type Ca2+ current and outward Na+ current", "Outward K+ current and inward Na+/K+ pump"], c: 1, r: "Phase 2 is maintained by balanced inward Ca2+ (L-type) flux and outward K+ efflux." },
        { cat: 1, q: "On a 12-lead ECG, acute ST-segment elevation in leads II, III, and aVF indicates transmural ischemia in which coronary territory?", a: ["Anterior wall (LAD)", "Inferior wall (RCA)", "Lateral wall (LCx)", "Septal wall (Septal branches)"], c: 1, r: "Leads II, III, and aVF reflect the inferior wall, typically supplied by the Right Coronary Artery (RCA)." },
        { cat: 1, q: "In subendocardial ischemia, what characteristic ECG change is typically observed during acute angina episodes?", a: ["Pathological Q waves > 0.04s", "Convex ST-segment elevation >= 2 mm", "Horizontal or downsloping ST-segment depression", "PR segment elevation"], c: 2, r: "Subendocardial ischemia causes ST depression or T wave inversion in leads facing the ischemic zone." },
        { cat: 2, q: "Which blood coagulation factor serves as the common convergence point where intrinsic and extrinsic pathways meet?", a: ["Factor IX", "Factor X", "Factor VIII", "Factor XI"], c: 1, r: "Factor X activation marks the beginning of the common coagulation pathway." },
        { cat: 2, q: "Monitoring unfractionated heparin (UFH) therapy is best accomplished by evaluating which laboratory parameter?", a: ["Prothrombin Time (PT) / INR", "Activated Partial Thromboplastin Time (aPTT)", "Bleeding Time", "Thrombin Time"], c: 1, r: "UFH inhibits IIa and Xa, prolonging aPTT (intrinsic pathway measure)." },
        { cat: 2, q: "A peripheral blood smear shows microcytic, hypochromic red blood cells with marked anisopoikilocytosis and pencil cells. Diagnosis?", a: ["Vitamin B12 deficiency", "Iron deficiency anemia", "Hereditary spherocytosis", "G6PD deficiency"], c: 1, r: "Iron deficiency presents with microcytic hypochromic indices, elevated RDW, and pencil/cigar cells." },
        { cat: 1, q: "The 'a' wave of the jugular venous pulse (JVP) corresponds to which mechanical cardiac event?", a: ["Isovolumetric contraction", "Right atrial contraction", "Passive atrial filling", "Rapid ventricular ejection"], c: 1, r: "The JVP 'a' wave represents presystolic right atrial contraction." },
        { cat: 2, q: "Which enzyme cleaves fibrinopeptides A and B from soluble fibrinogen to form insoluble fibrin monomers?", a: ["Plasmin", "Thrombin (Factor IIa)", "Factor XIIIa", "Kallikrein"], c: 1, r: "Thrombin cleaves fibrinogen into fibrin monomers." },
        { cat: 1, q: "In a pressure-volume loop, the closure of the aortic valve marks the beginning of which cardiac phase?", a: ["Isovolumetric contraction", "Rapid ventricular ejection", "Isovolumetric relaxation", "Reduced ventricular filling"], c: 2, r: "Aortic valve closure ends ejection and initiates isovolumetric relaxation." },
        { cat: 1, q: "Which cardiac pacemaker tissue possesses the fastest intrinsic rate of spontaneous Phase 4 depolarization?", a: ["Atrioventricular (AV) node", "Sinoatrial (SA) node", "Bundle of His", "Purkinje fibers"], c: 1, r: "SA node has the steepest Phase 4 slope and highest intrinsic firing rate (60–100 bpm)." },
        { cat: 1, q: "A sudden increase in systemic vascular resistance (afterload) causes which acute change on the LV pressure-volume loop?", a: ["Increased stroke volume and decreased peak systolic pressure", "Increased ESV, elevated peak systolic pressure, and reduced stroke volume", "Decreased EDV with unchanged ESV", "Leftward shift of the EDPVR line"], c: 1, r: "Higher afterload raises peak LV systolic pressure, increases ESV, and reduces SV." },
        { cat: 1, q: "What is the primary driver of passive fluid movement across capillary walls at the arterial end of the microcirculation?", a: ["Interstitial oncotic pressure", "Capillary hydrostatic pressure (Pc)", "Capillary oncotic pressure (pi_c)", "Interstitial hydrostatic pressure"], c: 1, r: "Capillary hydrostatic pressure (Pc) exceeds capillary oncotic pressure at the arterial end, favoring filtration." },
        { cat: 1, q: "During ventricular repolarization, which cardiac ECG wave is produced?", a: ["P wave", "QRS complex", "T wave", "U wave"], c: 2, r: "The T wave represents ventricular repolarization." },
        { cat: 0, q: "Which structure develops from the septum transversum during embryonic development?", a: ["Crura of the diaphragm", "Central tendon of the diaphragm", "Posterolateral abdominal wall", "Fibrous pericardium superiorly"], c: 1, r: "The septum transversum gives rise to the central tendon of the diaphragm." },
        { cat: 0, q: "In fetal development, the ductus arteriosus anatomical remnant in adults is known as what structure?", a: ["Ligamentum teres hepatis", "Ligamentum venosum", "Ligamentum arteriosum", "Fossa ovalis"], c: 2, r: "The obliterated ductus arteriosus becomes the ligamentum arteriosum." },
        { cat: 0, q: "Which artery supplies the sinoatrial (SA) node in the majority (~60%) of human hearts?", a: ["Left anterior descending artery", "Nodal branch of the Right Coronary Artery", "Circumflex artery branch", "Marginal artery"], c: 1, r: "The SA nodal artery arises from the RCA in ~60% of individuals." },
        { cat: 1, q: "On ECG, PR interval prolongation > 0.20 seconds with a 1:1 AV conduction ratio defines which rhythm abnormality?", a: ["First-degree AV block", "Mobitz Type I second-degree block", "Mobitz Type II second-degree block", "Third-degree complete AV block"], c: 0, r: "First-degree AV block presents with constant prolonged PR interval (>200 ms) and 1:1 AV conduction." },
        { cat: 1, q: "A widened QRS complex (> 0.12 seconds) with a broad 'M-shaped' R wave in V1/V2 indicates which conduction defect?", a: ["Left bundle branch block (LBBB)", "Right bundle branch block (RBBB)", "Left anterior fascicular block", "Wolff-Parkinson-White syndrome"], c: 1, r: "RBBB shows QRS > 120 ms and rsR' or M-shaped pattern in right precordial leads (V1-V2)." },
        { cat: 2, q: "What is the normal reference range for reticulocytes in peripheral blood?", a: ["0.1 - 0.3 %", "0.5 - 3.0 %", "5.0 - 10.0 %", "12.0 - 15.0 %"], c: 1, r: "Normal adult reticulocyte count ranges from 0.5% to 3.0% of total RBCs." },
        { cat: 2, q: "Which plasma protein is primarily responsible for maintaining intravascular colloid osmotic (oncotic) pressure?", a: ["Fibrinogen", "Albumin", "Alpha-2 macroglobulin", "Transferrin"], c: 1, r: "Albumin accounts for approximately 70-80% of total plasma oncotic pressure." },
        { cat: 2, q: "In a patient with severe megaloblastic anemia, peripheral blood examination characteristically demonstrates:", a: ["Microcytic target cells and Howell-Jolly bodies", "Hypersegmented neutrophils (>= 5 lobes) and oval macrocytes", "Spherocytes and Heinz bodies", "Schistocytes and nucleated RBCs"], c: 1, r: "Megaloblastic anemia (B12/folate deficiency) features oval macrocytes and hypersegmented neutrophils." },
        { cat: 2, q: "Which leukocyte contains dense cytoplasmic granules rich in histamine, heparin, and leukotrienes?", a: ["Neutrophil", "Eosinophil", "Basophil", "Monocyte"], c: 2, r: "Basophils contain dark granules loaded with histamine, heparin, and inflammatory mediators." },
        { cat: 2, q: "During primary hemostasis, platelet adhesion to subendothelial collagen is mediated by interaction between collagen and which platelet membrane receptor via vWF?", a: ["GPIIb/IIIa", "GPIb-IX-V complex", "P2Y12 receptor", "PAR-1 receptor"], c: 1, r: "vWF binds subendothelial collagen and attaches to platelet membrane GPIb receptor." },
        { cat: 2, q: "Prothrombin Time (PT) specifically assesses the activity of which coagulation pathway(s)?", a: ["Intrinsic pathway only", "Extrinsic and common pathways", "Fibrinolytic system only", "Platelet activation cascade"], c: 1, r: "PT/INR evaluates the extrinsic (Factor VII) and common pathways (X, V, II, I)." },
        { cat: 2, q: "Which blood group type is designated as the universal red blood cell donor because its RBCs lack A and B surface antigens?", a: ["Type AB Positive", "Type O Negative", "Type A Negative", "Type B Positive"], c: 1, r: "O negative RBCs lack A, B, and Rh antigens, allowing universal RBC transfusion." },
        { cat: 2, q: "Antithrombin III activity is endogenously accelerated by several thousand-fold upon binding to which endothelial cell surface glycosaminoglycan?", a: ["Thrombomodulin", "Heparan sulfate", "Prostacyclin", "Selectin"], c: 1, r: "Endothelial heparan sulfate activates Antithrombin III naturally." },
        { cat: 2, q: "Which metabolic product synthesized by vascular endothelial cells inhibits platelet aggregation and induces vasodilation?", a: ["Thromboxane A2", "Prostacyclin (PGI2)", "Endothelin-1", "Factor VIII"], c: 1, r: "PGI2 increases cAMP in platelets and smooth muscle, causing inhibition of aggregation and vasodilation." },
        { cat: 2, q: "In Classical Hodgkin Lymphoma, Reed-Sternberg cells characteristically express which diagnostic cell surface markers?", a: ["CD3 and CD4", "CD15 and CD30", "CD19 and CD20", "CD68 and CD163"], c: 1, r: "Classic RS cells are CD15+ and CD30+ (and typically CD20 negative)." },
        { cat: 2, q: "A patient with suspected Immune Thrombocytopenic Purpura (ITP) would be expected to show which isolated laboratory abnormality?", a: ["Prolonged PT/INR", "Isolated thrombocytopenia with normal PT, aPTT, and fibrinogen", "Decreased fibrinogen with elevated D-dimer", "Prolonged aPTT with normal platelet count"], c: 1, r: "ITP is characterized by isolated immune-mediated platelet destruction." },
        { cat: 2, q: "Which plasma lipoprotein class contains the highest percentage of endogenous triglycerides?", a: ["Chylomicrons", "Very Low-Density Lipoproteins (VLDL)", "Low-Density Lipoproteins (LDL)", "High-Density Lipoproteins (HDL)"], c: 1, r: "VLDL transports endogenously synthesized triglycerides from the liver (Chylomicrons carry dietary/exogenous TG)." },
        { cat: 2, q: "Familial Hypercholesterolemia (Type IIa) is most commonly caused by loss-of-function mutations in the gene encoding:", a: ["Apolipoprotein E", "LDL receptor", "Lipoprotein lipase (LPL)", "LCAT"], c: 1, r: "Mutation in the LDL receptor gene leads to decreased hepatic LDL clearance and high circulating LDL." },
        { cat: 2, q: "A 68-year-old male presents with bone pain, hypercalcemia, renal failure, and normocytic anemia. Serum protein electrophoresis shows a monoclonal spike (M-protein). Bone marrow biopsy reveals:", a: ["Auer rods in myeloblasts", "> 10% clonal plasma cells", "Reed-Sternberg cells", "Smudge cells"], c: 1, r: "Multiple Myeloma is diagnosed by >10% clonal plasma cells in marrow plus CRAB end-organ damage." },
        { cat: 2, q: "Which major apolipoprotein serves as the structural protein for LDL, VLDL, and IDL, acting as the ligand for the LDL receptor?", a: ["Apo A-I", "Apo B-100", "Apo C-II", "Apo E"], c: 1, r: "Apo B-100 is present on liver-derived lipoproteins (VLDL, IDL, LDL) and binds the LDL receptor." },
        { cat: 2, q: "Severe Vitamin B12 deficiency leads to neurological deficits (subacute combined degeneration) primarily due to impairment of which biochemical enzyme?", a: ["Dihydrofolate reductase", "Methylmalonyl-CoA mutase", "Glucose-6-phosphate dehydrogenase", "Ferrochelatase"], c: 1, r: "Impairment of methylmalonyl-CoA mutase leads to buildup of methylmalonic acid and abnormal myelin synthesis." },
        { cat: 2, q: "In Glucose-6-Phosphate Dehydrogenase (G6PD) deficiency, erythrocyte oxidative damage results in denatured hemoglobin aggregates known as:", a: ["Howell-Jolly bodies", "Heinz bodies", "Pappenheimer bodies", "Basophilic stippling"], c: 1, r: "Heinz bodies are precipitated hemoglobin clumps formed during oxidative stress in G6PD deficiency." },
        { cat: 2, q: "Which helper T-cell subset produces IL-4, IL-5, and IL-13, driving IgE class switching and eosinophil activation?", a: ["Th1 cells", "Th2 cells", "Th17 cells", "Treg cells"], c: 1, r: "Th2 cytokines (IL-4, IL-5, IL-13) mediate anti-helminth immunity, allergic reactions, and eosinophilia." },
        { cat: 2, q: "The intrinsic tenase complex of the coagulation cascade consists of Activated Factor IX (IXa), Calcium, Phospholipid, and which co-factor?", a: ["Factor Va", "Factor VIIIa", "Factor VIIa", "Tissue Factor"], c: 1, r: "Intrinsic tenase = Factor IXa + Factor VIIIa + Ca2+ + phospholipid membrane surface." },
        { cat: 2, q: "Inherited deficiency of Protein C or Protein S leads to an increased risk of venous thromboembolism because these proteins normally:", a: ["Inhibit Tissue Factor", "Inactivate Factors Va and VIIIa", "Inhibit thrombin directly", "Degrade fibrin crosslinks"], c: 1, r: "Activated Protein C (APC) with cofactor Protein S degrades Factors Va and VIIIa." },
        { cat: 2, q: "A 28-year-old female with recurrent deep vein thrombosis and fetal loss tests positive for Lupus Anticoagulant and Anticardiolipin antibodies. What is the diagnosis?", a: ["Henoch-Schonlein purpura", "Antiphospholipid Syndrome (APS)", "Disseminated Intravascular Coagulation", "Thrombotic Thrombocytopenic Purpura"], c: 1, r: "APS causes hypercoagulability (venous/arterial thrombosis) and pregnancy loss associated with antiphospholipid antibodies." },
        { cat: 0, q: "Which microvascular vessel type lacks smooth muscle and consists solely of a single layer of endothelial cells supported by a basement membrane?", a: ["Arteriole", "Capillary", "Venule", "Metarteriole"], c: 1, r: "Capillaries consist of a single endothelial layer and basement membrane, lacking smooth muscle tunic." },
        { cat: 2, q: "Elevated levels of plasma Homocysteine increase cardiovascular risk by promoting endothelial injury and thrombosis. Supplementation with which vitamins lowers homocysteine?", a: ["Vitamins A, C, and E", "Vitamins B6, B9 (Folate), and B12", "Vitamins D and K", "Niacin and Thiamine"], c: 1, r: "Homocysteine metabolism requires B6 (cystathionine beta-synthase pathway) and B9/B12 (methionine synthase pathway)." },
        { cat: 2, q: "Which organ serves as the primary site of extramedullary hematopoiesis in pathological conditions such as myelofibrosis?", a: ["Kidney", "Spleen", "Thymus", "Pancreas"], c: 1, r: "The spleen (along with the liver) is the main organ for extramedullary hematopoiesis." },
        { cat: 2, q: "Which type of hypersensitivity reaction mediates Acute Hemolytic Transfusion Reactions due to ABO incompatibility?", a: ["Type I (IgE-mediated)", "Type II (Cytotoxic IgG/IgM and complement)", "Type III (Immune-complex)", "Type IV (Cell-mediated)"], c: 1, r: "ABO incompatibility triggers IgM/IgG binding to donor RBCs with complement activation (Type II hypersensitivity)." },
        { cat: 2, q: "What is the key functional role of von Willebrand Factor (vWF) regarding Factor VIII in circulation?", a: ["vWF cleaves and inactivates Factor VIII", "vWF acts as a carrier protein that stabilizes Factor VIII and extends its half-life", "vWF converts Factor VIII to Factor VIIIa", "vWF inhibits Factor VIII synthesis in the liver"], c: 1, r: "vWF binds Factor VIII, protecting it from rapid degradation in plasma." },
        { cat: 1, q: "Which vascular bed exhibits hypoxic pulmonary vasoconstriction (HPVC), contracting smooth muscle in response to low alveolar PO2?", a: ["Coronary circulation", "Pulmonary circulation", "Cerebral circulation", "Skeletal muscle circulation"], c: 1, r: "Pulmonary vessels constrict during alveolar hypoxia to divert blood toward better-ventilated alveoli." },
        { cat: 1, q: "At the cellular level, cardiac excitation-contraction coupling relies on Ca2+-induced Ca2+ release from the sarcoplasmic reticulum via which receptor channel?", a: ["IP3 receptor", "Ryanodine receptor (RyR2)", "Dihydropyridine receptor alone", "SERCA2a pump"], c: 1, r: "Inward L-type Ca2+ current activates RyR2 channels on the sarcoplasmic reticulum, triggering massive Ca2+ release." },
        { cat: 3, q: "What is the earliest histological feature visible by light microscopy in myocardium undergoing irreversible ischemic necrosis (MI) between 4–12 hours post-occlusion?", a: ["Abundant neutrophil infiltration", "Coagulative necrosis with wavy fibers and contraction bands", "Dense granulation tissue formation", "Macrophage clearing of necrotic debris"], c: 1, r: "At 4–12 hours, early coagulative necrosis, elongation/wavy fibers, and contraction bands appear." },
        { cat: 3, q: "Which cardiac biomarker elevates within 3–4 hours of myocardial infarction, peaks at 24 hours, and remains elevated for 7–10 days?", a: ["CK-MB", "Cardiac Troponin I / T (cTnI/cTnT)", "Myoglobin", "LDH-1"], c: 1, r: "Cardiac Troponin I and T rise at 3-4h, peak at 24h, and persist for up to 10-14 days." },
        { cat: 3, q: "Stable atherosclerotic plaques associated with stable angina typically feature which morphologic characteristics?", a: ["Thin fibrous cap and large lipid core with rich foam cell inflammation", "Thick dense fibrous cap with small necrotic lipid core and minimal inflammation", "Superficial ulceration and intra-plaque hemorrhage", "Complete disruption of internal elastic lamina with luminal thrombus"], c: 1, r: "Stable plaques have a thick fibrous cap, small lipid core, and sparse inflammatory cells, making them resistant to rupture." },
        { cat: 3, q: "A 58-year-old male post-MI day 5 develops sudden hypotension, distant heart sounds, and jugular venous distension (Beck's triad). Echocardiogram reveals pericardial tamponade. Diagnosis?", a: ["Papillary muscle rupture", "Ventricular free wall rupture", "Interventricular septal rupture", "Dressler syndrome"], c: 1, r: "Free wall rupture typically occurs 3-7 days post-MI during peak macrophage clearance, causing hemopericardium and tamponade." },
        { cat: 3, q: "Which cardiac pathology is characterized autosomal dominantly by mutations in sarcomeric proteins (e.g., beta-myosin heavy chain) and asymmetric septal hypertrophy?", a: ["Dilated Cardiomyopathy", "Hypertrophic Obstructive Cardiomyopathy (HOCM)", "Restrictive Cardiomyopathy", "Arrhythmogenic Right Ventricular Dysplasia"], c: 1, r: "HOCM is caused by mutations in sarcomeric genes (beta-myosin heavy chain, MYBPC3) causing asymmetric septal hypertrophy." },
        { cat: 3, q: "Histological examination of a nodular lesion from a young female with fever and arthralgia shows Aschoff bodies with Anitschkow ('caterpillar') cells. Diagnosis?", a: ["Infective endocarditis", "Acute Rheumatic Fever", "Libman-Sacks endocarditis", "Non-bacterial thrombotic endocarditis"], c: 1, r: "Aschoff bodies containing Anitschkow multinucleated histiocytes are pathognomonic for Acute Rheumatic Carditis." },
        { cat: 3, q: "Which vasculitis characteristically affects young Asian females, involves the aortic arch and its major branches, and presents with absent upper extremity pulses ('pulseless disease')?", a: ["Giant Cell Arteritis", "Takayasu Arteritis", "Polyarteritis Nodosa", "Kawasaki Disease"], c: 1, r: "Takayasu arteritis is a granulomatous vasculitis of the aorta and main branches leading to arterial stenosis and weak/absent pulses." },
        { cat: 3, q: "Giant Cell (Temporal) Arteritis affects medium and large arteries in elderly patients. Untreated, it carries a high risk of permanent blindness due to involvement of which artery?", a: ["Facial artery", "Ophthalmic / Posterior ciliary arteries", "Middle cerebral artery", "Superficial temporal artery alone"], c: 1, r: "Ischemic optic neuropathy from occlusion of ophthalmic/posterior ciliary branches causes sudden blindness." },
        { cat: 3, q: "A 4-year-old child presents with 5 days of high fever, bilateral non-purulent conjunctivitis, strawberry tongue, desquamating rash, and cervical lymphadenopathy. Primary fatal complication if untreated?", a: ["Renal artery thrombosis", "Coronary artery aneurysms and rupture/MI", "Pulmonary embolism", "Aortic dissection"], c: 1, r: "Kawasaki disease risks coronary artery aneurysms in up to 20-25% of untreated children; treated with IVIG and aspirin." },
        { cat: 3, q: "Granulomatosis with Polyangiitis (GPA / Wegener's) classically presents with necrotizing granulomas of the upper/lower respiratory tract, focal necrotizing glomerulonephritis, and positivity for which autoantibody?", a: ["MPO-ANCA (p-ANCA)", "PR3-ANCA (c-ANCA)", "Anti-dsDNA", "Anti-centromere"], c: 1, r: "GPA is strongly associated with c-ANCA (proteinase 3 / PR3-ANCA)." },
        { cat: 3, q: "Which small-vessel vasculitis presents in children following an upper respiratory infection with palpable purpura on buttocks/lower extremities, abdominal pain, arthralgia, and IgA immune complex deposition?", a: ["Microscopic Polyangiitis", "Henoch-Schönlein Purpura (IgA Vasculitis)", "Eosinophilic Granulomatosis with Polyangiitis", "Polyarteritis Nodosa"], c: 1, r: "HSP (IgA vasculitis) classically manifests with palpable purpura, arthritis, abdominal pain, and renal disease with IgA deposition." },
        { cat: 3, q: "Eosinophilic Granulomatosis with Polyangiitis (EGPA / Churg-Strauss) is distinguished from other small-vessel vasculitides by which key clinical combination?", a: ["Severe asthma, peripheral eosinophilia, and granulomatous vasculitis", "Hepatitis B positivity and necrotizing medium-vessel vasculitis", "Saddle-nose deformity and c-ANCA positivity", "Recurrent oral/genital aphthous ulcers"], c: 0, r: "EGPA features allergic rhinitis/asthma, marked eosinophilia, p-ANCA, and extravascular granulomas." },
        { cat: 3, q: "Polyarteritis Nodosa (PAN) is a necrotizing vasculitis of medium-sized arteries that characteristically spares which vascular bed?", a: ["Renal arteries", "Pulmonary vessels", "Mesenteric arteries", "Coronary arteries"], c: 1, r: "PAN affects medium arteries in kidneys, heart, GI tract, but characteristically SPARES the pulmonary circulation." },
        { cat: 3, q: "What is the most common causative organism of Subacute Infective Endocarditis involving native valves damaged by prior rheumatic heart disease?", a: ["Staphylococcus aureus", "Viridans group Streptococci (e.g., S. sanguinis, S. mitis)", "Staphylococcus epidermidis", "Enterococcus faecalis"], c: 1, r: "Viridans streptococci (low virulence, oral flora) cause subacute native valve endocarditis on pre-damaged valves." },
        { cat: 3, q: "In an intravenous drug user (IVDU) presenting with acute fever, chills, and new murmur, which heart valve is most commonly infected, and by which pathogen?", a: ["Mitral valve; Streptococcus pneumoniae", "Tricuspid valve; Staphylococcus aureus", "Aortic valve; Pseudomonas aeruginosa", "Pulmonary valve; Candida albicans"], c: 1, r: "IVDU infective endocarditis predominantly involves the tricuspid valve with high-virulence Staphylococcus aureus." },
        { cat: 3, q: "Patient with prosthetic heart valve implanted 2 months ago develops acute endocarditis. Blood cultures grow Gram-positive, catalase-positive, coagulase-negative cocci. Pathogen?", a: ["Streptococcus pyogenes", "Staphylococcus epidermidis", "Streptococcus bovis", "Staphylococcus aureus"], c: 1, r: "Staphylococcus epidermidis is the leading cause of early (<60-90 days) prosthetic valve endocarditis due to biofilm production." },
        { cat: 3, q: "Infective Endocarditis physical examination reveals small, non-tender, erythematous macular lesions on the palms and soles. These represent:", a: ["Osler nodes (immunologic)", "Janeway lesions (septic microemboli)", "Roth spots (retinal hemorrhage)", "Splinter hemorrhages"], c: 1, r: "Janeway lesions are non-tender erythematous macules caused by septic emboli; Osler nodes are tender immunocomplex papules on digits." },
        { cat: 3, q: "Which diagnostic imaging modality offers superior sensitivity (> 90–95%) for detecting valve perforations, perivalvular abscesses, and small vegetations (< 2 mm) in Infective Endocarditis?", a: ["Transthoracic Echocardiogram (TTE)", "Transesophageal Echocardiogram (TEE)", "Chest X-ray", "Coronary CT Angiography"], c: 1, r: "TEE is far more sensitive than TTE for detecting small vegetations and perivalvular abscesses." },
        { cat: 3, q: "Bacterial biofilms on cardiac implantable electronic devices (CIEDs) produce an extracellular polymeric substance (EPS) matrix that confers antimicrobial resistance primarily by:", a: ["Mutating bacterial ribosomal RNA genes", "Restricting antibiotic penetration, creating metabolic dormancy, and shielding against host phagoctyes", "Secreting beta-lactamase enzymes exclusively", "Pumping out all lipophilic drugs via ABC transporters"], c: 1, r: "Biofilm EPS acts as a physical barrier, slows metabolic rates of bacteria, and resists host defense mechanisms." },
        { cat: 3, q: "Isolation of Streptococcus gallolyticus (formerly S. bovis) in blood cultures from a patient with endocarditis requires immediate diagnostic evaluation for:", a: ["Primary lung carcinoma", "Colorectal adenoma or carcinoma", "Renal cell carcinoma", "Pancreatic ductal adenocarcinoma"], c: 1, r: "S. gallolyticus bacteremia/endocarditis is strongly associated with underlying occult colorectal neoplasia." },
        { cat: 3, q: "Statins (e.g., Atorvastatin, Rosuvastatin) lower plasma LDL cholesterol primarily by inhibiting which rate-limiting enzyme?", a: ["Lipoprotein lipase (LPL)", "HMG-CoA reductase", "Proprotein convertase subtilisin/kexin type 9 (PCSK9)", "Cholesterol ester transfer protein (CETP)"], c: 1, r: "Statins competitively inhibit HMG-CoA reductase, upregulating hepatic LDL receptors and lowering plasma LDL." },
        { cat: 3, q: "Ezetimibe lowers circulating cholesterol levels by specifically targeting and inhibiting which intestinal transport protein?", a: ["SGLT2", "Niemann-Pick C1-Like 1 (NPC1L1)", "ABCA1 transporter", "BSEP pump"], c: 1, r: "Ezetimibe inhibits NPC1L1 in the jejunal brush border, decreasing dietary and biliary cholesterol absorption." },
        { cat: 3, q: "Which class of antiarrhythmic agents causes selective block of rapid inward Na+ channels with intermediate binding kinetics, prolonging both Phase 0 slope and action potential duration (APD)?", a: ["Class Ia (e.g., Quinidine, Procainamide)", "Class Ib (e.g., Lidocaine)", "Class Ic (e.g., Flecainide)", "Class II (Beta-blockers)"], c: 0, r: "Class Ia drugs (Quinidine, Procainamide, Disopyramide) block Na+ channels and K+ channels, prolonging APD and QTc." },
        { cat: 3, q: "Lidocaine (Class Ib antiarrhythmic) is clinically indicated primarily for the treatment of which type of arrhythmia?", a: ["Atrial fibrillation and atrial flutter", "Acute ventricular arrhythmias post-myocardial infarction", "AV nodal re-entrant tachycardia (AVNRT)", "WPW accessory pathway anterograde conduction"], c: 1, r: "Lidocaine selectively binds depolarized/ischemic ventricular myocardium, making it effective for post-MI ventricular tachycardia." },
        { cat: 3, q: "Class Ic antiarrhythmic drugs (e.g., Flecainide, Propafenone) demonstrate strong binding kinetics to Na+ channels without changing APD. They are contraindicated in patients with:", a: ["Isolated atrial premature beats", "Structural or ischemic heart disease (prior MI)", "Normal baseline QRS duration", "Mild essential hypertension"], c: 1, r: "CAST trial demonstrated Flecainide increases mortality in patients with structural/ischemic heart disease due to proarrhythmia." },
        { cat: 3, q: "Beta-adrenergic receptor blockers (Class II antiarrhythmics, e.g., Metoprolol, Bisoprolol) suppress pacemaking activity by:", a: ["Increasing intracellular cAMP and Ca2+ influx", "Decreasing SA node Phase 4 slope and slowing AV nodal conduction", "Directly opening L-type calcium channels", "Blocking cardiac fast sodium currents in Phase 0"], c: 1, r: "Beta-blockers decrease cAMP, flattening SA node Phase 4 depolarization and prolonging AV node conduction/refractoriness." },
        { cat: 3, q: "Amiodarone is a Class III antiarrhythmic that acts predominantly by blocking outward K+ channels (IKr). Which adverse effect profile is associated with long-term amiodarone therapy?", a: ["Agranulocytosis and lupus-like syndrome", "Pulmonary fibrosis, hypothyroidism/hyperthyroidism, corneal microdeposits, and hepatotoxicity", "Severe peripheral edema and gingival hyperplasia", "Cinchonism, diarrhea, and thrombocytopenia"], c: 1, r: "Amiodarone exhibits extensive tissue accumulation causing pulmonary toxicity, thyroid dysfunction, liver toxicity, and skin blue-gray discoloration." },
        { cat: 3, q: "Non-dihydropyridine Calcium Channel Blockers (Diltiazem, Verapamil) exert pronounced negative inotropic and chronotropic effects. They are contraindicated when combined with:", a: ["Thiazide diuretics", "Beta-blockers (risk of severe bradycardia and high-grade AV block)", "Statins", "ACE inhibitors"], c: 1, r: "Combining Verapamil/Diltiazem with Beta-blockers causes additive AV node blockade and severe bradycardia/cardiac arrest." },
        { cat: 3, q: "Dihydropyridine CCBs (e.g., Amlodipine, Nifedipine) lower blood pressure primarily via selective inhibition of L-type Ca2+ channels in:", a: ["Sinoatrial nodal pacemaker cells", "Vascular smooth muscle arterioles", "Renal collecting duct principal cells", "Purkinje fiber conduction pathways"], c: 1, r: "Dihydropyridines selectively dilate peripheral vascular smooth muscle with minimal direct cardiac effect." },
        { cat: 3, q: "ACE inhibitors (e.g., Enalapril, Lisinopril) lower blood pressure and prevent cardiac remodeling. A common side effect mediated by elevated bradykinin is:", a: ["Reflex tachycardia", "Dry non-productive cough", "Hypokalemia", "Gouty arthritis"], c: 1, r: "ACE degrades bradykinin; ACE inhibition causes bradykinin accumulation in lungs leading to dry cough (and angioedema)." },
        { cat: 3, q: "A patient taking Lisinopril develops acute renal function impairment after starting an NSAID. The primary mechanism of ACEi-induced acute drop in GFR is:", a: ["Constriction of the afferent arteriole", "Dilatation of the efferent arteriole, abolishing compensatory intraglomerular pressure", "Direct tubular necrosis", "Immune complex glomerulonephritis"], c: 1, r: "Angiotensin II preferentially constricts efferent arterioles; ACEi dilates efferent arterioles, lowering capillary hydrostatic pressure and GFR." },
        { cat: 3, q: "Which electrolyte disturbance is a characteristic risk of ACE inhibitor and Angiotensin Receptor Blocker (ARB) therapy, requiring monitoring?", a: ["Hypokalemia", "Hyperkalemia", "Hyponatremia", "Hypercalcemia"], c: 1, r: "Decreased aldosterone secretion reduces renal K+ excretion, leading to hyperkalemia." },
        { cat: 3, q: "Spironolactone and Eplerenone act as competitive antagonists at which receptor in the renal distal convoluted tubule and collecting duct?", a: ["Vasopressin V2 receptor", "Mineralocorticoid (Aldosterone) receptor", "Glucocorticoid receptor", "Alpha-1 adrenergic receptor"], c: 1, r: "Aldosterone receptor antagonists block Na+ reabsorption and K+ excretion in late distal/collecting tubules." },
        { cat: 3, q: "Unfractionated Heparin (UFH) produces rapid anticoagulation by binding Antithrombin III and accelerating inactivation of Factor Xa and which other factor?", a: ["Factor VIIa", "Factor IIa (Thrombin)", "Factor XIIIa", "Factor TF"], c: 1, r: "UFH forms a ternary complex with AT-III and Thrombin (IIa), inhibiting both IIa and Xa equally (1:1 ratio)." },
        { cat: 3, q: "Low Molecular Weight Heparin (LMWH, e.g., Enoxaparin) differs from UFH in that LMWH:", a: ["Inhibits Factor IIa far more than Factor Xa", "Has a higher relative anti-Factor Xa to anti-Factor IIa activity ratio (~2-4:1) and predictable bioavailability", "Requires routine monitoring using aPTT", "Has a significantly shorter half-life than UFH"], c: 1, r: "LMWH shorter polysaccharide chains fail to bridge AT-III to Thrombin, favoring anti-Xa activity over anti-IIa, with reliable subcutaneous pharmacokinetics." },
        { cat: 3, q: "In patients developing Heparin-Induced Thrombocytopenia (HIT Type II), circulating antibodies form against complexes of heparin and:", a: ["Von Willebrand Factor", "Platelet Factor 4 (PF4)", "Prothrombin", "Fibrinogen"], c: 1, r: "HIT II is an IgG immune reaction against Heparin-PF4 complexes, activating platelets and causing thrombosis and thrombocytopenia." },
        { cat: 3, q: "Which parenteral direct thrombin inhibitor is the anticoagulant of choice for managing patients with active Heparin-Induced Thrombocytopenia (HIT)?", a: ["Warfarin", "Argatroban", "Enoxaparin", "Fondaparinux"], c: 1, r: "Argatroban (or Bivalirudin) directly inhibits free and clot-bound thrombin without binding PF4, suitable for HIT." },
        { cat: 3, q: "Warfarin inhibits hepatic synthesis of Vitamin K-dependent clotting factors by inhibiting which enzyme?", a: ["Factor Xa", "Vitamin K epoxide reductase (VKORC1)", "Gamma-glutamyl carboxylase", "Thrombin"], c: 1, r: "Warfarin blocks VKORC1, preventing reduction of Vitamin K required for gamma-carboxylation of Factors II, VII, IX, X, and Proteins C/S." },
        { cat: 3, q: "In initiating Warfarin therapy, transient hypercoagulability and skin necrosis can occur because of the rapid decline in which factor with a short half-life (~6 hours)?", a: ["Factor II", "Protein C", "Factor X", "Factor IX"], c: 1, r: "Protein C has a shorter half-life (~6h) than procoagulant factors II/IX/X, creating a temporary prothrombotic state unless bridged with heparin." },
        { cat: 3, q: "Dabigatran etexilate is an oral anticoagulant operating via which specific molecular mechanism?", a: ["Direct Factor Xa inhibitor", "Direct Thrombin (Factor IIa) inhibitor", "Vitamin K antagonist", "ADP P2Y12 blocker"], c: 1, r: "Dabigatran is a competitive, reversible direct thrombin (IIa) inhibitor." },
        { cat: 3, q: "Rivaroxaban, Apixaban, and Edoxaban belong to which class of Direct Oral Anticoagulants (DOACs)?", a: ["Direct Thrombin inhibitors", "Direct Factor Xa inhibitors", "Phosphodiesterase-3 inhibitors", "Fibrinolytics"], c: 1, r: "Rivaroxaban, Apixaban, Edoxaban directly inhibit free and clot-associated Factor Xa." },
        { cat: 3, q: "Clopidogrel and Prasugrel are prodrugs that inhibit platelet activation by irreversibly blocking which receptor on the platelet surface?", a: ["GPIIb/IIIa receptor", "P2Y12 ADP receptor", "Thromboxane A2 receptor", "PAR-1 thrombin receptor"], c: 1, r: "Clopidogrel and Prasugrel active metabolites irreversibly block the P2Y12 purinergic ADP receptor, preventing GP IIb/IIIa activation." },
        { cat: 3, q: "Aspirin achieves antiplatelet effects at low doses (75–81 mg/day) by irreversibly inhibiting which enzyme?", a: ["Cyclooxygenase-1 (COX-1)", "Lipoxygenase (LOX)", "Phosphodiesterase-5", "Thromboxane synthase alone"], c: 0, r: "Low-dose aspirin acetylates COX-1 in platelets, permanently blocking Thromboxane A2 synthesis for the platelet lifespan." },
        { cat: 3, q: "Which class of antiplatelet agents (e.g., Abciximab, Eptifibatide, Tirofiban) blocks the final common pathway of platelet aggregation?", a: ["P2Y12 antagonists", "Glycoprotein IIb/IIIa inhibitors", "PDE-3 inhibitors", "Thrombin receptor antagonists"], c: 1, r: "GPIIb/IIIa inhibitors block fibrinogen binding across platelets, inhibiting aggregation regardless of initiating stimulus." },
        { cat: 3, q: "Alteplase (tPA), Reteplase, and Tenecteplase induce fibrinolysis during acute ischemic stroke or STEMI by converting:", a: ["Prothrombin to thrombin", "Plasminogen to active plasmin", "Fibrinogen to fibrin", "Kallikrein to bradykinin"], c: 1, r: "Thrombolytics convert fibrin-bound plasminogen into plasmin, which degrades fibrin clots." },
        { cat: 3, q: "Reversal of unfractionated heparin (UFH) toxicity in life-threatening bleeding is achieved by slow IV administration of:", a: ["Vitamin K1 (Phytonadione)", "Protamine sulfate", "Idarucizumab", "Andexanet alfa"], c: 1, r: "Protamine sulfate is a positively charged peptide that neutralizes negatively charged heparin." },
        { cat: 3, q: "Specific reversal agent for Direct Factor Xa inhibitors (Apixaban, Rivaroxaban) in severe bleeding is:", a: ["Idarucizumab", "Andexanet alfa", "Protamine sulfate", "Aminocaproic acid"], c: 1, r: "Andexanet alfa is a recombinant decoy Factor Xa protein that binds and neutralizes Factor Xa inhibitors." },
        { cat: 3, q: "Idarucizumab is a humanized monoclonal antibody fragment engineered specifically for rapid reversal of which drug?", a: ["Rivaroxaban", "Dabigatran", "Warfarin", "Fondaparinux"], c: 1, r: "Idarucizumab binds free and thrombin-bound Dabigatran with high affinity." },
        { cat: 3, q: "Parenteral iron therapy (e.g., Ferric carboxymaltose, Iron dextran) carries a risk of acute adverse systemic reactions characterized by chest tightness, hypotension, and dyspnea, known as:", a: ["Jarisch-Herxheimer reaction", "Fishbane / Hypersensitivity reaction", "Red man syndrome", "Serum sickness"], c: 1, r: "Rapid IV iron infusion can induce non-IgE mediated labile iron hypersensitivity reactions (Fishbane reactions)." },
        { cat: 3, q: "In a patient presenting with acute ST-elevation myocardial infarction (STEMI) presenting within 2 hours of symptom onset where primary PCI is unavailable, emergency therapy consists of:", a: ["Oral Warfarin loading dose", "Intravenous fibrinolytic therapy (e.g., Alteplase) plus dual antiplatelet therapy", "High-dose IV Prothrombin Complex Concentrate", "Subcutaneous Fondaparinux monotherapy"], c: 1, r: "When primary PCI cannot be performed within 120 minutes, immediate fibrinolysis (tPA) with DAPT (Aspirin + P2Y12 inhibitor) is standard of care." }
    ];

    const pastExamPool = [
        { cat: 2, q: "A 58-year-old male with a 15-year history of chronic alcohol abuse and liver cirrhosis presents for pre-operative evaluation prior to an elective hernia repair. Laboratory analysis demonstrates a prolonged Prothrombin Time (PT) with a normal Activated Partial Thromboplastin Time (aPTT). Which of the following best explains why PT is the earliest coagulation parameter to become abnormal in severe hepatic dysfunction?", a: ["Factor VIII has the shortest half-life of all liver-synthesized clotting factors.", "Factor VII has the shortest biological half-life (~6 hours) among vitamin K-dependent factors synthesized by hepatocytes.", "Fibrinogen synthesis is completely inhibited before any other clotting factor is affected.", "Hepatic kupffer cells fail to clear endogenous antithrombin III from circulation."], c: 1, r: "The liver synthesizes almost all coagulation factors. Factor VII (extrinsic pathway) has the shortest half-life of all clotting factors (~6 hours). In acute or progressive severe hepatic impairment, Factor VII levels drop first, making PT/INR the earliest indicator of liver synthetic failure." },
        { cat: 1, q: "A 52-year-old male with a history of hypertension and exertional angina undergoes an exercise stress electrocardiogram (ECG) test on a treadmill. Which of the following findings on the exercise ECG constitutes a positive result indicative of inducible myocardial ischemia?", a: ["Horizontal or downsloping ST-segment depression ≥ 1 mm measured 80 ms after the J-point during peak exercise.", "PR-segment prolongation > 200 ms with incremental heart rate elevation.", "Symmetrical T-wave inversion in lead V1 only.", "Increase in systolic blood pressure of 20 mmHg during exercise."], c: 0, r: "Inducible subendocardial ischemia during exercise stress manifests as horizontal or downsloping ST-segment depression ≥ 1 mm (0.1 mV) measured 80 ms after the J-point." },
        { cat: 3, q: "A 60-year-old female with hypercholesterolemia is prescribed Atorvastatin. Which mechanism of action accounts for the primary therapeutic effect of statins in reducing circulating Low-Density Lipoprotein Cholesterol (LDL-C)?", a: ["Inhibition of Niemann-Pick C1-Like 1 (NPC1L1) protein at the intestinal brush border.", "Competitive inhibition of hepatic HMG-CoA reductase, leading to intracellular cholesterol depletion and upregulation of hepatic LDL receptors.", "Activation of peroxisome proliferator-activated receptor alpha (PPAR-alpha), enhancing LPL expression.", "Binding and sequestration of bile acids in the intestinal lumen."], c: 1, r: "Statins competitively inhibit HMG-CoA reductase, the rate-limiting enzyme in hepatic cholesterol synthesis. The resulting drop in intracellular cholesterol signals hepatocytes to upregulate surface LDL receptors, clearing circulating LDL." },
        { cat: 1, q: "A 62-year-old male presents with severe retrosternal chest pain and diaphoresis. An ECG confirms a transmural ST-elevation myocardial infarction (STEMI). Electrocardiographic follow-up 6 weeks later shows persistent pathological Q waves in leads V1–V4. What do persistent pathological Q waves represent pathophysiologically?", a: ["Reversible myocardial stunning surrounding the ischemic zone.", "Acute ongoing subendocardial ischemia.", "Irreversible, full-thickness myocardial necrosis and replacement by non-conductive fibrotic scar tissue.", "Transient coronary artery vasospasm."], c: 2, r: "Pathological Q waves represent electrically silent, non-conductive necrotic or fibrotic tissue created by full-thickness (transmural) myocardial infarction. Once scar tissue forms, these Q waves are generally permanent." },
        { cat: 3, q: "A 65-year-old patient with atrial fibrillation with rapid ventricular response is started on Verapamil. Which electrophysiological effect of non-dihydropyridine calcium channel blockers explains their utility in controlling ventricular rate?", a: ["Blocking fast voltage-gated Na+ channels during Phase 0 in atrial myocytes.", "Prolonging Phase 0 depolarization and extending the absolute refractory period in the AV node by blocking L-type Ca2+ channels.", "Inhibiting Na+/K+ ATPase to increase intracellular sodium concentrations.", "Accelerating Phase 4 spontaneous diastolic depolarization in Purkinje fibers."], c: 1, r: "Verapamil and Diltiazem selectively block voltage-gated L-type calcium channels in nodal tissue. In the AV node, where Phase 0 is calcium-dependent, this action slows conduction velocity and prolongs refractoriness, controlling ventricular rate." },
        { cat: 2, q: "A 22-year-old female presents with painless cervical lymphadenopathy and a persistent non-productive cough. Chest X-ray reveals a large anterior mediastinal mass. Lymph node biopsy demonstrates collagen bands dividing the lymphoid architecture into distinct cellular nodules containing classic lacunar cells (Reed-Sternberg variant). What is the diagnosis?", a: ["Nodular sclerosis Hodgkin lymphoma", "Diffuse large B-cell lymphoma", "Burkitt lymphoma", "Chronic lymphocytic leukemia"], c: 0, r: "Nodular sclerosis is the most common subtype of Hodgkin Lymphoma, characterized by broad fibrous collagen bands circumscribing nodules and lacunar-type Reed-Sternberg cells." },
        { cat: 2, q: "A newborn infant presents with severe hemolytic anemia, muscular weakness, and loss of deep tendon reflexes. The child is found to have a fat malabsorption syndrome. A deficiency of which fat-soluble vitamin causes oxidative membrane damage to RBCs leading to hemolysis?", a: ["Vitamin A", "Vitamin D", "Vitamin E", "Vitamin K"], c: 2, r: "Vitamin E (alpha-tocopherol) functions as an antioxidant protecting red blood cell membranes from lipid peroxidation by free radicals. Deficiency leads to hemolytic anemia and spinocerebellar symptoms." },
        { cat: 1, q: "During which phase of the cardiac cycle do all four heart valves remain closed while intraventricular pressure increases rapidly without any change in ventricular volume?", a: ["Isovolumetric relaxation", "Isovolumetric (isometric) contraction", "Rapid ventricular ejection", "Reduced ventricular filling"], c: 1, r: "Isovolumetric contraction begins with AV valve closure (S1) and ends with semilunar valve opening. Ventricular volume is constant (EDV) while ventricular muscle contracts, causing a steep rise in pressure." },
        { cat: 1, q: "In a severe hemorrhagic shock patient whose Mean Arterial Pressure (MAP) drops below 60 mmHg, the central nervous system ischemic response is triggered. Which of the following characterizes this physiological emergency response?", a: ["Parasympathetic outflow from the vagus nerve causes severe vasodilation.", "Massive sympathetic discharge causes intense systemic peripheral vasoconstriction to preserve cerebral and coronary perfusion.", "Peripheral chemoreceptors undergo reflex inhibition.", "Baroreceptors increase their firing rate to depress the vasomotor center."], c: 1, r: "When severe hypotension occurs, accumulation of CO2 and lactic acid in the brainstem triggers the CNS ischemic response—the most powerful activator of the sympathetic vasoconstrictor system." },
        { cat: 3, q: "A 68-year-old patient with heart failure and diabetic nephropathy is started on Enalapril. Two weeks later, routine laboratory tests show an elevation in serum potassium from 4.2 mEq/L to 5.8 mEq/L. What mechanism underlies this adverse drug reaction?", a: ["Inhibition of the Na+/K+/2Cl- cotransporter in the thick ascending limb.", "Decreased Angiotensin II levels reduce adrenal aldosterone secretion, diminishing K+ excretion in the cortical collecting duct.", "Direct blockage of renal epithelial sodium channels (ENaC).", "Increased aldosterone responsiveness leading to intracellular K+ shift."], c: 1, r: "ACE inhibitors block Angiotensin II formation, decreasing adrenal aldosterone release. Lower aldosterone reduces distal renal K+ excretion, leading to potassium retention and hyperkalemia." },
        { cat: 1, q: "A 72-year-old male with chronic ischemic heart disease presents with worsening orthopnea and bilateral lower extremity edema. Serum testing reveals elevated Brain Natriuretic Peptide (BNP). What physiological stimulus triggers the release of BNP, and what is its primary effect?", a: ["Decreased atrial stretch; increases renal sodium reabsorption.", "Ventricular wall stretch due to volume or pressure overload; promotes renal natriuresis, diuresis, and systemic vasodilation.", "Sympathetic stimulation of Juxtaglomerular cells; promotes renin secretion.", "Hypoxia in renal cortical tissue; stimulates erythropoiesis."], c: 1, r: "BNP is synthesized and released by ventricular cardiomyocytes in response to increased wall tension. It counteracts RAAS by inducing natriuresis, diuresis, and systemic vasodilation." },
        { cat: 1, q: "During severe lactic acidosis in septic shock (arterial pH < 7.15), which direct effect does severe acidosis exert on cardiac performance?", a: ["Enhances myofilament sensitivity to intracellular calcium, increasing stroke volume.", "Depresses myocardial contractility and decreases vascular responsiveness to endogenous catecholamines.", "Shifts the oxygen-hemoglobin dissociation curve to the left.", "Accelerates conduction velocity through the AV node."], c: 1, r: "Severe systemic acidosis (pH < 7.20) directly impairs myocardial contractility by displacing calcium from troponin C and blunts vascular smooth muscle reactivity to catecholamines." },
        { cat: 2, q: "A 64-year-old male presents with weakness, tingling in his feet, and smooth glossy red tongue (atrophic glossitis). CBC shows Hb 7.8 g/dL, MCV 115 fL, WBC 3.1 x 10^9/L, and Platelets 110 x 10^9/L. Blood smear reveals hypersegmented neutrophils. Which diagnostic feature confirms Vitamin B12 deficiency megaloblastic anemia rather than a primary hematologic malignancy such as acute leukemia?", a: ["Marked elevation of blast cells (>20%) in bone marrow.", "Pancytopenia with erythroid hyperplasia containing megaloblasts and elevated serum methylmalonic acid (MMA).", "Presence of Auer rods in immature myeloid precursor cells.", "Clonal chromosomal translocations t(15;17)."], c: 1, r: "B12 deficiency impairs DNA synthesis, producing pancytopenia, hypersegmented neutrophils, megaloblastic erythroid hyperplasia, and raised MMA/homocysteine without malignant blasts." },
        { cat: 2, q: "In the sequence of primary and secondary hemostasis following vascular injury, what constitutes the structural foundation of the definitive stable hemostatic plug?", a: ["Isolated collagen fibril meshwork without cellular components.", "Aggregated platelets bound via GPIIb/IIIa receptors embedded within a cross-linked fibrin polymer scaffold.", "Von Willebrand factor (vWF) monomers cross-linked by Factor VIII.", "Monocyte-macrophage aggregates held together by fibronectin."], c: 1, r: "Primary hemostasis forms a platelet plug; secondary hemostasis generates thrombin to cleave fibrinogen into fibrin, which is cross-linked by Factor XIIIa around platelets into a definitive plug." },
        { cat: 3, q: "A 55-year-old patient receiving long-term antiarrhythmic therapy for ventricular ectopy presents with fever, malar rash, joint pain, and positive anti-histone antibodies. Which antiarrhythmic drug is most strongly associated with drug-induced lupus erythematosus?", a: ["Lidocaine", "Amiodarone", "Procainamide", "Verapamil"], c: 2, r: "Procainamide (Class Ia antiarrhythmic) causes drug-induced lupus erythematosus in up to 20-30% of chronic users, marked by positive anti-histone antibodies and arthralgias." },
        { cat: 3, q: "A patient taking high-dose Atorvastatin and Amiodarone develops nausea and jaundice. Routine lab panels reveal AST 450 U/L and ALT 520 U/L. What is the clinical significance of elevated transaminases in the context of lipid-lowering and antiarrhythmic pharmacology?", a: ["Drug-induced hepatotoxicity requiring immediate evaluation and discontinuation of offending agents.", "Expected benign physiological adaptation of peroxisomes.", "Indicator of skeletal muscle rhabdomyolysis without hepatic involvement.", "Rapid breakdown of intestinal chylomicrons."], c: 0, r: "Both statins and amiodarone undergo hepatic metabolism and can cause drug-induced liver injury (DILI). Elevated AST/ALT (>3x ULN) warrants drug dose adjustment or discontinuation." },
        { cat: 0, q: "During clinical cardiovascular examination, where is the apex beat (point of maximal impulse, PMI) normally palpated, and which cardiac chamber forms it?", a: ["2nd right intercostal space; Right Atrium", "4th left intercostal space at parasternal line; Right Ventricle", "5th left intercostal space in midclavicular line; Left Ventricle", "5th left intercostal space at midaxillary line; Left Atrium"], c: 2, r: "The apex of the heart is located in the 5th left intercostal space in the midclavicular line (8–9 cm from the midsternal line) and is formed entirely by the left ventricle." },
        { cat: 1, q: "When evaluating left ventricular myocardial perfusion, why does the vast majority of left coronary artery blood flow occur during cardiac diastole rather than systole?", a: ["Aortic pressure is highest during diastole.", "Severe extravascular compression by contracting myocardium during systole increases coronary vascular resistance in intramyocardial vessels.", "The aortic valve leaflets cover the coronary ostia during diastole.", "Coronary sinus pressure drops to negative values during systole."], c: 1, r: "During systole, high intramyocardial wall tension compresses intramural coronary vessels, markedly elevating resistance. During diastole, relaxation relieves compression, permitting peak perfusion." },
        { cat: 2, q: "A fasting lipid panel reveals Total Cholesterol 240 mg/dL, Triglycerides 150 mg/dL, and HDL 50 mg/dL. Using the Friedewald equation, what is the calculated LDL-C value?", a: ["160 mg/dL", "190 mg/dL", "140 mg/dL", "120 mg/dL"], c: 0, r: "Friedewald equation: LDL-C = Total Cholesterol - HDL-C - (Triglycerides / 5). LDL = 240 - 50 - (150 / 5) = 190 - 30 = 160 mg/dL." },
        { cat: 0, q: "In fetal circulation, what is the physiological role of the ductus arteriosus, and what substance maintains its patency in utero?", a: ["Shunts oxygenated blood from umbilical vein to IVC; maintained by oxygen.", "Shunts blood from pulmonary artery to descending aorta, bypassing non-functional lungs; maintained by PGE2.", "Connects left and right atria; maintained by indomethacin.", "Connects SVC directly to left ventricle; maintained by bradykinin."], c: 1, r: "The ductus arteriosus connects pulmonary trunk to descending aorta, shunting blood away from fluid-filled lungs. Patency is actively maintained by low fetal PaO2 and circulating Prostaglandin E2 (PGE2)." },
        { cat: 1, q: "On an aortic pressure tracing, what cardiac event directly produces the dicrotic notch (incisura)?", a: ["Opening of the mitral valve at the start of filling.", "Sudden closure of the aortic valve accompanied by a brief backflow of blood against the closed valve leaflets.", "Peak ventricular ejection pressure.", "Contraction of the left atrium."], c: 1, r: "The dicrotic notch on the aortic pressure tracing marks the closure of the aortic valve at the end of ventricular ejection." },
        { cat: 2, q: "Which blood group is designated as the \"universal donor\" for packed red blood cell (RBC) transfusions, and why?", a: ["AB positive; because its red cells express A, B, and Rh antigens.", "O negative; because its RBCs lack A, B, and Rh (D) surface antigens, preventing recipient anti-A, anti-B, or anti-D antibody-mediated hemolysis.", "O positive; because it contains anti-A and anti-B antibodies in plasma.", "AB negative; because plasma contains no ABO antibodies."], c: 1, r: "Group O Negative red blood cells express neither A nor B oligosaccharides nor Rh(D) protein antigen on their surface, preventing recipient antibody-mediated hemolysis." },
        { cat: 2, q: "A 30-year-old traveler returning from a tropical region presents with fever, abdominal pain, and marked peripheral leukocytosis with 22% eosinophils. Which primary mechanism accounts for eosinophil-mediated destruction of helminthic parasites?", a: ["Phagocytosis and intralysosomal destruction by myeloperoxidase.", "Antibody-dependent cellular cytotoxicity (ADCC) releasing Major Basic Protein (MBP) and Eosinophil Cationic Protein (ECP).", "Secretion of IgA antibodies into the intestinal lumen.", "Release of histamine and heparin granules causing local vasoconstriction."], c: 1, r: "Eosinophils bind antibody-coated parasites via Fc receptors and release cytotoxic granule contents—principally Major Basic Protein (MBP) and Eosinophil Cationic Protein (ECP)." },
        { cat: 2, q: "In cancer immunology, how do Tumor-Specific Antigens (TSAs) differ fundamentally from Tumor-Associated Antigens (TAAs)?", a: ["TSAs are expressed exclusively on tumor cells and not on normal non-malignant tissues.", "TAAs are unique neoantigens caused by somatic frame-shift mutations.", "TSAs are expressed at high levels on fetal tissue only.", "TAAs are recognized only by NK cells."], c: 0, r: "Tumor-Specific Antigens (TSAs) are neoantigens expressed exclusively on malignant cells. Tumor-Associated Antigens (TAAs) are expressed on tumor cells but also present in low amounts on normal tissues." },
        { cat: 0, q: "In fetal circulation, which vascular shunt directs highly oxygenated blood from the umbilical vein directly into the Inferior Vena Cava (IVC), bypassing the hepatic microcirculation?", a: ["Ductus arteriosus", "Ductus venosus", "Foramen ovale", "Umbilical artery"], c: 1, r: "The ductus venosus connects the umbilical vein directly to the IVC, allowing oxygenated placental blood to bypass the liver sinusoids and reach the heart directly." },
        { cat: 2, q: "Which of the following plasma lipoproteins is LEAST directly affected by the catalytic hydrolytic activity of Lipoprotein Lipase (LPL)?", a: ["Chylomicrons", "Very Low-Density Lipoproteins (VLDL)", "Low-Density Lipoproteins (LDL)", "Chylomicron remnants"], c: 2, r: "LPL hydrolyzes triglyceride-rich lipoproteins (chylomicrons and VLDL). LDL is a cholesterol-rich particle cleared primarily via hepatic LDL receptors, not direct LPL hydrolysis." },
        { cat: 3, q: "A 60-year-old male develops sustained ventricular tachycardia 12 hours after an acute anterior myocardial infarction. Lidocaine is administered IV. Which electrophysiological property makes Lidocaine selectively effective in ischemic ventricular tissue?", a: ["High affinity for open and inactivated voltage-gated Na+ channels in depolarized/ischemic myocardium with rapid unbinding during diastole.", "Prolongation of the action potential duration in normal atrial myocardium.", "Blockade of L-type calcium channels in the AV node.", "Direct inhibition of beta-1 adrenergic receptors."], c: 0, r: "Lidocaine (Class Ib) binds rapidly to open and inactivated fast Na+ channels in depolarized/ischemic tissue, unbinding quickly in normal tissue, effectively suppressing post-MI ventricular arrhythmias." },
        { cat: 0, q: "Histological examination of the Inferior Vena Cava demonstrates a well-developed wall. Which layer contains prominent longitudinal bundles of smooth muscle fibers, characteristic of large vena cava-class veins?", a: ["Tunica intima", "Tunica media", "Tunica adventitia", "Internal elastic lamina"], c: 2, r: "Large veins (SVC/IVC) possess a relatively thin tunica media and a very thick, prominent tunica adventitia containing longitudinally arranged bundles of smooth muscle cells." },
        { cat: 0, q: "During thoracic dissection, the diaphragm is inspected. Structurally, the muscular portion of the diaphragm consists of peripheral skeletal muscle bundles that converge into which central structure?", a: ["Septum transversum", "Central tendon", "Median arcuate ligament", "Crus of the diaphragm"], c: 1, r: "The muscular components of the diaphragm originate circumferentially and insert into an aponeurotic central tendon." },
        { cat: 0, q: "During embryological development of the diaphragm, which mesodermal structure forms the central tendon of the diaphragm?", a: ["Pleuroperitoneal membranes", "Septum transversum", "Dorsal mesentery of the esophagus", "Paraxial mesoderm of body wall"], c: 1, r: "The septum transversum gives rise to the central tendon of the adult diaphragm." },
        { cat: 0, q: "In embryonic diaphragm development, which component gives rise to the muscular crura of the adult diaphragm?", a: ["Septum transversum", "Pleuroperitoneal folds", "Dorsal mesentery of the esophagus", "Cervical myotomes C3-C5"], c: 2, r: "The dorsal mesentery of the esophagus forms the median portion of the diaphragm and develops into the right and left muscular crura." },
        { cat: 0, q: "A thoracic surgeon performs procedures in the posterior mediastinum. Which anatomical path correctly describes the thoracic duct as it ascends through the thorax?", a: ["Passes through the caval opening at T8, ascending anterior to the esophagus.", "Originates from cisterna chyli, enters thorax via aortic hiatus at T12, ascends between thoracic aorta and azygos vein, crosses to left at T4-T5, and drains into junction of left internal jugular and subclavian veins.", "Enters via esophageal hiatus at T10, draining into right lymphatic duct.", "Ascends along anterior sternal border to enter right subclavian vein."], c: 1, r: "The thoracic duct enters via the aortic hiatus (T12), ascends between the aorta and azygos vein, crosses left at T4-T5, and drains into the left venous angle (IJV and subclavian junction)." },
        { cat: 0, q: "The anterior intercostal arteries supplying the upper six intercostal spaces arise directly as branch vessels from which artery?", a: ["Thoracic aorta", "Musculophrenic artery", "Internal thoracic (internal mammary) artery", "Superior epigastric artery"], c: 2, r: "The internal thoracic artery descends lateral to the sternum, directly branching into anterior intercostal arteries for the upper 6 intercostal spaces." },
        { cat: 1, q: "An ECG reveals acute ST-segment elevation in leads II, III, and aVF with reciprocal ST depression in lead I and aVL. Which coronary artery is occluded?", a: ["Left Anterior Descending (LAD) artery", "Right Coronary Artery (RCA)", "Left Circumflex (LCx) artery", "Left main coronary artery"], c: 1, r: "Leads II, III, and aVF view the inferior LV wall, supplied by the Right Coronary Artery (RCA) in dominant anatomy." },
        { cat: 0, q: "Occlusion of the Left Anterior Descending (LAD) coronary artery leads to myocardial infarction affecting which anatomical regions of the heart?", a: ["Inferior wall and posterior LV", "Anterior 2/3 of interventricular septum, anterior wall of left ventricle, and heart apex", "Right atrial wall and SA node", "Posterior interventricular septum only"], c: 1, r: "The LAD courses in the anterior interventricular groove, supplying the anterior LV wall, anterior two-thirds of the interventricular septum, and apex." },
        { cat: 0, q: "In the superior mediastinum, the left brachiocephalic vein courses anterior to major arterial branches. Which anatomical relation is correct regarding its position?", a: ["It passes behind the ascending aorta.", "It runs obliquely from left to right, crossing anterior to the three major branches of the aortic arch (brachiocephalic trunk, left common carotid, left subclavian) to join the right brachiocephalic vein forming the SVC.", "It lies posterior to the trachea.", "It drains directly into the left atrium."], c: 1, r: "The left brachiocephalic vein runs obliquely across the superior mediastinum anterior to the roots of the three aortic arch branches, joining the right brachiocephalic vein to form the SVC." },
        { cat: 2, q: "A 32-year-old female with a history of three consecutive early pregnancy losses presents with a deep vein thrombosis (DVT) in her left lower extremity. Laboratory evaluation shows a prolonged aPTT that fails to correct upon 1:1 mixing study with normal pooled plasma. Serology is positive for Anti-beta-2-glycoprotein I IgG. What is the diagnosis?", a: ["Hemophilia A", "Antiphospholipid Syndrome (APS)", "Von Willebrand Disease", "Factor V Leiden mutation"], c: 1, r: "Antiphospholipid Syndrome (APS) presents with venous/arterial thromboses, pregnancy loss, and lupus anticoagulant/anticardiolipin/anti-beta-2-glycoprotein antibodies causing in vitro aPTT prolongation." },
        { cat: 3, q: "An 18-year-old competitive athlete collapses during basketball practice and dies suddenly. Post-mortem examination shows disproportionate asymmetric hypertrophy of the interventricular septum with myofiber disarray and interstitial fibrosis. What is the diagnosis?", a: ["Dilated cardiomyopathy", "Hypertrophic Obstructive Cardiomyopathy (HOCM)", "Restrictive cardiomyopathy", "Acute viral myocarditis"], c: 1, r: "HOCM is a leading cause of sudden cardiac death in young athletes, characterized by asymmetric septal hypertrophy, chaotic myofiber disarray, and interstitial fibrosis." },
        { cat: 3, q: "Genetic analysis of patients with Hypertrophic Obstructive Cardiomyopathy (HOCM) most commonly identifies autosomal dominant mutations encoding which class of cellular proteins?", a: ["Sarcomeric contractile proteins (e.g., MYH7 encoding beta-myosin heavy chain and MYBPC3 encoding myosin-binding protein C)", "Lysosomal storage enzymes", "Mitochondrial electron transport chain complexes", "Desmosomal cell junction proteins"], c: 0, r: "HOCM is an autosomal dominant disorder caused by mutations in sarcomeric contractile genes, primarily MYH7 (beta-myosin heavy chain) and MYBPC3 (cardiac myosin-binding protein C)." },
        { cat: 3, q: "A 48-year-old male presents with chronic recurrent sinusitis, saddle nose deformity, hemoptysis with bilateral cavitary pulmonary nodules on chest CT, and red cell casts in urine (glomerulonephritis). Serum immunofluorescence is positive for PR3-ANCA (c-ANCA). What is the diagnosis?", a: ["Microscopic Polyangiitis (MPA)", "Granulomatosis with Polyangiitis (Wegener's Granulomatosis)", "Eosinophilic Granulomatosis with Polyangiitis (Churg-Strauss)", "Polyarteritis Nodosa (PAN)"], c: 1, r: "Granulomatosis with Polyangiitis (GPA) is characterized by necrotizing granulomas of the upper/lower respiratory tracts, crescentic glomerulonephritis, and PR3-ANCA / c-ANCA positivity." },
        { cat: 2, q: "A patient with an acute localized tissue infection exhibits massive recruitment of circulating white blood cells. Monocytes migrate into the tissue matrix and differentiate into macrophages. Which of the following functions is performed by macrophages?", a: ["Secretion of IgE immunoglobulins.", "Phagocytosis of cellular debris/pathogens, antigen presentation on MHC class II molecules, and secretion of pro-inflammatory cytokines (TNF-alpha, IL-1, IL-6).", "Production of major basic protein to kill helminths.", "Synthesis of factor VIII for coagulation."], c: 1, r: "Macrophages are professional antigen-presenting cells (MHC II) that clear debris through phagocytosis and release cytokines such as TNF-alpha, IL-1, and IL-6." },
        { cat: 2, q: "Prostacyclin (PGI2), synthesized by intact vascular endothelial cells from arachidonic acid, plays a vital role in maintaining vascular patency. What are its dual physiological actions on blood vessels and platelets?", a: ["Vasoconstriction and promotion of platelet aggregation.", "Potent vasodilation and inhibition of platelet aggregation (via intracellular cAMP elevation).", "Local bronchoconstriction and neutrophil chemotaxis.", "Increased systemic vascular resistance and activation of GPIIb/IIIa."], c: 1, r: "Endothelial prostacyclin (PGI2) increases cAMP, causing vasodilation and preventing platelet aggregation, balancing platelet-derived Thromboxane A2." },
        { cat: 1, q: "A 22-year-old male with Wolff-Parkinson-White (WPW) syndrome experiences episodes of sudden-onset rapid palpitations. Which electrophysiological mechanism causes Atrioventricular Re-entrant Tachycardia (AVRT) in this patient?", a: ["Abnormal automaticity originating in pulmonary vein sleeves.", "Re-entry circuit involving anterograde conduction through the AV node and retrograde conduction through a congenital accessory pathway (Bundle of Kent).", "Delayed afterdepolarizations induced by digoxin toxicity.", "Sinus node dysfunction."], c: 1, r: "WPW involves an accessory pathway (Bundle of Kent). In orthodromic AVRT, the impulse conducts down the AV node and circles retrogradely up the accessory pathway." },
        { cat: 1, q: "A 30-year-old female presents to the emergency department with a sudden onset of narrow-complex tachycardia at a rate of 190 bpm. Retrograde P waves are buried within the QRS complex (pseudo-R' in lead V1). Carotid sinus massage terminates the arrhythmia abruptly. What is the mechanism of this arrhythmia?", a: ["Atrioventricular Nodal Re-entrant Tachycardia (AVNRT) involving dual pathways (slow and fast) within the AV node.", "Atrial flutter with 2:1 block.", "Ventricular tachycardia originating in the LV apex.", "Sinus tachycardia driven by high sympathetic tone."], c: 0, r: "AVNRT relies on dual pathways (slow and fast) within the AV node. Vagal maneuvers increase vagal tone to the AV node, terminating the re-entrant circuit." },
        { cat: 1, q: "According to fluid dynamics and the principle of continuity (Q = A x v), in which segment of the systemic circulation is blood flow velocity the HIGHEST?", a: ["Capillaries", "Arterioles", "Ascending Aorta", "Inferior Vena Cava"], c: 2, r: "Velocity is inversely proportional to total cross-sectional area. The ascending aorta has the smallest total cross-sectional area of the arterial tree, resulting in peak linear flow velocity." },
        { cat: 3, q: "A 68-year-old female presents with a 4-week history of low-grade fever, night sweats, weight loss, and general malaise. Extensive workup yields no localized infection, leading to a preliminary diagnosis of Pyrexia of Unknown Origin (PUO). ESR is elevated at 110 mm/hr. Which class of vascular diseases frequently manifests as PUO before focal ischemic symptoms develop?", a: ["Large vessel vasculitides (e.g., Giant Cell Arteritis / Takayasu Arteritis)", "Capillary hemangiomas", "Monogenic hyperlipidemia", "Venous insufficiency"], c: 0, r: "Large vessel vasculitides routinely present with non-specific constitutional features (fever of unknown origin, elevated ESR, weight loss) before localized ischemic signs appear." },
        { cat: 3, q: "A 42-year-old male with a long history of severe asthma and allergic rhinitis presents with peripheral neuropathy (glove-and-stocking numbness) and palpable purpura. Laboratory testing shows marked eosinophilia (35% WBCs) and positive p-ANCA (anti-MPO). Biopsy demonstrates necrotizing small-vessel vasculitis with extravascular granulomas. What is the diagnosis?", a: ["Granulomatosis with Polyangiitis (Wegener)", "Eosinophilic Granulomatosis with Polyangiitis (Churg-Strauss syndrome)", "Henoch-Schönlein Purpura", "Kawasaki disease"], c: 1, r: "Eosinophilic Granulomatosis with Polyangiitis (EGPA) features the triad of asthma, marked peripheral eosinophilia, necrotizing vasculitis with granulomas, and p-ANCA / MPO antibodies." },
        { cat: 3, q: "A 7-year-old boy presents 10 days after a viral upper respiratory infection with palpable purpura over his buttocks and lower extremities, colicky abdominal pain, and microscopic hematuria. Platelet count is normal. Biopsy reveals leukocytoclastic vasculitis with IgA immune complex deposition. What is the typical clinical course for this vasculitis?", a: ["Universal progression to end-stage renal disease within 6 months.", "Excellent prognosis with self-limiting disease requiring supportive care in most pediatric patients.", "Fatal coronary artery aneurysms if untreated with IVIG.", "Lifelong requirement for plasmapheresis."], c: 1, r: "Henoch-Schönlein Purpura (IgA Vasculitis) in children generally carries an excellent prognosis, resolving spontaneously with supportive care over several weeks." },
        { cat: 1, q: "On a standard Pressure-Volume (PV) loop diagram, which specific point on the loop corresponds to the opening of the aortic valve and the start of ventricular ejection?", a: ["Bottom-right corner (End-Diastolic Volume point)", "Bottom-left corner (End-Systolic Volume point)", "Point along the left vertical line where pressure exceeds aortic diastolic pressure", "Point along the right vertical line where intraventricular pressure exceeds aortic diastolic pressure"], c: 3, r: "During isovolumetric contraction (right vertical line), LV pressure rises until it exceeds aortic diastolic pressure; at that moment, the aortic valve opens and ejection begins." },
        { cat: 1, q: "How do systemic arterioles and pulmonary arterioles respond differently to acute tissue hypoxia?", a: ["Systemic arterioles constrict; pulmonary arterioles dilate.", "Systemic arterioles dilate (to increase blood flow); pulmonary arterioles constrict (Hypoxic Pulmonary Vasoconstriction to divert blood to ventilated alveoli).", "Both systemic and pulmonary arterioles dilate equally.", "Both systemic and pulmonary arterioles undergo irreversible thrombosis."], c: 1, r: "Systemic arterioles dilate to match local tissue metabolic demand during hypoxia, while pulmonary vessels undergo hypoxic vasoconstriction to shunt blood toward well-ventilated alveoli." },
        { cat: 2, q: "What is the physiological role of plasminogen in the fibrinolytic pathway?", a: ["Inactive zymogen that binds to fibrin clots and is cleaved by tPA into active plasmin, which degrades cross-linked fibrin into D-dimers.", "Factor that stabilizes fibrin monomers into insoluble polymers.", "Endothelial enzyme that converts arachidonic acid to TXA2.", "Platelet membrane receptor for vWF."], c: 0, r: "Plasminogen binds to fibrin and is cleaved by tPA into active plasmin, an enzyme that degrades fibrin clots into degradation products including D-dimers." },
        { cat: 3, q: "What is the exact cellular mechanism of action of Clopidogrel as an antiplatelet agent?", a: ["Reversible inhibition of COX-1 enzyme.", "Irreversible binding and blockade of the P2Y12 ADP receptor on platelets, preventing ADP-induced activation of GPIIb/IIIa complex.", "Direct inhibition of thrombin (Factor IIa).", "Phosphodiesterase-3 inhibition causing cAMP elevation."], c: 1, r: "Clopidogrel is an oral thienopyridine prodrug whose active metabolite irreversibly blocks platelet P2Y12 ADP receptors, preventing downstream activation of GPIIb/IIIa." },
        { cat: 2, q: "A newborn develops severe purpura fulminans characterized by extensive cutaneous microvascular thrombosis and hemorrhagic skin necrosis shortly after birth. Genetic testing reveals homozygous deficiency of Protein C. What is the physiological function of activated Protein C?", a: ["Inactivation of Factors Va and VIIIa in the presence of cofactor Protein S.", "Direct activation of Factor X to Xa.", "Cleavage of prothrombin to thrombin.", "Blockade of antithrombin III."], c: 0, r: "Activated Protein C, together with Protein S, proteolytically degrades activated Factors Va and VIIIa, acting as an essential endogenous anticoagulant mechanism." },
        { cat: 2, q: "An Rh-negative mother delivers her second child, an Rh-positive infant, who presents with severe jaundice, anemia, hepatosplenomegaly, and hydrops fetalis. What immunological mechanism causes Hemolytic Disease of the Newborn (HDN)?", a: ["Maternal IgM antibodies crossing placenta to attack fetal RBCs.", "Maternal IgG anti-D antibodies (formed during prior Rh+ pregnancy sensitization) crossing the placenta and causing immune-mediated intravascular/extravascular hemolysis of fetal Rh-positive RBCs.", "Direct viral destruction of fetal bone marrow stem cells.", "ABO mismatch causing complement-mediated fetal erythrocyte lysis."], c: 1, r: "Sensitization during a previous pregnancy generates maternal IgG anti-D antibodies that cross the placenta to bind and destroy Rh(D)-positive fetal erythrocytes." },

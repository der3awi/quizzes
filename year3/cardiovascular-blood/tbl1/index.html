    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #f43f5e; /* Crimson/Rose theme for Cardiovascular & Blood */
            --success: #10b981;
            --danger: #f43f5e;
            --flag: #f59e0b;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }

        .nav-header { padding: 1rem 2rem; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo { font-weight: 800; letter-spacing: 0.1em; font-size: 0.85rem; display: flex; align-items: center; gap: 12px; color: #fff; }
        .pulse { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .app-grid { display: grid; grid-template-columns: 340px 1fr; flex: 1; overflow: hidden; }

        .sidebar { background: rgba(15, 23, 42, 0.4); border-right: 1px solid var(--border); padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
        .chart-wrapper { height: 220px; width: 100%; position: relative; }
        
        .label-id { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; font-weight: 800; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block; }
        .matrix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
        .node { aspect-ratio: 1; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 600; cursor: pointer; color: var(--text-dim); position: relative; transition: all 0.2s; }
        .node.active { border-color: var(--accent); background: rgba(244, 63, 94, 0.12); color: white; }
        .node.correct { border-color: var(--success); color: var(--success); }
        .node.wrong { border-color: var(--danger); color: var(--danger); }
        .node.flagged::before { content: ''; position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; background: var(--flag); border-radius: 50%; border: 2px solid var(--bg); }

        .stage { padding: 2rem 3rem; display: flex; justify-content: center; overflow-y: auto; }
        .content-wrap { max-width: 800px; width: 100%; }

        .proc-header { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-size: 0.75rem; margin-bottom: 1rem; opacity: 0.8; }
        .q-text { font-size: 1.25rem; font-weight: 700; line-height: 1.5; margin-bottom: 2rem; color: #fff; }

        .options { display: grid; gap: 0.85rem; }
        .opt-item { background: var(--panel); border: 1px solid var(--border); padding: 1.15rem 1.5rem; border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 1.25rem; font-size: 0.98rem; font-weight: 500; transition: 0.2s; }
        .opt-item:hover { border-color: var(--accent); transform: translateX(6px); }
        .opt-item.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .opt-item.wrong { border-color: var(--danger); background: rgba(244, 63, 94, 0.1); color: var(--danger); }
        .opt-index { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; opacity: 0.4; flex-shrink: 0; }

        .rationale { margin-top: 2rem; padding: 1.5rem; background: rgba(30, 41, 59, 0.6); border-left: 4px solid var(--accent); border-radius: 10px; display: none; line-height: 1.6; color: var(--text-dim); font-size: 0.92rem; }

        .action-row { margin-top: 2.5rem; display: flex; gap: 1rem; }
        .btn-ui { padding: 0.9rem 1.75rem; border-radius: 10px; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; border: none; transition: 0.2s; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.05); }
        .btn-next { background: var(--accent); color: #fff; flex: 1; box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3); }
        .btn-next:hover { opacity: 0.95; }
        
        .hub-link { color: var(--text-dim); text-decoration: none; font-size: 0.7rem; font-weight: 700; transition: 0.2s; }
        .hub-link:hover { color: var(--accent); }

<script>
    // Categories: 
    // 0: Anatomy & Procedures (Q1 - Q5)
    // 1: Hematology & RBCs (Q6 - Q10, Q26, Q28, Q30)
    // 2: Hemostasis & Thrombosis (Q11 - Q16, Q27, Q29)
    // 3: Neoplasia & Infection (Q17 - Q25)
    const fullPool = [
        // Q01
        { cat: 0, q: "A 48-year-old female with a history of untreated rheumatic fever presents with worsening dyspnea, progressive difficulty swallowing solid food, and persistent voice hoarseness over the past several months[cite: 1]. Laryngoscopy reveals paralysis of the left vocal cord, and imaging shows an enlarged heart chamber compressing the adjacent esophagus and left recurrent laryngeal nerve[cite: 1]. Which cardiac chamber forms this base and is most posteriorly situated[cite: 1]?", a: ["Right ventricle", "Left ventricle", "Left atrium", "Right atrium", "Superior vena cava"], c: 2, r: "The left atrium forms the base and is the most posterior part of the heart[cite: 1]. Enlargement of the left atrium (such as in mitral stenosis) can compress the esophagus (causing dysphagia) and the left recurrent laryngeal nerve (Ortner syndrome, causing hoarseness)[cite: 1]." },
        // Q02[cite: 1]
        { cat: 0, q: "A medical student is performing a cardiovascular physical examination on a healthy 20-year-old volunteer[cite: 1]. To assess the normal physiological closure of the mitral valve (component of S1) and the cardiac apex beat, where should the stethoscope diaphragm be placed on the thoracic wall[cite: 1]?", a: ["2nd intercostal space at the right sternal border", "2nd intercostal space at the left sternal border", "5th intercostal space at the lower left sternal border", "Left 5th intercostal space at the midclavicular line", "Subcostal space directly inferior to the xiphisternal joint"], c: 3, r: "The auscultation position for the mitral valve (and apex) is at the left 5th intercostal space at the midclavicular line (MCL)[cite: 1]. The 2nd right ICS is aortic, 2nd left ICS is pulmonary, and 5th left ICS at the lower sternal edge is tricuspid[cite: 1]." },
        // Q03[cite: 1]
        { cat: 0, q: "A 35-year-old male with acute purulent pericarditis develops acute hemodynamic collapse from cardiac tamponade[cite: 1]. An emergency blind subxiphoid pericardiocentesis is performed[cite: 1]. What is the standard anatomical entry site and needle angle recommended for this emergency approach to avoid entering the pleura[cite: 1]?", a: ["Left 5th intercostal space 1–2 cm lateral to the apex beat at 90 degrees", "Left 5th intercostal space directly adjacent to the sternum at 60 degrees", "1 cm inferior to the left xiphocostal angle angled at 30 to 45 degrees", "Directly through the middle third of the sternal body perpendicularly", "Right 2nd intercostal space at the midclavicular line at 45 degrees"], c: 2, r: "The traditional subxiphoid/subcostal approach is performed by inserting the needle ~1 cm inferior to the left xiphocostal (xiphichondral) angle at an angle of 30 to 45 degrees to the chest, pointing superoposteriorly to avoid pleural and lung injury[cite: 1]." },
        // Q04[cite: 1]
        { cat: 0, q: "A 69-year-old male presents with acute substernal chest pain[cite: 1]. Cardiac catheterization reveals complete thrombotic occlusion of the artery that runs in the posterior interventricular groove supplying the posterior 1/3 of the interventricular septum and the AV node[cite: 1]. In the majority of people (right-dominant circulation), from which parent vessel does this posterior interventricular artery (PDA) arise[cite: 1]?", a: ["Left anterior descending artery (LAD)", "Right coronary artery (RCA)", "Circumflex branch of left coronary artery", "Left marginal artery", "Internal thoracic artery"], c: 1, r: "The posterior interventricular branch (PDA) arises from the Right Coronary Artery (RCA) in right-dominant circulation, which is the most common pattern in humans[cite: 1]. The RCA also supplies the AV node in ~80% of individuals and the posterior 1/3 of the interventricular septum[cite: 1]." },
        // Q05[cite: 1]
        { cat: 0, q: "A 56-year-old male undergoes electrophysiological pacing and catheter ablation for a supraventricular arrhythmia[cite: 1]. The operator uses an anatomical triangle in the right atrium to locate the atrioventricular (AV) node[cite: 1]. Which three structures form the boundaries of the Triangle of Koch[cite: 1]?", a: ["Crista terminalis, fossa ovalis, and IVC orifice", "Tendon of Todaro, annulus of tricuspid valve, and opening of coronary sinus", "Sulcus terminalis, pectinate muscles, and SVC orifice", "Conus arteriosus, membranous septum, and pulmonary valve", "Interatrial septum, fossa ovalis, and Eustachian valve"], c: 1, r: "The Triangle of Koch is the key landmark for locating the AV node during pacing or ablation[cite: 1]. Its three boundaries are the opening of the coronary sinus, the Tendon of Todaro, and the annulus of the tricuspid valve[cite: 1]." },

        // Q06[cite: 1]
        { cat: 1, q: "A 24-year-old Mediterranean male presents for routine screening[cite: 1]. Complete blood count reveals: Hb 11.0 g/dL, RBC count 5.5 x 10^6/µL (elevated), MCV 70 fL (low), and RDW 12.5% (normal)[cite: 1]. Which diagnosis is best supported by this profile of a high RBC count and normal RDW alongside microcytosis[cite: 1]?", a: ["Iron deficiency anemia", "Anemia of chronic disease", "Thalassemia (alpha or beta trait)", "Megaloblastic anemia", "Lead poisoning"], c: 2, r: "Both alpha- and beta-thalassemia feature low MCV (70 fL) with elevated RBC counts (~5.5 x 10^6/µL) and normal RDW (12.5%)[cite: 1]. Iron deficiency anemia presents with low RBC count and elevated RDW (>15%)[cite: 1]." },
        // Q07[cite: 1]
        { cat: 1, q: "A 59-year-old female presents with persistent fatigue, smooth sore tongue, and lower extremity paresthesias[cite: 1]. A complete blood count reveals Hb 9.5 g/dL, MCV 112 fL, and an elevated RDW[cite: 1]. What classic morphological finding on the peripheral blood smear (PBS) confirms a megaloblastic etiology[cite: 1]?", a: ["Target cells with basophilic stippling", "Spherocytes lacking central pallor", "Hypersegmented neutrophils with 5 or more nuclear lobes", "Pelger-Huet anomaly with bilobed neutrophils", "Sickled crescent-shaped erythrocytes"], c: 2, r: "Hypersegmented neutrophils (5 or more nuclear lobes) on the peripheral blood smear are the diagnostic hallmark of megaloblastic macrocytic anemia (due to Vitamin B12 or folate deficiency)[cite: 1]." },
        // Q08[cite: 1]
        { cat: 1, q: "A 45-year-old female with long-standing rheumatoid arthritis develops anemia[cite: 1]. Lab studies show low serum iron, a normal or decreased Total Iron Binding Capacity (TIBC), and an elevated serum ferritin level[cite: 1]. Which condition is defined by this specific iron profile[cite: 1]?", a: ["Iron deficiency anemia", "Anemia of chronic disease", "Hemochromatosis (Iron overload)", "Thalassemia major", "Aplastic anemia"], c: 1, r: "Anemia of Chronic Disease exhibits decreased serum iron, normal or increased serum ferritin (acute phase reactant/inflammatory condition), and normal or decreased TIBC[cite: 1]." },
        // Q09[cite: 1]
        { cat: 1, q: "A 31-year-old male presents with recurrent episodes of dark-colored morning urine and is found to have hepatic vein thrombosis[cite: 1]. Flow cytometry confirms an acquired genetic defect in hematopoietic cells causing deficiency of CD59 (membrane inhibitor of reactive lysis), rendering erythrocytes vulnerable to complement-mediated attack[cite: 1]. What is the underlying disorder[cite: 1]?", a: ["Hereditary spherocytosis", "Hereditary elliptocytosis", "Paroxysmal nocturnal hemoglobinuria", "Sickle cell anemia", "Autoimmune hemolytic anemia"], c: 2, r: "Paroxysmal Nocturnal Hemoglobinuria (PNH) is the only hemolytic anemia caused by an acquired genetic defect—a mutation in the PIGA gene leading to deficiency in GPI-anchored proteins such as CD59, making cells susceptible to the membrane attack complex (MAC) of complement and predisposing to thrombosis[cite: 1]." },
        // Q10[cite: 1]
        { cat: 1, q: "A 26-year-old male from the Mediterranean region presents with jaundice and acute fatigue after taking an oxidative medication[cite: 1]. Genetic analysis reveals an X-linked recessive disorder that impairs the regeneration of reduced NADPH, leaving erythrocytes defenseless against oxidative damage and causing cellular lysis[cite: 1]. Which enzyme is deficient[cite: 1]?", a: ["Pyruvate kinase", "Glucose-6-phosphate dehydrogenase (G6PD)", "5-aminolevulinate synthase (ALAS2)", "Proerythroblast kinase", "Ferrochelatase"], c: 1, r: "G6PD deficiency is an inherited X-linked recessive hemolytic anemia common in Mediterranean and Middle Eastern populations[cite: 1]. G6PD is necessary to make NADPH to protect the RBC from oxidants; in its absence, the cell sustains oxidative damage and undergoes lysis[cite: 1]." },

        // Q11[cite: 1]
        { cat: 2, q: "A 10-year-old boy presents with hemarthrosis of the knee[cite: 1]. Blood testing reveals a prolonged activated partial thromboplastin time (aPTT) of 55 seconds (normal 26–33 seconds) with a completely normal prothrombin time (PT)[cite: 1]. Which set of clotting factors is evaluated by this intrinsic pathway test[cite: 1]?", a: ["Factors VII, X, V, and prothrombin only", "Factors XII, XI, IX, and VIII", "Factor VII and Tissue Factor only", "Factor XIII only", "Platelet aggregation glycoproteins only"], c: 1, r: "aPTT measures the integrity of the intrinsic system (Factors XII, XI, IX, and VIII) and the common pathway[cite: 1]. The extrinsic pathway (tested by PT) evaluates Factor VII, Tissue Factor, and the common pathway[cite: 1]." },
        // Q12[cite: 1]
        { cat: 2, q: "A 68-year-old male with deep vein thrombosis is placed on oral warfarin therapy[cite: 1]. His physician checks his prothrombin time (PT) and International Normalized Ratio (INR) to guide dosing[cite: 1]. Warfarin produces an anticoagulant effect by inhibiting the synthesis of which group of Vitamin K-dependent clotting factors[cite: 1]?", a: ["Factors XII, XI, IX, and VIII", "Factors II, VII, IX, and X", "Factors I, V, and XIII", "Tissue factor and Platelet Factor 4", "Factors VIII and vWF only"], c: 1, r: "The Vitamin K-dependent clotting factors affected by oral anticoagulants like warfarin are Factors II (prothrombin), VII, IX, and X (as well as regulatory proteins C and S)[cite: 1]." },
        // Q13[cite: 1]
        { cat: 2, q: "A 52-year-old hospitalized patient receives unfractionated heparin for acute pulmonary embolism[cite: 1]. Heparin binds antithrombin III to accelerate the inactivation of key clotting proteases[cite: 1]. Which laboratory coagulation test is routinely used to monitor the anticoagulant effect of unfractionated heparin[cite: 1]?", a: ["Prothrombin time (PT)", "Activated partial thromboplastin time (aPTT)", "Bleeding time (BT)", "Fibrinogen level alone", "Direct antiglobulin test"], c: 1, r: "Unfractionated heparin primarily affects factors within the intrinsic and common pathways (inactivating thrombin, Xa, IXa, XIa, XIIa)[cite: 1]. Therefore, therapy is monitored using the activated partial thromboplastin time (aPTT)[cite: 1]." },
        // Q14[cite: 1]
        { cat: 2, q: "A 64-year-old male with stable coronary artery disease takes daily low-dose aspirin for cardioprotection[cite: 1]. What is the molecular mechanism of action of aspirin in preventing thrombus formation[cite: 1]?", a: ["Reversible competitive inhibition of phosphodiesterase", "Irreversible inhibition of platelet cyclooxygenase-1 (COX-1)", "Direct blockade of the GP IIb/IIIa fibrinogen receptor", "Inactivation of thrombin (Factor IIa)", "Inhibition of ADP binding to purinergic receptors"], c: 1, r: "Aspirin achieves its antiplatelet effect by irreversibly inhibiting platelet cyclooxygenase-1 (COX-1), which blocks the conversion of arachidonic acid to thromboxane A2 (TXA2), a potent stimulator of platelet aggregation and vasoconstriction[cite: 1]." },
        // Q15[cite: 1]
        { cat: 2, q: "A 28-year-old male presents with recurrent deep vein thrombosis[cite: 1]. Testing reveals that his Factor V possesses a point mutation replacing glutamine with arginine at position 506 (Factor V Leiden), rendering it resistant to inactivation[cite: 1]. Under normal physiological conditions, which two proteins form the anticoagulant complex that cleaves and inactivates normal Factor Va and Factor VIIIa[cite: 1]?", a: ["Antithrombin III and Heparin", "Protein C and Protein S", "Tissue factor and Factor VIIa", "Plasmin and tPA", "Kallikrein and HMW kininogen"], c: 1, r: "Active Protein C together with its cofactor Protein S normally controls the proteolytic breakdown and inactivation of Factor Va and Factor VIIIa[cite: 1]." },
        // Q16[cite: 1]
        { cat: 2, q: "A 58-year-old male presents with persistent headaches, dizziness, pruritus, bleeding gums, and a ruddy facial complexion[cite: 1]. Physical examination demonstrates marked hepatosplenomegaly, and a CBC reveals an elevated hematocrit of 62%[cite: 1]. What is the standard first-line therapeutic management used to rapidly decrease blood volume and prevent thrombosis in this disorder[cite: 1]?", a: ["Total bone marrow irradiation", "Phlebotomy", "High-dose Vitamin B12 supplementation", "Oral iron replacement therapy", "Emergency splenectomy"], c: 1, r: "Polycythemia Rubra Vera presents with a high haematocrit (60% or more) and hyperviscosity[cite: 1]. First-line management is phlebotomy to quickly decrease blood volume, lower red cell mass, and prevent thrombosis[cite: 1]." },

        // Q17[cite: 1]
        { cat: 3, q: "A 3-year-old child presents with a sudden stormy onset of lethargy, pallor, petechial hemorrhages, and bone pain[cite: 1]. Peripheral blood smear demonstrates lymphoblasts with a high N:C ratio that stain positive for CD19, CD10, and TdT[cite: 1]. Which statement regarding the epidemiologic incidence of this leukemia is correct based on the lecture[cite: 1]?", a: ["It represents the most common adult leukemia, presenting typically over age 65", "It is the most common childhood cancer, with the peak incidence of B-ALL occurring at 3 years of age", "It originates primarily from T cells in over 85% of pediatric cases", "Peak incidence occurs exclusively in the neonatal period during the first week of life", "It is an acquired disorder that occurs almost exclusively in middle-aged men"], c: 1, r: "ALL is the most common childhood cancer[cite: 1]. Peak incidence of B-ALL is 3 years of age[cite: 1]. 85% of cases originate from B cells and 15% from T cells[cite: 1]." },
        // Q18[cite: 1]
        { cat: 3, q: "A hospital morbidity committee is reviewing missed leukemia diagnoses in an outpatient department[cite: 1]. The pathology lecturer highlights that low-grade indolent neoplasms can easily be overlooked early in their course due to non-specific B symptoms and neoplastic cells resembling normal mature lymphocytes[cite: 1]. Which malignancy was specifically highlighted as 'most likely to be missed clinically by busy doctors in a busy hospital'[cite: 1]?", a: ["Acute lymphoblastic leukemia (ALL)", "Chronic lymphocytic leukaemia / Mycosis fungoides", "Acute myelogenous leukemia (AML)", "Burkitt lymphoma", "Multiple myeloma"], c: 1, r: "Chronic lymphocytic leukaemia / Mycosis fungoides was specifically highlighted as the neoplasm most likely to be missed clinically in outpatient settings due to indolent progression and mature morphology[cite: 1]." },
        // Q19[cite: 1]
        { cat: 3, q: "A 23-year-old female presents with painless cervical lymphadenopathy and a mediastinal mass seen on chest radiograph[cite: 1]. Biopsy reveals bands of collagen dividing the node into circumscribed nodules containing lacunar variants of Reed-Sternberg cells that are CD15+ and CD30+[cite: 1]. Which subtype of Hodgkin lymphoma is this, and what is its associated clinical prognosis[cite: 1]?", a: ["Lymphocyte depleted; poor prognosis", "Nodular sclerosis; excellent prognosis", "Mixed cellularity; poor prognosis", "Lymphocyte predominance; poor prognosis", "Mycosis fungoides; rapidly fatal"], c: 1, r: "Nodular Sclerosis Hodgkin lymphoma features collagen bands, lacunar Reed-Sternberg cells, female and young adult predominance, mediastinal involvement, and carries an excellent prognosis[cite: 1]." },
        // Q20[cite: 1]
        { cat: 3, q: "A 60-year-old male presents with widespread peripheral lymphadenopathy involving multiple non-contiguous lymph node chains as well as extranodal disease in the stomach[cite: 1]. On the differential diagnosis, the pathologist distinguishes Hodgkin from Non-Hodgkin lymphoma[cite: 1]. Which feature is characteristic of Non-Hodgkin lymphoma compared to Hodgkin lymphoma[cite: 1]?", a: ["Orderly, contiguous spread along a single node chain", "Common involvement of Waldeyer's ring and mesenteric nodes", "Almost complete absence of extranodal involvement", "Presence of pathognomonic diagnostic Reed-Sternberg cells", "Rare involvement of multiple peripheral nodes"], c: 1, r: "Non-Hodgkin lymphoma characteristically exhibits non-contiguous spread, common involvement of Waldeyer's ring and mesenteric lymph nodes, and frequent extranodal disease (such as GI tract involvement)[cite: 1]." },
        // Q21[cite: 1]
        { cat: 3, q: "A 68-year-old male presents with severe bone pain and recurrent pulmonary infections[cite: 1]. Radiographs demonstrate numerous punched-out osteolytic bone lesions of the skull and ribs[cite: 1]. Laboratory evaluation reveals hypercalcemia and free light chains in the urine[cite: 1]. What are these urine light chains termed[cite: 1]?", a: ["Russell bodies", "Dutcher bodies", "Bence-Jones proteins", "M-components", "Cryoglobulins"], c: 2, r: "Free light chains synthesized in excess by neoplastic plasma cells pass through the glomerulus into the urine, where they are designated as Bence-Jones proteins[cite: 1]." },
        // Q22[cite: 1]
        { cat: 3, q: "A 52-year-old male with an underlying bicuspid aortic valve develops low-grade fever and fatigue several weeks after an extensive dental cleaning[cite: 1]. Blood cultures yield alpha-hemolytic Gram-positive cocci in chains[cite: 1]. Which organism from the oral microbiome is the classic cause of subacute bacterial endocarditis following dental procedures[cite: 1]?", a: ["Staphylococcus aureus", "Viridans streptococci", "Enterococcus faecalis", "Streptococcus gallolyticus", "Pseudomonas aeruginosa"], c: 1, r: "Viridans group streptococci are normal commensals of the oral cavity that enter the bloodstream during dental manipulation and colonize previously damaged or abnormal cardiac valves, leading to subacute infective endocarditis[cite: 1]." },
        // Q23[cite: 1]
        { cat: 3, q: "A hospitalized patient with an indwelling central venous catheter develops rigors and a temperature of 39.2°C[cite: 1]. Sepsis is suspected, and blood cultures are ordered before antimicrobial administration[cite: 1]. What is the recommended total blood volume for an adult blood culture draw to optimize diagnostic yield[cite: 1]?", a: ["2 to 5 mL total", "5 to 10 mL total", "40 to 60 mL total across at least two sets", "100 to 150 mL total", "1 mL per bottle only"], c: 2, r: "Guidelines specify drawing at least two distinct sets totaling 40–60 mL of blood in adults to maximize diagnostic yield and differentiate true bacteremia from skin contaminants[cite: 1]." },
        // Q24[cite: 1]
        { cat: 3, q: "Blood culture from a septic patient with a central line grows Gram-positive cocci in clusters[cite: 1]. The microbiologist performs a rapid chemical test using 3% hydrogen peroxide (H2O2) and observes vigorous oxygen bubbling[cite: 1]. A subsequent coagulase test produces a firm plasma clot[cite: 1]. Which pathogen has been identified[cite: 1]?", a: ["Streptococcus pneumoniae", "Staphylococcus aureus", "Coagulase-negative staphylococci (e.g. S. epidermidis)", "Enterococcus faecalis", "Streptococcus pyogenes"], c: 1, r: "Catalase positivity (bubbling with H2O2) differentiates Staphylococci from Streptococci[cite: 1]. Coagulase positivity (plasma clot formation) specifically identifies Staphylococcus aureus[cite: 1]." },
        // Q25[cite: 1]
        { cat: 3, q: "A 17-year-old patient with relapsed acute lymphoblastic leukemia (ALL) receives Chimeric Antigen Receptor (CAR) T-cell therapy[cite: 1]. According to the cancer immunotherapy lecture, which cell-surface antigen is targeted by this engineered therapy to treat ALL[cite: 1]?", a: ["HER-2/neu", "CD19", "CTLA-4", "VEGF", "PD-L1"], c: 1, r: "CAR T-cell therapies in B-ALL are engineered to target the pan-B-cell marker CD19, which is uniformly expressed on malignant B lymphoblasts[cite: 1]." },

        // Q26[cite: 1]
        { cat: 1, q: "A 30-year-old resident of a high-altitude mountain village is evaluated[cite: 1]. Laboratory testing reveals a physiological secondary absolute polycythemia with elevated circulating red blood cell mass[cite: 1]. Which physiological parameter provides the primary stimulus for kidney production of erythropoietin[cite: 1]?", a: ["Hyperglycemia", "Tissue hypoxia", "Hypocalcemia", "Elevated systemic blood pressure", "Dehydration"], c: 1, r: "Tissue hypoxia sensed by interstitial peritubular fibroblasts in the renal cortex is the primary physiological trigger that upregulates erythropoietin production[cite: 1]." },
        // Q27[cite: 1]
        { cat: 2, q: "A laboratory researcher studies the ultrastructure of human platelets[cite: 1]. She isolates platelet cytoplasmic granules and analyzes their contents[cite: 1]. Which substance is stored specifically within platelet dense granules rather than alpha-granules[cite: 1]?", a: ["Platelet-derived growth factor (PDGF)", "Fibrinogen and clotting factors", "Serotonin and ADP", "von Willebrand factor", "Fibronectin"], c: 2, r: "Dense granules store non-protein secondary messengers such as ADP, ATP, calcium, and serotonin[cite: 1]. Alpha-granules contain high molecular weight proteins such as fibrinogen, vWF, and PDGF[cite: 1]." },
        // Q28[cite: 1]
        { cat: 1, q: "An Rh-negative mother delivers an Rh-positive newborn[cite: 1]. Sensitization typically occurs during delivery when fetal red cells enter the maternal circulation, placing subsequent Rh-positive pregnancies at risk for hemolytic disease of the newborn[cite: 1]. What postpartum medical prophylaxis is administered to prevent active maternal antibody formation[cite: 1]?", a: ["Intravenous broad-spectrum penicillin", "Single dose of Rh immune globulin (anti-Rh antibodies)", "High-dose intramuscular vitamin K injection", "Oral ferrous sulfate supplementation", "Phototherapy applied to the mother"], c: 1, r: "Administering a single postpartum dose of Rh immune globulin (anti-D antibodies) binds and clears fetal Rh+ erythrocytes before the mother's immune system mounts an active humoral response[cite: 1]." },
        // Q29[cite: 1]
        { cat: 2, q: "During acute localized bacterial tissue inflammation, circulating neutrophils are recruited from the bloodstream[cite: 1]. They lie along the capillary endothelial wall (margination) and then actively squeeze through endothelial intercellular junctions into the infected tissue spaces[cite: 1]. What is the physiological term for this process[cite: 1]?", a: ["Opsonization", "Chemotaxis", "Diapedesis", "Clot retraction", "Hemostasis"], c: 2, r: "Diapedesis (or transmigration) is the step where marginated leukocytes squeeze between endothelial cells across the basement membrane into extravascular tissue[cite: 1]." },
        // Q30[cite: 1]
        { cat: 1, q: "A 62-year-old female is diagnosed with pernicious anemia following total gastrectomy[cite: 1]. Because she lacks gastric intrinsic factor and cannot absorb oral cobalamin, parenteral replacement therapy is initiated[cite: 1]. Which injectable preparation is preferred in clinical practice because it is more highly protein-bound and remains longer in the circulation[cite: 1]?", a: ["Oral folic acid", "Hydroxocobalamin", "Ferrous gluconate", "Phylloquinone (Vitamin K1)", "Erythropoietin alpha"], c: 1, r: "Hydroxocobalamin is the preferred injectable form because it binds more tightly to plasma transport proteins and exhibits a longer circulating half-life compared to cyanocobalamin[cite: 1]." }
    ];

    let cur = 0;
    let state = JSON.parse(localStorage.getItem('cvb351_tbl1_v1')) || { answers: {}, flagged: [] };
    let chart;

    function wipe() { 
        if(confirm("Wipe all progress for TBL 1?")) { 
            localStorage.removeItem('cvb351_tbl1_v1'); 
            location.reload(); 
        } 
    }

    function updateChart() {
        const scores = [0, 0, 0, 0], counts = [0, 0, 0, 0];
        Object.keys(state.answers).forEach(k => {
            const q = fullPool[k];
            if(!q) return; 
            counts[q.cat]++;
            if(state.answers[k] === q.c) scores[q.cat]++;
        });
        
        const perf = scores.map((s, i) => counts[i] === 0 ? 0 : Math.round((s / counts[i]) * 100));
        const ctx = document.getElementById('radarChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Anatomy & Proc', 'RBCs & Anemias', 'Hemostasis & Coag', 'Neoplasia & Micro'],
                datasets: [{ 
                    data: perf, 
                    backgroundColor: 'rgba(244, 63, 94, 0.2)', 
                    borderColor: '#f43f5e', 
                    pointBackgroundColor: '#f43f5e' 
                }]
            },
            options: { 
                scales: { 
                    r: { 
                        min: 0, 
                        max: 100, 
                        ticks: { display: false }, 
                        grid: { color: 'rgba(255,255,255,0.05)' }, 
                        pointLabels: { color: '#94a3b8', font: { size: 9, weight: 'bold' } } 
                    } 
                }, 
                plugins: { legend: { display: false } } 
            }
        });
    }

    function render() {
        const grid = document.getElementById('matrix');
        grid.innerHTML = '';
        fullPool.forEach((d, i) => {
            const n = document.createElement('div');
            n.className = `node ${i === cur ? 'active' : ''} ${state.flagged.includes(i) ? 'flagged' : ''}`;
            if(state.answers[i] !== undefined) n.classList.add(state.answers[i] === d.c ? 'correct' : 'wrong');
            n.innerText = i + 1;
            n.onclick = () => { cur = i; render(); };
            grid.appendChild(n);
        });

        updateChart();
        const d = fullPool[cur];
        document.getElementById('pID').innerText = `CVS // Q${String(cur + 1).padStart(2, '0')}`;
        document.getElementById('qBody').innerText = d.q;
        
        const list = document.getElementById('optList');
        list.innerHTML = '';
        document.getElementById('ratBox').style.display = 'none';

        d.a.forEach((txt, i) => {
            const opt = document.createElement('div');
            opt.className = `opt-item ${state.answers[cur] !== undefined ? (i === d.c ? 'correct' : (i === state.answers[cur] ? 'wrong' : '')) : ''}`;
            opt.innerHTML = `<span class="opt-index">0${i+1}</span> ${txt}`;
            if(state.answers[cur] === undefined) {
                opt.onclick = () => { 
                    state.answers[cur] = i; 
                    localStorage.setItem('cvb351_tbl1_v1', JSON.stringify(state)); 
                    render(); 
                };
            }
            list.appendChild(opt);
        });

        if(state.answers[cur] !== undefined) {
            document.getElementById('ratBox').innerText = d.r;
            document.getElementById('ratBox').style.display = 'block';
        }
    }

    function proceed() { 
        if(cur < fullPool.length - 1) { 
            cur++; 
            render(); 
        } 
    }

    function prev() { 
        if(cur > 0) { 
            cur--; 
            render(); 
        } 
    }

    function toggleFlag() { 
        if(state.flagged.includes(cur)) {
            state.flagged = state.flagged.filter(id => id !== cur);
        } else {
            state.flagged.push(cur);
        }
        localStorage.setItem('cvb351_tbl1_v1', JSON.stringify(state)); 
        render(); 
    }

    render();
</script>
</body>
</html>

    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #f43f5e; /* Crimson for CVS */
            --accent-gold: #fbbf24;
            --success: #10b981;
            --danger: #f43f5e;
            --flag: #f59e0b;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }

        .nav-header { padding: 0.85rem 2rem; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100; gap: 1rem; }

        /* In-Engine Mode Switcher */

            display: flex;
            background: rgba(15, 23, 42, 0.8);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
            gap: 4px;
        }
        .mode-tab {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mode-tab:hover { color: #fff; }
        .mode-tab.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px rgba(244, 63, 94, 0.4);
        }
        .mode-tab.past-active {
            background: var(--accent-gold);
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(251, 191, 36, 0.4);
        }

        .app-grid { display: grid; grid-template-columns: 340px 1fr; flex: 1; overflow: hidden; }

        .sidebar { background: rgba(15, 23, 42, 0.4); border-right: 1px solid var(--border); padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
        .chart-wrapper { height: 220px; width: 100%; position: relative; }
        
        .label-id { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; font-weight: 800; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block; }
        .matrix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
        .node { aspect-ratio: 1; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 600; cursor: pointer; color: var(--text-dim); position: relative; transition: all 0.2s; }
        .node.active { border-color: var(--accent); background: rgba(244, 63, 94, 0.12); color: white; }
        .node.past-active { border-color: var(--accent-gold); background: rgba(251, 191, 36, 0.15); color: white; }
        .node.correct { border-color: var(--success); color: var(--success); }
        .node.wrong { border-color: var(--danger); color: var(--danger); }
        .node.flagged::before { content: ''; position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; background: var(--flag); border-radius: 50%; border: 2px solid var(--bg); }

        .stage { padding: 2rem 3rem; display: flex; justify-content: center; overflow-y: auto; }
        .content-wrap { max-width: 800px; width: 100%; }

        .proc-header { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-size: 0.75rem; margin-bottom: 1rem; opacity: 0.8; }
        .q-text { font-size: 1.25rem; font-weight: 700; line-height: 1.5; margin-bottom: 2rem; color: #fff; }

        .options { display: grid; gap: 0.85rem; }
        .opt-item { background: var(--panel); border: 1px solid var(--border); padding: 1.15rem 1.5rem; border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 1.25rem; font-size: 0.98rem; font-weight: 500; transition: 0.2s; }
        .opt-item:hover { border-color: var(--accent); transform: translateX(6px); }
        .opt-item.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .opt-item.wrong { border-color: var(--danger); background: rgba(244, 63, 94, 0.1); color: var(--danger); }
        .opt-index { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; opacity: 0.4; flex-shrink: 0; }

        .rationale { margin-top: 2rem; padding: 1.5rem; background: rgba(30, 41, 59, 0.6); border-left: 4px solid var(--accent); border-radius: 10px; display: none; line-height: 1.6; color: var(--text-dim); font-size: 0.92rem; }

        .action-row { margin-top: 2.5rem; display: flex; gap: 1rem; }
        .btn-ui { padding: 0.9rem 1.75rem; border-radius: 10px; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; border: none; transition: 0.2s; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.05); }
        .btn-next { background: var(--accent); color: #fff; flex: 1; box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3); }
        .btn-next:hover { opacity: 0.95; }
        
        .hub-link { color: var(--text-dim); text-decoration: none; font-size: 0.7rem; font-weight: 700; transition: 0.2s; }
        .hub-link:hover { color: var(--accent); }

<script>
    // Categories:
    // 0: Anatomy & Imaging (Cardiac Topography, Auscultation, Valves, Vessels, Radiology)
    // 1: Erythrocytes & Transfusion (RBC Physiology, Anemias, Immunohematology)
    // 2: Hemostasis & Thrombosis (Platelets, Coagulation Cascade, Anticoagulants, Fibrinolytics)
    // 3: Neoplasia & Host Defense (Leukocytes, Lymphomas, Microorganisms, Immunosurveillance)

    // Pool 1: 30 Core Practice Questions
    const corePool = [
        { cat: 0, q: "A 48-year-old female with a history of untreated rheumatic fever presents with worsening dyspnea, progressive difficulty swallowing solid food, and persistent voice hoarseness over the past several months. Laryngoscopy reveals paralysis of the left vocal cord, and imaging shows an enlarged heart chamber compressing the adjacent esophagus and left recurrent laryngeal nerve. Which cardiac chamber forms this base and is most posteriorly situated?", a: ["Right ventricle", "Left ventricle", "Left atrium", "Right atrium", "Superior vena cava"], c: 2, r: "The left atrium forms the base and is the most posterior part of the heart. Enlargement of the left atrium (such as in mitral stenosis) can compress the esophagus (causing dysphagia) and the left recurrent laryngeal nerve (Ortner syndrome, causing hoarseness)." },
        { cat: 0, q: "A medical student is performing a cardiovascular physical examination on a healthy 20-year-old volunteer. To assess the normal physiological closure of the mitral valve (component of S1) and the cardiac apex beat, where should the stethoscope diaphragm be placed on the thoracic wall?", a: ["2nd intercostal space at the right sternal border", "2nd intercostal space at the left sternal border", "5th intercostal space at the lower left sternal border", "Left 5th intercostal space at the midclavicular line", "Subcostal space directly inferior to the xiphisternal joint"], c: 3, r: "The auscultation position for the mitral valve (and apex) is at the left 5th intercostal space at the midclavicular line (MCL). The 2nd right ICS is aortic, 2nd left ICS is pulmonary, and 5th left ICS at the lower sternal edge is tricuspid." },
        { cat: 0, q: "A 35-year-old male with acute purulent pericarditis develops acute hemodynamic collapse from cardiac tamponade. An emergency blind subxiphoid pericardiocentesis is performed. What is the standard anatomical entry site and needle angle recommended for this emergency approach to avoid entering the pleura?", a: ["Left 5th intercostal space 1–2 cm lateral to the apex beat at 90 degrees", "Left 5th intercostal space directly adjacent to the sternum at 60 degrees", "1 cm inferior to the left xiphocostal angle angled at 30 to 45 degrees", "Directly through the middle third of the sternal body perpendicularly", "Right 2nd intercostal space at the midclavicular line at 45 degrees"], c: 2, r: "The traditional subxiphoid/subcostal approach is performed by inserting the needle ~1 cm inferior to the left xiphocostal (xiphichondral) angle at an angle of 30 to 45 degrees to the chest, pointing superoposteriorly to avoid pleural and lung injury." },
        { cat: 0, q: "A 69-year-old male presents with acute substernal chest pain. Cardiac catheterization reveals complete thrombotic occlusion of the artery that runs in the posterior interventricular groove supplying the posterior 1/3 of the interventricular septum and the AV node. In the majority of people (right-dominant circulation), from which parent vessel does this posterior interventricular artery (PDA) arise?", a: ["Left anterior descending artery (LAD)", "Right coronary artery (RCA)", "Circumflex branch of left coronary artery", "Left marginal artery", "Internal thoracic artery"], c: 1, r: "The posterior interventricular branch (PDA) arises from the Right Coronary Artery (RCA) in right-dominant circulation, which is the most common pattern in humans. The RCA also supplies the AV node in ~80% of individuals and the posterior 1/3 of the interventricular septum." },
        { cat: 0, q: "A 56-year-old male undergoes electrophysiological pacing and catheter ablation for a supraventricular arrhythmia. The operator uses an anatomical triangle in the right atrium to locate the atrioventricular (AV) node. Which three structures form the boundaries of the Triangle of Koch?", a: ["Crista terminalis, fossa ovalis, and IVC orifice", "Tendon of Todaro, annulus of tricuspid valve, and opening of coronary sinus", "Sulcus terminalis, pectinate muscles, and SVC orifice", "Conus arteriosus, membranous septum, and pulmonary valve", "Interatrial septum, fossa ovalis, and Eustachian valve"], c: 1, r: "The Triangle of Koch is the key landmark for locating the AV node during pacing or ablation. Its three boundaries are the opening of the coronary sinus, the Tendon of Todaro, and the annulus of the tricuspid valve." },
        { cat: 1, q: "A 24-year-old Mediterranean male presents for routine screening. Complete blood count reveals: Hb 11.0 g/dL, RBC count 5.5 x 10^6/µL (elevated), MCV 70 fL (low), and RDW 12.5% (normal). Which diagnosis is best supported by this profile of a high RBC count and normal RDW alongside microcytosis?", a: ["Iron deficiency anemia", "Anemia of chronic disease", "Thalassemia (alpha or beta trait)", "Megaloblastic anemia", "Lead poisoning"], c: 2, r: "Both alpha- and beta-thalassemia feature low MCV (70 fL) with elevated RBC counts (~5.5 x 10^6/µL) and normal RDW (12.5%). Iron deficiency anemia presents with low RBC count and elevated RDW (>15%)." },
        { cat: 1, q: "A 59-year-old female presents with persistent fatigue, smooth sore tongue, and lower extremity paresthesias. A complete blood count reveals Hb 9.5 g/dL, MCV 112 fL, and an elevated RDW. What classic morphological finding on the peripheral blood smear (PBS) confirms a megaloblastic etiology?", a: ["Target cells with basophilic stippling", "Spherocytes lacking central pallor", "Hypersegmented neutrophils with 5 or more nuclear lobes", "Pelger-Huet anomaly with bilobed neutrophils", "Sickled crescent-shaped erythrocytes"], c: 2, r: "Hypersegmented neutrophils (5 or more nuclear lobes) on the peripheral blood smear are the diagnostic hallmark of megaloblastic macrocytic anemia (due to Vitamin B12 or folate deficiency)." },
        { cat: 1, q: "A 45-year-old female with long-standing rheumatoid arthritis develops anemia. Lab studies show low serum iron, a normal or decreased Total Iron Binding Capacity (TIBC), and an elevated serum ferritin level. Which condition is defined by this specific iron profile?", a: ["Iron deficiency anemia", "Anemia of chronic disease", "Hemochromatosis (Iron overload)", "Thalassemia major", "Aplastic anemia"], c: 1, r: "Anemia of Chronic Disease exhibits decreased serum iron, normal or increased serum ferritin (acute phase reactant/inflammatory condition), and normal or decreased TIBC." },
        { cat: 1, q: "A 31-year-old male presents with recurrent episodes of dark-colored morning urine and is found to have hepatic vein thrombosis. Flow cytometry confirms an acquired genetic defect in hematopoietic cells causing deficiency of CD59 (membrane inhibitor of reactive lysis), rendering erythrocytes vulnerable to complement-mediated attack. What is the underlying disorder?", a: ["Hereditary spherocytosis", "Hereditary elliptocytosis", "Paroxysmal nocturnal hemoglobinuria", "Sickle cell anemia", "Autoimmune hemolytic anemia"], c: 2, r: "Paroxysmal Nocturnal Hemoglobinuria (PNH) is the only hemolytic anemia caused by an acquired genetic defect—a mutation in the PIGA gene leading to deficiency in GPI-anchored proteins such as CD59, making cells susceptible to the membrane attack complex (MAC) of complement and predisposing to thrombosis." },
        { cat: 1, q: "A 26-year-old male from the Mediterranean region presents with jaundice and acute fatigue after taking an oxidative medication. Genetic analysis reveals an X-linked recessive disorder that impairs the regeneration of reduced NADPH, leaving erythrocytes defenseless against oxidative damage and causing cellular lysis. Which enzyme is deficient?", a: ["Pyruvate kinase", "Glucose-6-phosphate dehydrogenase (G6PD)", "5-aminolevulinate synthase (ALAS2)", "Proerythroblast kinase", "Ferrochelatase"], c: 1, r: "G6PD deficiency is an inherited X-linked recessive hemolytic anemia common in Mediterranean and Middle Eastern populations. G6PD is necessary to make NADPH to protect the RBC from oxidants; in its absence, the cell sustains oxidative damage and undergoes lysis." },
        { cat: 2, q: "A 10-year-old boy presents with hemarthrosis of the knee. Blood testing reveals a prolonged activated partial thromboplastin time (aPTT) of 55 seconds (normal 26–33 seconds) with a completely normal prothrombin time (PT). Which set of clotting factors is evaluated by this intrinsic pathway test?", a: ["Factors VII, X, V, and prothrombin only", "Factors XII, XI, IX, and VIII", "Factor VII and Tissue Factor only", "Factor XIII only", "Platelet aggregation glycoproteins only"], c: 1, r: "aPTT measures the integrity of the intrinsic system (Factors XII, XI, IX, and VIII) and the common pathway. The extrinsic pathway (tested by PT) evaluates Factor VII, Tissue Factor, and the common pathway." },
        { cat: 2, q: "A 68-year-old male with deep vein thrombosis is placed on oral warfarin therapy. His physician checks his prothrombin time (PT) and International Normalized Ratio (INR) to guide dosing. Warfarin produces an anticoagulant effect by inhibiting the synthesis of which group of Vitamin K-dependent clotting factors?", a: ["Factors XII, XI, IX, and VIII", "Factors II, VII, IX, and X", "Factors I, V, and XIII", "Tissue factor and Platelet Factor 4", "Factors VIII and vWF only"], c: 1, r: "The Vitamin K-dependent clotting factors affected by oral anticoagulants like warfarin are Factors II (prothrombin), VII, IX, and X (as well as regulatory proteins C and S)." },
        { cat: 2, q: "A 52-year-old hospitalized patient receives unfractionated heparin for acute pulmonary embolism. Heparin binds antithrombin III to accelerate the inactivation of key clotting proteases. Which laboratory coagulation test is routinely used to monitor the anticoagulant effect of unfractionated heparin?", a: ["Prothrombin time (PT)", "Activated partial thromboplastin time (aPTT)", "Bleeding time (BT)", "Fibrinogen level alone", "Direct antiglobulin test"], c: 1, r: "Unfractionated heparin primarily affects factors within the intrinsic and common pathways (inactivating thrombin, Xa, IXa, XIa, XIIa). Therefore, therapy is monitored using the activated partial thromboplastin time (aPTT)." },
        { cat: 2, q: "A 64-year-old male with stable coronary artery disease takes daily low-dose aspirin for cardioprotection. What is the molecular mechanism of action of aspirin in preventing thrombus formation?", a: ["Reversible competitive inhibition of phosphodiesterase", "Irreversible inhibition of platelet cyclooxygenase-1 (COX-1)", "Direct blockade of the GP IIb/IIIa fibrinogen receptor", "Inactivation of thrombin (Factor IIa)", "Inhibition of ADP binding to purinergic receptors"], c: 1, r: "Aspirin achieves its antiplatelet effect by irreversibly inhibiting platelet cyclooxygenase-1 (COX-1), which blocks the conversion of arachidonic acid to thromboxane A2 (TXA2), a potent stimulator of platelet aggregation and vasoconstriction." },
        { cat: 2, q: "A 28-year-old male presents with recurrent deep vein thrombosis. Testing reveals that his Factor V possesses a point mutation replacing glutamine with arginine at position 506 (Factor V Leiden), rendering it resistant to inactivation. Under normal physiological conditions, which two proteins form the anticoagulant complex that cleaves and inactivates normal Factor Va and Factor VIIIa?", a: ["Antithrombin III and Heparin", "Protein C and Protein S", "Tissue factor and Factor VIIa", "Plasmin and tPA", "Kallikrein and HMW kininogen"], c: 1, r: "Active Protein C together with its cofactor Protein S normally controls the proteolytic breakdown and inactivation of Factor Va and Factor VIIIa." },
        { cat: 2, q: "A 58-year-old male presents with persistent headaches, dizziness, pruritus, bleeding gums, and a ruddy facial complexion. Physical examination demonstrates marked hepatosplenomegaly, and a CBC reveals an elevated hematocrit of 62%. What is the standard first-line therapeutic management used to rapidly decrease blood volume and prevent thrombosis in this disorder?", a: ["Total bone marrow irradiation", "Phlebotomy", "High-dose Vitamin B12 supplementation", "Oral iron replacement therapy", "Emergency splenectomy"], c: 1, r: "Polycythemia Rubra Vera presents with a high haematocrit (60% or more) and hyperviscosity. First-line management is phlebotomy to quickly decrease blood volume, lower red cell mass, and prevent thrombosis." },
        { cat: 3, q: "A 3-year-old child presents with a sudden stormy onset of lethargy, pallor, petechial hemorrhages, and bone pain. Peripheral blood smear demonstrates lymphoblasts with a high N:C ratio that stain positive for CD19, CD10, and TdT. Which statement regarding the epidemiologic incidence of this leukemia is correct based on the lecture?", a: ["It represents the most common adult leukemia, presenting typically over age 65", "It is the most common childhood cancer, with the peak incidence of B-ALL occurring at 3 years of age", "It originates primarily from T cells in over 85% of pediatric cases", "Peak incidence occurs exclusively in the neonatal period during the first week of life", "It is an acquired disorder that occurs almost exclusively in middle-aged men"], c: 1, r: "ALL is the most common childhood cancer. Peak incidence of B-ALL is 3 years of age. 85% of cases originate from B cells and 15% from T cells." },
        { cat: 3, q: "A hospital morbidity committee is reviewing missed leukemia diagnoses in an outpatient department. The pathology lecturer highlights that low-grade indolent neoplasms can easily be overlooked early in their course due to non-specific B symptoms and neoplastic cells resembling normal mature lymphocytes. Which malignancy was specifically highlighted as 'most likely to be missed clinically by busy doctors in a busy hospital'?", a: ["Acute lymphoblastic leukemia (ALL)", "Chronic lymphocytic leukaemia / Mycosis fungoides", "Acute myelogenous leukemia (AML)", "Burkitt lymphoma", "Multiple myeloma"], c: 1, r: "Chronic lymphocytic leukaemia / Mycosis fungoides was specifically highlighted as the neoplasm most likely to be missed clinically in outpatient settings due to indolent progression and mature morphology." },
        { cat: 3, q: "A 23-year-old female presents with painless cervical lymphadenopathy and a mediastinal mass seen on chest radiograph. Biopsy reveals bands of collagen dividing the node into circumscribed nodules containing lacunar variants of Reed-Sternberg cells that are CD15+ and CD30+. Which subtype of Hodgkin lymphoma is this, and what is its associated clinical prognosis?", a: ["Lymphocyte depleted; poor prognosis", "Nodular sclerosis; excellent prognosis", "Mixed cellularity; poor prognosis", "Lymphocyte predominance; poor prognosis", "Mycosis fungoides; rapidly fatal"], c: 1, r: "Nodular Sclerosis Hodgkin lymphoma features collagen bands, lacunar Reed-Sternberg cells, female and young adult predominance, mediastinal involvement, and carries an excellent prognosis." },
        { cat: 3, q: "A 60-year-old male presents with widespread peripheral lymphadenopathy involving multiple non-contiguous lymph node chains as well as extranodal disease in the stomach. On the differential diagnosis, the pathologist distinguishes Hodgkin from Non-Hodgkin lymphoma. Which feature is characteristic of Non-Hodgkin lymphoma compared to Hodgkin lymphoma?", a: ["Orderly, contiguous spread along a single node chain", "Common involvement of Waldeyer's ring and mesenteric nodes", "Almost complete absence of extranodal involvement", "Presence of pathognomonic diagnostic Reed-Sternberg cells", "Rare involvement of multiple peripheral nodes"], c: 1, r: "Non-Hodgkin lymphoma characteristically exhibits non-contiguous spread, common involvement of Waldeyer's ring and mesenteric lymph nodes, and frequent extranodal disease (such as GI tract involvement)." },
        { cat: 3, q: "A 68-year-old male presents with severe bone pain and recurrent pulmonary infections. Radiographs demonstrate numerous punched-out osteolytic bone lesions of the skull and ribs. Laboratory evaluation reveals hypercalcemia and free light chains in the urine. What are these urine light chains termed?", a: ["Russell bodies", "Dutcher bodies", "Bence-Jones proteins", "M-components", "Cryoglobulins"], c: 2, r: "Free light chains synthesized in excess by neoplastic plasma cells pass through the glomerulus into the urine, where they are designated as Bence-Jones proteins." },
        { cat: 3, q: "A 52-year-old male with an underlying bicuspid aortic valve develops low-grade fever and fatigue several weeks after an extensive dental cleaning. Blood cultures yield alpha-hemolytic Gram-positive cocci in chains. Which organism from the oral microbiome is the classic cause of subacute bacterial endocarditis following dental procedures?", a: ["Staphylococcus aureus", "Viridans streptococci", "Enterococcus faecalis", "Streptococcus gallolyticus", "Pseudomonas aeruginosa"], c: 1, r: "Viridans group streptococci are normal commensals of the oral cavity that enter the bloodstream during dental manipulation and colonize previously damaged or abnormal cardiac valves, leading to subacute infective endocarditis." },
        { cat: 3, q: "A hospitalized patient with an indwelling central venous catheter develops rigors and a temperature of 39.2°C. Sepsis is suspected, and blood cultures are ordered before antimicrobial administration. What is the recommended total blood volume for an adult blood culture draw to optimize diagnostic yield?", a: ["2 to 5 mL total", "5 to 10 mL total", "40 to 60 mL total across at least two sets", "100 to 150 mL total", "1 mL per bottle only"], c: 2, r: "Guidelines specify drawing at least two distinct sets totaling 40–60 mL of blood in adults to maximize diagnostic yield and differentiate true bacteremia from skin contaminants." },
        { cat: 3, q: "Blood culture from a septic patient with a central line grows Gram-positive cocci in clusters. The microbiologist performs a rapid chemical test using 3% hydrogen peroxide (H2O2) and observes vigorous oxygen bubbling. A subsequent coagulase test produces a firm plasma clot. Which pathogen has been identified?", a: ["Streptococcus pneumoniae", "Staphylococcus aureus", "Coagulase-negative staphylococci (e.g. S. epidermidis)", "Enterococcus faecalis", "Streptococcus pyogenes"], c: 1, r: "Catalase positivity (bubbling with H2O2) differentiates Staphylococci from Streptococci. Coagulase positivity (plasma clot formation) specifically identifies Staphylococcus aureus." },
        { cat: 3, q: "A 17-year-old patient with relapsed acute lymphoblastic leukemia (ALL) receives Chimeric Antigen Receptor (CAR) T-cell therapy. According to the cancer immunotherapy lecture, which cell-surface antigen is targeted by this engineered therapy to treat ALL?", a: ["HER-2/neu", "CD19", "CTLA-4", "VEGF", "PD-L1"], c: 1, r: "CAR T-cell therapies in B-ALL are engineered to target the pan-B-cell marker CD19, which is uniformly expressed on malignant B lymphoblasts." },
        { cat: 1, q: "A 30-year-old resident of a high-altitude mountain village is evaluated. Laboratory testing reveals a physiological secondary absolute polycythemia with elevated circulating red blood cell mass. Which physiological parameter provides the primary stimulus for kidney production of erythropoietin?", a: ["Hyperglycemia", "Tissue hypoxia", "Hypocalcemia", "Elevated systemic blood pressure", "Dehydration"], c: 1, r: "Tissue hypoxia sensed by interstitial peritubular fibroblasts in the renal cortex is the primary physiological trigger that upregulates erythropoietin production." },
        { cat: 2, q: "A laboratory researcher studies the ultrastructure of human platelets. She isolates platelet cytoplasmic granules and analyzes their contents. Which substance is stored specifically within platelet dense granules rather than alpha-granules?", a: ["Platelet-derived growth factor (PDGF)", "Fibrinogen and clotting factors", "Serotonin and ADP", "von Willebrand factor", "Fibronectin"], c: 2, r: "Dense granules store non-protein secondary messengers such as ADP, ATP, calcium, and serotonin. Alpha-granules contain high molecular weight proteins such as fibrinogen, vWF, and PDGF." },
        { cat: 1, q: "An Rh-negative mother delivers an Rh-positive newborn. Sensitization typically occurs during delivery when fetal red cells enter the maternal circulation, placing subsequent Rh-positive pregnancies at risk for hemolytic disease of the newborn. What postpartum medical prophylaxis is administered to prevent active maternal antibody formation?", a: ["Intravenous broad-spectrum penicillin", "Single dose of Rh immune globulin (anti-Rh antibodies)", "High-dose intramuscular vitamin K injection", "Oral ferrous sulfate supplementation", "Phototherapy applied to the mother"], c: 1, r: "Administering a single postpartum dose of Rh immune globulin (anti-D antibodies) binds and clears fetal Rh+ erythrocytes before the mother's immune system mounts an active humoral response." },
        { cat: 2, q: "During acute localized bacterial tissue inflammation, circulating neutrophils are recruited from the bloodstream. They lie along the capillary endothelial wall (margination) and then actively squeeze through endothelial intercellular junctions into the infected tissue spaces. What is the physiological term for this process?", a: ["Opsonization", "Chemotaxis", "Diapedesis", "Clot retraction", "Hemostasis"], c: 2, r: "Diapedesis (or transmigration) is the step where marginated leukocytes squeeze between endothelial cells across the basement membrane into extravascular tissue." },
        { cat: 1, q: "A 62-year-old female is diagnosed with pernicious anemia following total gastrectomy. Because she lacks gastric intrinsic factor and cannot absorb oral cobalamin, parenteral replacement therapy is initiated. Which injectable preparation is preferred in clinical practice because it is more highly protein-bound and remains longer in the circulation?", a: ["Oral folic acid", "Hydroxocobalamin", "Ferrous gluconate", "Phylloquinone (Vitamin K1)", "Erythropoietin alpha"], c: 1, r: "Hydroxocobalamin is the preferred injectable form because it binds more tightly to plasma transport proteins and exhibits a longer circulating half-life compared to cyanocobalamin." }

        { cat: 1, q: "A medical student examines bone marrow precursors under oil immersion microscopy. Which erythroid precursor represents the earliest cell in the erythropoietic series that has completely extruded its nucleus before entering peripheral circulation?", a: ["Proerythroblast", "Basophilic erythroblast", "Orthochromatic erythroblast (normoblast)", "Reticulocyte", "Myeloblast"], c: 3, r: "The orthochromatic erythroblast extrudes its nucleus in the bone marrow to become a reticulocyte. The reticulocyte is non-nucleated, containing only residual ribosomal RNA and organelles before maturing into an erythrocyte." },
        { cat: 0, q: "During a cardiac electrophysiology mapping procedure, the operator navigates a catheter to the primary natural pacemaker of the heart. What is the exact anatomical location of the sinoatrial (SA) node?", a: ["Posteroinferior region of the interatrial septum near the coronary sinus", "Anterolaterally just deep to the epicardium at the junction of the SVC and right atrium", "Within the inferior border of the muscular interventricular septum", "Deep within the septomarginal trabecula (moderator band)", "Directly beneath the left auricle in the atrioventricular groove"], c: 1, r: "The SA node is situated anterolaterally just deep to the epicardium at the junction of the superior vena cava (SVC) and the right atrium (RA)." },

        { cat: 2, q: "A cardiologist prescribes clopidogrel rather than abciximab for secondary stroke prevention. How does clopidogrel inhibit the final common pathway of platelet aggregation mediated by Glycoprotein IIb/IIIa?", a: ["By direct competitive binding to the GP IIb/IIIa receptor site", "Indirectly, by irreversibly blocking the purinergic P2Y12 ADP receptor", "By permanently acetylating platelet cyclooxygenase-1 (COX-1)", "By chelating extracellular calcium ions required for fibrinogen binding", "By activating adenylate cyclase to raise intracellular cAMP levels"], c: 1, r: "Clopidogrel does NOT directly bind the GP IIb/IIIa receptor. Instead, its active metabolite irreversibly blocks platelet P2Y12 ADP receptors, which indirectly prevents the conformational activation of GP IIb/IIIa required for fibrinogen binding." },

        { cat: 2, q: "A 63-year-old male receives alteplase (recombinant tissue plasminogen activator, tPA) 90 minutes after the onset of acute myocardial infarction. What is the precise pharmacological mechanism of action of alteplase?", a: ["Binds directly to antithrombin III to inhibit Factor Xa", "Converts circulating and clot-bound plasminogen directly into active plasmin", "Blocks thromboxane synthase in aggregating platelets", "Degrades prothrombin directly into inactive peptide fragments", "Inactivates Factor Va and Factor VIIIa via proteolysis"], c: 1, r: "Alteplase is a thrombolytic agent that mimics endogenous tPA by enzymatically converting the inactive proenzyme plasminogen into active plasmin, which then lyses cross-linked fibrin meshes within clots." },
        { cat: 2, q: "A neonate presents on the first day of life with severe disseminated cutaneous thrombosis, black necrotic skin patches, and cardiovascular collapse diagnosed as purpura fulminans. Genetic analysis demonstrates a severe homozygous deficiency of an anticoagulant cofactor. Which inherited deficiency shares this life-threatening presentation alongside homozygous Protein C deficiency?", a: ["Protein S deficiency", "Antithrombin III deficiency", "Factor V Leiden mutation", "Factor VIII elevation", "Sticky platelet syndrome"], c: 0, r: "The thromboembolic disorders lecture explicitly notes that while mild Protein S deficiency manifests as adult DVT, the severe homozygous form manifests in infancy as life-threatening purpura fulminans, identical to severe Protein C deficiency." },

        { cat: 1, q: "A 32-year-old male with Paroxysmal Nocturnal Hemoglobinuria (PNH) notices that his dark urine and intravascular hemolysis are predominantly severe when he voids first thing upon waking in the morning. What physiological change occurs during sleep that accelerates complement-mediated attack on his deficient red cells?", a: ["Elevation of core body temperature", "Slight drop in plasma pH (mild respiratory acidosis) during sleep that activates complement", "Massive surges in daytime growth hormone", "Suppression of bone marrow reticulocyte release at night", "Dehydration-induced hemoconcentration"], c: 1, r: "During nighttime sleep, shallow respiration leads to mild CO2 retention and a slight physiological drop in systemic pH (mild acidosis), which directly enhances alternative complement pathway activity and Membrane Attack Complex (MAC) lysis." },
        { cat: 1, q: "A 60-year-old male undergoes total gastrectomy for gastric adenocarcinoma, completely removing his source of intrinsic factor. To prevent the inevitable onset of macrocytic megaloblastic anemia, he requires life-long parenteral cobalamin. Which injectable preparation of Vitamin B12 is clinically preferred because it binds more tightly to plasma proteins and remains longer in circulation?", a: ["Oral cyanocobalamin", "Hydroxocobalamin", "Oral folic acid", "Ferrous fumarate", "Erythropoietin"], c: 1, r: "The Vitamin B12 lecture specifies that hydroxocobalamin is the preferred injectable formulation for clinical replacement because it is more highly protein-bound (to transcobalamins) and remains in circulation longer than cyanocobalamin." },
        { cat: 3, q: "A peripheral blood smear differential from a healthy adult is reviewed. Which white blood cell type normally accounts for the highest percentage (50% to 70%) of circulating leukocytes?", a: ["Monocytes", "Eosinophils", "Neutrophils", "Lymphocytes", "Basophils"], c: 2, r: "Neutrophils (polymorphonuclear leukocytes) are the most abundant leukocyte in normal human peripheral blood, comprising 50% to 70% of the total leukocyte count." },

        { cat: 3, q: "Monocytes circulate in peripheral blood for approximately 72 hours before extravasating via diapedesis into connective tissue and visceral organs to differentiate into tissue macrophages. What is the principal host defense mechanism executed by these mononuclear cells?", a: ["Direct secretion of pentameric IgM antibodies", "Phagocytosis and intracellular killing of bacteria, damaged cells, and cellular debris", "Heparin release to maintain microvascular blood flow", "Degranulation of histamine in immediate hypersensitivity", "Clot retraction via intracellular myosin"], c: 1, r: "The primary function of monocytes and their differentiated tissue macrophage counterparts (e.g., Kupffer cells, alveolar macrophages) is phagocytosis of bacteria, foreign invaders, and cellular debris, alongside antigen presentation to T lymphocytes." },
        { cat: 1, q: "A patient with blood type A-positive requires an emergency red blood cell transfusion. Why is packed red blood cell transfusion from an AB-negative donor strictly contraindicated in this recipient?", a: ["The donor's red cells lack the Rh D antigen", "The recipient's plasma contains anti-B antibodies that will bind and hemolyze the donor's B-antigen-bearing red cells", "The donor's plasma contains massive levels of anti-A antibodies", "The recipient's red cells will hemolyze due to anti-D agglutinins", "AB-negative blood is a universal donor type and safe for all recipients"], c: 1, r: "Type A individuals have A antigens on their red cells and natural anti-B antibodies in their plasma. Type AB red blood cells express both A and B antigens. Transfusing AB red cells into a Type A recipient causes immediate immune binding and hemolysis of donor cells by the recipient's anti-B agglutinins." },
        { cat: 2, q: "Following the formation of a definitive hemostatic blood clot, an in vitro blood collection tube is incubated for 30 to 60 minutes. The formed fibrin clot contracts and expresses serum, pulling the edges of the injured vessel closer together. Which formed blood element is directly responsible for this clot retraction via its internal actin and myosin contractile proteins?", a: ["Erythrocytes", "Platelets (thrombocytes)", "Neutrophils", "Endothelial cells", "Monocytes"], c: 1, r: "Clot retraction occurs because platelets trapped within the fibrin mesh contain contractile actin and myosin filaments that contract forcefully, consolidating the plug and reducing clot volume." },

    // Engine State
    let currentMode = 'core'; // 'core' or 'past'
    let cur = 0;
    let chart;

    function getStorageKey() {
        return currentMode === 'core' ? 'cvb351_tbl1_core_v1' : 'cvb351_tbl1_past_v1';
    }

    function getCurrentPool() {
        return currentMode === 'core' ? corePool : pastExamPool;
    }

    function getState() {
        return JSON.parse(localStorage.getItem(getStorageKey())) || { answers: {}, flagged: [] };
    }

    function saveState(s) {
        localStorage.setItem(getStorageKey(), JSON.stringify(s));
    }

    function switchMode(mode) {
        currentMode = mode;
        cur = 0;
        
        const tabCore = document.getElementById('tabCore');
        const tabPast = document.getElementById('tabPast');
        const pulse = document.getElementById('pulseDot');

        if(mode === 'core') {
            tabCore.className = 'mode-tab active';
            tabPast.className = 'mode-tab';
            pulse.style.background = 'var(--accent)';
            pulse.style.boxShadow = '0 0 10px var(--accent)';
        } else {
            tabCore.className = 'mode-tab';
            tabPast.className = 'mode-tab past-active';
            pulse.style.background = 'var(--accent-gold)';
            pulse.style.boxShadow = '0 0 10px var(--accent-gold)';
        }

        render();
    }

    function wipe() { 
        const name = currentMode === 'core' ? 'Core Practice (30 Qs)' : 'Past Exam (37 Qs)';
        if(confirm(`Wipe all progress for ${name}?`)) { 
            localStorage.removeItem(getStorageKey()); 
            render(); 
        } 
    }

    function updateChart() {
        const activePool = getCurrentPool();
        const state = getState();
        const scores = [0, 0, 0, 0], counts = [0, 0, 0, 0];
        
        Object.keys(state.answers).forEach(k => {
            const q = activePool[k];
            if(!q) return; 
            counts[q.cat]++;
            if(state.answers[k] === q.c) scores[q.cat]++;
        });
        
        const perf = scores.map((s, i) => counts[i] === 0 ? 0 : Math.round((s / counts[i]) * 100));
        const ctx = document.getElementById('radarChart').getContext('2d');
        if(chart) chart.destroy();
        
        const isCore = currentMode === 'core';
        chart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Anatomy & Imaging', 'RBCs & Transfusion', 'Hemostasis & Coag', 'Neoplasia & Defense'],
                datasets: [{ 
                    data: perf, 
                    backgroundColor: isCore ? 'rgba(244, 63, 94, 0.2)' : 'rgba(251, 191, 36, 0.2)', 
                    borderColor: isCore ? '#f43f5e' : '#fbbf24', 
                    pointBackgroundColor: isCore ? '#f43f5e' : '#fbbf24' 
                }]
            },
            options: { 
                scales: { 
                    r: { 
                        min: 0, 
                        max: 100, 
                        ticks: { display: false }, 
                        grid: { color: 'rgba(255,255,255,0.05)' }, 
                        pointLabels: { color: '#94a3b8', font: { size: 9, weight: 'bold' } } 
                    } 
                }, 
                plugins: { legend: { display: false } } 
            }
        });
    }

    function render() {
        const activePool = getCurrentPool();
        const state = getState();
        const grid = document.getElementById('matrix');
        grid.innerHTML = '';
        
        const isCore = currentMode === 'core';
        activePool.forEach((d, i) => {
            const n = document.createElement('div');
            const activeClass = isCore ? 'active' : 'past-active';
            n.className = `node ${i === cur ? activeClass : ''} ${state.flagged.includes(i) ? 'flagged' : ''}`;
            if(state.answers[i] !== undefined) n.classList.add(state.answers[i] === d.c ? 'correct' : 'wrong');
            n.innerText = i + 1;
            n.onclick = () => { cur = i; render(); };
            grid.appendChild(n);
        });

        updateChart();
        const d = activePool[cur];
        const prefix = isCore ? 'TBL1 CORE // Q' : 'TBL1 PAST // Q';
        document.getElementById('pID').innerText = `${prefix}${String(cur + 1).padStart(2, '0')}`;
        document.getElementById('qBody').innerText = d.q;
        
        const list = document.getElementById('optList');
        list.innerHTML = '';
        document.getElementById('ratBox').style.display = 'none';

        d.a.forEach((txt, i) => {
            const opt = document.createElement('div');
            opt.className = `opt-item ${state.answers[cur] !== undefined ? (i === d.c ? 'correct' : (i === state.answers[cur] ? 'wrong' : '')) : ''}`;
            opt.innerHTML = `<span class="opt-index">0${i+1}</span> ${txt}`;
            if(state.answers[cur] === undefined) {
                opt.onclick = () => { 
                    state.answers[cur] = i; 
                    saveState(state); 
                    render(); 
                };
            }
            list.appendChild(opt);
        });

        if(state.answers[cur] !== undefined) {
            document.getElementById('ratBox').innerText = d.r;
            document.getElementById('ratBox').style.display = 'block';
        }
    }

    function proceed() { 
        if(cur < getCurrentPool().length - 1) { 
            cur++; 
            render(); 
        } 
    }

    function prev() { 
        if(cur > 0) { 
            cur--; 
            render(); 
        } 
    }

    function toggleFlag() { 
        const state = getState();
        if(state.flagged.includes(cur)) {
            state.flagged = state.flagged.filter(id => id !== cur);
        } else {
            state.flagged.push(cur);
        }
        saveState(state); 
        render(); 
    }

    render();
</script>
</body>
</html>

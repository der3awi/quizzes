<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Sciences Portal</title>
    <script>
        // GitHub Pages SPA router redirect
        const pathname = window.location.pathname;
        const hash = window.location.hash;
        const search = window.location.search;
        
        // Find repo base name if hosted on user.github.io/repo/
        const pathSegments = pathname.split('/').filter(Boolean);
        let repoBase = '/';
        if (pathSegments.length > 0 && window.location.hostname.includes('github.io')) {
            repoBase = '/' + pathSegments[0] + '/';
        }
        
        // Redirect to root with hash preserving module selection
        window.location.replace(repoBase + search + hash);
    </script>
    <style>
        body {
            background-color: #020617;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <p style="color: #94a3b8; font-family: monospace;">Redirecting to Clinical Sciences Portal...</p>
    </div>
</body>
</html>

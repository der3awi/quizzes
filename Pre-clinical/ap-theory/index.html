        { cat: 3, q: "Cervical and lumbar enlargements exist to accommodate innervation of the:", a: ["Viscera", "Trunk", "Limbs", "Head and neck"], c: 2, r: "Extra gray matter is required for the large motor and sensory pools of the arms and legs." },
        { cat: 3, q: "The straight sinus runs at the junction of the falx cerebri and:", a: ["Falx cerebelli", "Tentorium cerebelli", "Diaphragma sellae", "Skull bone"], c: 1, r: "The straight sinus is located where the falx cerebri meets the tentorium cerebelli." },
        { cat: 3, q: "Normal Cerebrospinal Fluid (CSF) is characterized as being:", a: ["Turbid", "Clear and colorless", "Rich in protein", "Blood-stained"], c: 1, r: "CSF should be clear (like water); turbidity or color indicates infection or hemorrhage." },
        { cat: 0, q: "An IPSP is typically caused by the opening of which channels?", a: ["Sodium", "Calcium", "Chloride or Potassium", "Magnesium"], c: 2, r: "Hyperpolarization occurs when negative Cl- enters or positive K+ leaves the cell." },
        { cat: 0, q: "A 'Tonic' receptor is one that is:", a: ["Rapidly adapting", "Slowly adapting", "Inhibitory", "Only sensitive to vibration"], c: 1, r: "Tonic receptors provide continuous information about a constant stimulus (e.g., posture)." },
        { cat: 2, q: "Adrenarche refers to the prepubertal increase in:", a: ["FSH/LH", "Ovarian estrogen", "Adrenal androgens", "Thyroid hormone"], c: 2, r: "Adrenarche is the activation of the adrenal reticularis before the onset of true puberty." },
        { cat: 3, q: "Which muscle forms the lateral wall of the ischio-anal fossa?", a: ["Levator ani", "Obturator internus", "Pubococcygeus", "Piriformis"], c: 1, r: "The ischio-anal fossa is bounded medially by the pelvic diaphragm and laterally by the obturator internus muscle." }
    ];

    let cur = 0;
    let state = JSON.parse(localStorage.getItem('ap_comp_final_v1')) || { answers: {}, flagged: [] };
    let chart;

    function wipe() { if(confirm("Clear progress?")) { localStorage.removeItem('ap_comp_final_v1'); location.reload(); } }

    function updateChart() {
        const scores = [0,0,0,0], counts = [0,0,0,0];
        Object.keys(state.answers).forEach(k => {
            const q = fullPool[k]; if(!q) return;
            counts[q.cat]++; if(state.answers[k] === q.c) scores[q.cat]++;
        });
        const perf = scores.map((s, i) => counts[i] === 0 ? 0 : Math.round((s/counts[i])*100));
        const ctx = document.getElementById('radarChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Neuro/Spinal', 'Endocrine', 'Repro/Dev', 'Anatomy/Phys'],
                datasets: [{ data: perf, backgroundColor: 'rgba(52, 152, 219, 0.2)', borderColor: '#3498db', pointBackgroundColor: '#3498db' }]
            },
            options: { scales: { r: { min: 0, max: 100, ticks: { display: false }, grid: { color: 'rgba(255,255,255,0.05)' }, pointLabels: { color: '#94a3b8', font: { size: 9, weight: 'bold' } } } }, plugins: { legend: { display: false } } }
        });
    }

    function render() {
        const grid = document.getElementById('matrix'); grid.innerHTML = '';
        fullPool.forEach((d, i) => {
            const n = document.createElement('div');
            n.className = `node ${i === cur ? 'active' : ''} ${state.flagged.includes(i) ? 'flagged' : ''}`;
            if(state.answers[i] !== undefined) n.classList.add(state.answers[i] === d.c ? 'correct' : 'wrong');
            n.innerText = i + 1; n.onclick = () => { cur = i; render(); };
            grid.appendChild(n);
        });

        updateChart();
        const d = fullPool[cur];
        document.getElementById('pID').innerText = `EXAM // Q${String(cur + 1).padStart(2, '0')}`;
        document.getElementById('qBody').innerText = d.q;
        const list = document.getElementById('optList'); list.innerHTML = '';
        document.getElementById('ratBox').style.display = 'none';

        d.a.forEach((txt, i) => {
            const opt = document.createElement('div');
            opt.className = `opt-item ${state.answers[cur] !== undefined ? (i === d.c ? 'correct' : (i === state.answers[cur] ? 'wrong' : '')) : ''}`;
            opt.innerHTML = `<span style="opacity:0.3; margin-right:15px; font-family:monospace;">0${i+1}</span> ${txt}`;
            if(state.answers[cur] === undefined) opt.onclick = () => { state.answers[cur] = i; localStorage.setItem('ap_comp_final_v1', JSON.stringify(state)); render(); };
            list.appendChild(opt);
        });

        if(state.answers[cur] !== undefined) {
            document.getElementById('ratBox').innerText = d.r; document.getElementById('ratBox').style.display = 'block';
        }
    }

    function proceed() { if(cur < fullPool.length - 1) { cur++; render(); } }
    function toggleFlag() { if(state.flagged.includes(cur)) state.flagged = state.flagged.filter(id => id !== cur); else state.flagged.push(cur); localStorage.setItem('ap_comp_final_v1', JSON.stringify(state)); render(); }
    render();
</script>
</body>
</html>

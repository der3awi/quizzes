    }

    function render() {
        const grid = document.getElementById('matrix'); grid.innerHTML = '';
        fullPool.forEach((d, i) => {
            const n = document.createElement('div');
            n.className = `node ${i === cur ? 'active' : ''} ${state.flagged.includes(i) ? 'flagged' : ''}`;
            if(state.answers[i] !== undefined) n.classList.add(state.answers[i] === d.c ? 'correct' : 'wrong');
            n.innerText = i + 1; n.onclick = () => { cur = i; render(); };
            grid.appendChild(n);
        });

        updateChart();
        const d = fullPool[cur];
        document.getElementById('pID').innerText = `STATION // Q${String(cur + 1).padStart(2, '0')}`;
        document.getElementById('qBody').innerText = d.q;
        const list = document.getElementById('optList'); list.innerHTML = '';
        document.getElementById('ratBox').style.display = 'none';

        d.a.forEach((txt, i) => {
            const opt = document.createElement('div');
            opt.className = `opt-item ${state.answers[cur] !== undefined ? (i === d.c ? 'correct' : (i === state.answers[cur] ? 'wrong' : '')) : ''}`;
            opt.innerHTML = `<span class="opt-index">0${i+1}</span> ${txt}`;
            if(state.answers[cur] === undefined) opt.onclick = () => { state.answers[cur] = i; localStorage.setItem('pod_integrated_72_v1', JSON.stringify(state)); render(); };
            list.appendChild(opt);
        });

        if(state.answers[cur] !== undefined) {
            document.getElementById('ratBox').innerText = d.r; document.getElementById('ratBox').style.display = 'block';
        }
    }

    function proceed() { if(cur < fullPool.length - 1) { cur++; render(); } }
    function toggleFlag() { if(state.flagged.includes(cur)) state.flagged = state.flagged.filter(id => id !== cur); else state.flagged.push(cur); localStorage.setItem('pod_integrated_72_v1', JSON.stringify(state)); render(); }
    render();
</script>
</body>
</html>
